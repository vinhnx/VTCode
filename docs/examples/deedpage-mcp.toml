# Opt-in anonymous deed.page MCP over Streamable HTTP.
# Merge these settings into your existing vtcode.toml; retain other providers.
[mcp]
enabled = true
experimental_use_rmcp_client = true

[[mcp.providers]]
name = "deedpage"
enabled = true
endpoint = "https://deed.page/mcp"
http_headers = { "User-Agent" = "VTCode/deedpage-mcp" }

# MCP tools reach the model under the advanced tool profile.
[tools]
profile = "advanced_vtcode"
