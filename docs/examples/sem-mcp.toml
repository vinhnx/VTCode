# Optional local code discovery. Replace SEM_REPO before enabling.
# Merge into your existing vtcode.toml; preserve other providers and security settings.
[mcp]
enabled = true

[[mcp.providers]]
name = "sem"
enabled = true
command = "npx"
args = ["-y", "@ataraxy-labs/sem@0.27.0", "mcp"]
startup_timeout_ms = 60_000

[mcp.providers.env]
SEM_REPO = "/absolute/path/to/trusted/git/repository"
SEM_NO_NETWORK = "1"
SEM_NO_TELEMETRY = "1"
