# cargo-nextest configuration for vtcode
# Reference: https://nexte.st/docs/configuration/reference/
# Local machine: Apple M5 (10 cores, 24GB, NVMe) — macOS aarch64.
# test-threads = "num-cpus" is the portable repo default (CI uses it as-is).
# check-dev.sh overrides it locally with 2x cores (capped at 20, min 4 cores):
# this suite is latency-bound, so measured wall time on this host improved from
# 41s -> 32s (vtcode-core) and 157s -> 131s (full workspace) at 20 threads.
# Set NEXTEST_TEST_THREADS to override the computed value.
# sccache wraps rustc (~53% hit rate locally); CARGO_INCREMENTAL=1 overrides
# profile.dev.incremental=false for local test builds (see check-dev.sh).

nextest-version = "0.9.140"

[store]
dir = "target/nextest"

# ── Test groups ──────────────────────────────────────────────────
# Group tests by cost/profile so profiles can refer to them.

[test-groups.slow]
max-threads = 2

[test-groups.integration]
max-threads = 4

# ── Default profile ──────────────────────────────────────────────
# Balanced for local development: runs everything, immediate feedback
# on failures.
[profile.default]
test-threads = "num-cpus"
fail-fast = true
retries = 0
status-level = "pass"
final-status-level = "flaky"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.default.junit]
path = "target/nextest/junit.xml"
store-success-output = false
store-failure-output = true

# Assign integration/e2e binaries to the integration test group
[[profile.default.overrides]]
filter = "binary(/integration|e2e|harness|pods_/)"
test-group = "integration"

# Assign slow test functions to the slow test group
[[profile.default.overrides]]
filter = "test(/slow_|bench_|heavy/)"
test-group = "slow"

# vtcode-core's headless runner tests each boot a full agent loop; ~27 of them
# in the 10-thread default pool get SIGKILLed for memory pressure on a full
# workspace run. Cap them to the 2-thread slow group so peak memory stays
# bounded while the rest of the suite keeps full parallelism (check-dev.sh
# falls back to this profile when the quick profile is unavailable).
[[profile.default.overrides]]
filter = "test(/core::agent::runner::tests::(tool_exposure|clearing)/)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# ── CI profile ────────────────────────────────────────────────────
# Comprehensive: no fail-fast, retries flaky tests, records everything.
[profile.ci]
fail-fast = false
retries = 2
status-level = "all"
final-status-level = "all"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
path = "target/nextest/ci-junit.xml"
store-success-output = false
store-failure-output = true

# Full CI gate (scripts/check.sh): same OOM guard as profile.default/quick for
# vtcode-core's memory-heavy headless runner tests.
[[profile.ci.overrides]]
filter = "test(/core::agent::runner::tests::(tool_exposure|clearing)/)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# ── Quick profile (TDD) ──────────────────────────────────────────
# Fastest iteration: skips integration/e2e/slow tests entirely,
# terminates running tests immediately on first failure. The 20s slow ceiling
# is load-aware: check-dev.sh runs this profile at 2x cores, where a CPU-bound
# test gets roughly half a core and can cross 10s. Verified 3/3 clean runs of
# 10,924 tests at 20 threads with no slow markers; fail-fast still fires on
# real assertion failures immediately.
[profile.quick]
default-filter = 'not (binary(/integration|e2e|harness|pods_/)) and not test(/slow_|bench_|heavy/)'
test-threads = "num-cpus"
fail-fast = { max-fail = 1, terminate = "immediate" }
retries = 0
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "20s", terminate-after = 1 }

# Slow runner sweep (~7.5s standalone) vs the quick ceiling: under full-gate
# parallel load it times out and fail-fast SIGTERMs siblings, poisoning the run
# with moving failures. Isolate it to the slow group and give it headroom.
[[profile.quick.overrides]]
filter = "test(headless_clearing_stages_before_compaction_capacity_sweep)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# Slow headless planning probe (~12s standalone) vs the quick ceiling:
# same isolation and headroom as the runner sweep above.
[[profile.quick.overrides]]
filter = "test(headless_planning_returns_the_actual_plan_after_distinct_shell_inspections)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# Prepared-call budget sweep (~15s standalone) vs the quick ceiling:
# same isolation and headroom as the runner sweep above.
[[profile.quick.overrides]]
filter = "test(many_prepared_tool_calls_execute_without_call_count_cap)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# OOM guard for runs that select the quick profile (plain `check-dev.sh --test`
# does; `--workspace --test` now uses the default profile): the runner module's
# headless agent tests are memory-heavy and were SIGKILLed when all 10
# quick-profile threads were busy. Keep them in the 2-thread slow group and give
# them a load-safe timeout. Verified via nextest list: this filter matches
# exactly the 27 tool_exposure/clearing runner tests.
[[profile.quick.overrides]]
filter = "test(/core::agent::runner::tests::(tool_exposure|clearing)/)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# merge_gateway tool_choice_none payload tests take ~6s standalone and crossed
# the original 10s quick ceiling under load, tripping fail-fast's SIGTERM
# cascade on 9 siblings. Isolate both variants into the slow group with headroom.
[[profile.quick.overrides]]
filter = "test(/payload_omits_callable_tools_for_tool_choice_none/)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# ── Changed profile ──────────────────────────────────────────────
# Run only tests in crates that have changed since a baseline ref.
# Used via: cargo nextest run --profile changed --changed --since HEAD~1
[profile.changed]
test-threads = "num-cpus"
fail-fast = true
retries = 0
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "30s", terminate-after = 2 }

# OOM guard for vtcode-core's memory-heavy headless runner tests (see default
# profile). The 30s ceiling is too tight for them under load either way.
[[profile.changed.overrides]]
filter = "test(/core::agent::runner::tests::(tool_exposure|clearing)/)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# ── Partition profile (CI parallel) ──────────────────────────────
# Used by .github/workflows/ci.yml. retries = 0 by policy: a check that needs a
# retry has a bug, and retrying hides it (docs/development/ci-cd.md). The junit
# record gives future shard balancing per-test times from every main run.
[profile.ci-partition]
fail-fast = false
retries = 0
status-level = "all"
final-status-level = "all"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci-partition.junit]
path = "target/nextest/ci-partition-junit.xml"
store-success-output = false
store-failure-output = true

# OOM guard for vtcode-core's memory-heavy headless runner tests (see default
# profile); keeps each CI shard from saturating its runner's memory budget.
[[profile.ci-partition.overrides]]
filter = "test(/core::agent::runner::tests::(tool_exposure|clearing)/)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }
