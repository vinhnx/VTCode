# cargo-nextest configuration for vtcode
# Reference: https://nexte.st/docs/configuration/reference/
# Local machine: Apple M5 (10 cores, 24GB, SSD) — macOS aarch64.
# test-threads = "num-cpus" auto-senses 10 cores.
# sccache wraps rustc (~53% hit rate locally); CARGO_INCREMENTAL=1 overrides
# profile.dev.incremental=false for local test builds (see check-dev.sh).

nextest-version = "0.9.140"

[store]
dir = "target/nextest"

# ── Test groups ──────────────────────────────────────────────────
# Group tests by cost/profile so profiles can refer to them.

[test-groups.slow]
max-threads = 2

[test-groups.integration]
max-threads = 4

# ── Default profile ──────────────────────────────────────────────
# Balanced for local development: runs everything, immediate feedback
# on failures.
[profile.default]
test-threads = "num-cpus"
fail-fast = true
retries = 0
status-level = "pass"
final-status-level = "flaky"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.default.junit]
path = "target/nextest/junit.xml"
store-success-output = false
store-failure-output = true

# Assign integration/e2e binaries to the integration test group
[[profile.default.overrides]]
filter = "binary(/integration|e2e|harness|pods_/)"
test-group = "integration"

# Assign slow test functions to the slow test group
[[profile.default.overrides]]
filter = "test(/slow_|bench_|heavy/)"
test-group = "slow"

# ── CI profile ────────────────────────────────────────────────────
# Comprehensive: no fail-fast, retries flaky tests, records everything.
[profile.ci]
fail-fast = false
retries = 2
status-level = "all"
final-status-level = "all"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
path = "target/nextest/ci-junit.xml"
store-success-output = false
store-failure-output = true

# ── Quick profile (TDD) ──────────────────────────────────────────
# Fastest iteration: skips integration/e2e/slow tests entirely,
# terminates running tests immediately on first failure.
[profile.quick]
default-filter = 'not (binary(/integration|e2e|harness|pods_/)) and not test(/slow_|bench_|heavy/)'
test-threads = "num-cpus"
fail-fast = { max-fail = 1, terminate = "immediate" }
retries = 0
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "10s", terminate-after = 1 }

# Slow runner sweep (~7.5s standalone) vs the 10s quick ceiling: under full-gate
# parallel load it times out and fail-fast SIGTERMs siblings, poisoning the run
# with moving failures. Isolate it to the slow group and give it headroom.
[[profile.quick.overrides]]
filter = "test(headless_clearing_stages_before_compaction_capacity_sweep)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# Slow headless planning probe (~12s standalone) vs the 10s quick ceiling:
# same isolation and headroom as the runner sweep above.
[[profile.quick.overrides]]
filter = "test(headless_planning_returns_the_actual_plan_after_distinct_shell_inspections)"
test-group = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

# ── Changed profile ──────────────────────────────────────────────
# Run only tests in crates that have changed since a baseline ref.
# Used via: cargo nextest run --profile changed --changed --since HEAD~1
[profile.changed]
test-threads = "num-cpus"
fail-fast = true
retries = 0
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "30s", terminate-after = 2 }

# ── Partition profile (CI parallel) ──────────────────────────────
[profile.ci-partition]
fail-fast = false
retries = 1
status-level = "all"
final-status-level = "all"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 2 }
