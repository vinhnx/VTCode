[package]
name = "vtcode-computer-use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Vinh Nguyen"]
description = "Turn-local computer-use actions and driver lifecycle for VT Code"
license.workspace = true
readme = "README.md"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-computer-use"
keywords = ["vtcode", "computer-use", "automation"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
compact_str = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "time"] }
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "test-util"] }

[lints]
workspace = true
