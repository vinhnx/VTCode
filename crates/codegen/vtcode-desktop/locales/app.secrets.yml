    disconnected_while_saving: {en: "The service disconnected while saving. The outcome is unknown; reload CLI settings before trying again.", vi: "Dịch vụ đã ngắt kết nối khi đang lưu. Kết quả chưa rõ; hãy tải lại cài đặt CLI trước khi thử lại.", es: "El servicio se desconectó mientras guardaba. El resultado es desconocido; recarga los ajustes de CLI antes de reintentar.", fr: "Le service s'est déconnecté pendant l'enregistrement. Le résultat est inconnu ; rechargez les paramètres CLI avant de réessayer.", ja: "保存中にサービスが切断されました。結果は不明です。再試行する前にCLI設定を再読み込みしてください。", de: "Der Dienst hat beim Speichern getrennt. Das Ergebnis ist unbekannt; lade vor einem erneuten Versuch die CLI-Einstellungen neu.", it: "Il servizio si è disconnesso durante il salvataggio. L'esito è sconosciuto; ricarica le impostazioni CLI prima di riprovare.", zh-CN: "保存时服务已断开连接。结果未知；请在重试前重新加载 CLI 设置。", zh-TW: "儲存時服務已中斷連線。結果不明；請在重試前重新載入 CLI 設定。", zh-HK: "儲存時服務已中斷連線。結果不明；請在重試前重新載入 CLI 設定。", pt-BR: "O serviço se desconectou durante o salvamento. O resultado é desconhecido; recarregue as configurações do CLI antes de tentar novamente.", ko: "저장 중 서비스 연결이 끊어졌습니다. 결과를 알 수 없으니 다시 시도하기 전에 CLI 설정을 다시 로드하세요.", nl: "De service is verbroken tijdens het opslaan. De uitkomst is onbekend; laad de CLI-instellingen opnieuw voordat je het opnieuw probeert.", sv: "Tjänsten kopplades från under sparandet. Resultatet är okänt; läs om CLI-inställningarna innan du försöker igen.", uk: "Служба від'єдналася під час збереження. Результат невідомий; перезавантажте налаштування CLI, перш ніж повторювати.", hi: "सहेजते समय सेवा डिस्कनेक्ट हो गई। परिणाम अज्ञात है; पुनः प्रयास से पहले CLI सेटिंग पुनः लोड करें।", pl: "Usługa rozłączyła się podczas zapisywania. Wynik jest nieznany; przed ponowieniem załaduj ponownie ustawienia CLI.", tr: "Kaydetme sırasında hizmetin bağlantısı kesildi. Sonuç bilinmiyor; yeniden denemeden önce CLI ayarlarını yeniden yükleyin.", ru: "Служба отключилась во время сохранения. Результат неизвестен; перезагрузите настройки CLI перед повтором.", id: "Layanan terputus saat menyimpan. Hasilnya tidak diketahui; muat ulang pengaturan CLI sebelum mencoba lagi."}
