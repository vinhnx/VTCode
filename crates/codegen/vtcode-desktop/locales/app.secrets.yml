    saved_send: {en: "API key saved. Send a message to start.", vi: "Đã lưu khóa API. Gửi tin nhắn để bắt đầu.", es: "Clave de API guardada. Envía un mensaje para empezar.", fr: "Clé d'API enregistrée. Envoyez un message pour commencer.", ja: "APIキーを保存しました。開始するにはメッセージを送信してください。", de: "API-Schlüssel gespeichert. Sende eine Nachricht zum Starten.", it: "Chiave API salvata. Invia un messaggio per iniziare.", zh-CN: "API 密钥已保存。发送消息以开始。", zh-TW: "API 金鑰已儲存。傳送訊息以開始。", zh-HK: "API 金鑰已儲存。傳送訊息以開始。", pt-BR: "Chave de API salva. Envie uma mensagem para começar.", ko: "API 키를 저장했습니다. 시작하려면 메시지를 보내세요.", nl: "API-sleutel opgeslagen. Verzend een bericht om te beginnen.", sv: "API-nyckel sparad. Skicka ett meddelande för att börja.", uk: "Ключ API збережено. Надішліть повідомлення, щоб почати.", hi: "API कुंजी सहेजी गई। शुरू करने हेतु संदेश भेजें।", pl: "Zapisano klucz API. Wyślij wiadomość, aby zacząć.", tr: "API anahtarı kaydedildi. Başlamak için ileti gönderin.", ru: "Ключ API сохранён. Отправьте сообщение, чтобы начать.", id: "Kunci API disimpan. Kirim pesan untuk memulai."}
    saved_missing: {en: "API key saved, but the provider still reports missing credentials.", vi: "Đã lưu khóa API, nhưng nhà cung cấp vẫn báo thiếu thông tin xác thực.", es: "Clave de API guardada, pero el proveedor sigue reportando credenciales faltantes.", fr: "Clé d'API enregistrée, mais le fournisseur signale toujours des identifiants manquants.", ja: "APIキーを保存しましたが、プロバイダーは認証情報が不足していると報告しています。", de: "API-Schlüssel gespeichert, aber der Anbieter meldet weiterhin fehlende Anmeldedaten.", it: "Chiave API salvata, ma il provider segnala ancora credenziali mancanti.", zh-CN: "API 密钥已保存，但服务商仍报告缺少凭据。", zh-TW: "API 金鑰已儲存，但服務商仍回報缺少認證。", zh-HK: "API 金鑰已儲存，但服務商仍回報缺少認證。", pt-BR: "Chave de API salva, mas o provedor ainda relata credenciais ausentes.", ko: "API 키를 저장했지만 제공업체에서 여전히 자격 증명 누락을 보고합니다.", nl: "API-sleutel opgeslagen, maar de provider meldt nog steeds ontbrekende aanmeldgegevens.", sv: "API-nyckel sparad, men leverantören rapporterar fortfarande saknade autentiseringsuppgifter.", uk: "Ключ API збережено, але постачальник усе ще повідомляє про відсутні облікові дані.", hi: "API कुंजी सहेजी गई, पर प्रदाता अभी भी क्रेडेंशियल अनुपस्थित बता रहा है।", pl: "Zapisano klucz API, ale dostawca nadal zgłasza brak poświadczeń.", tr: "API anahtarı kaydedildi, ancak sağlayıcı hâlâ eksik kimlik bilgisi bildiriyor.", ru: "Ключ API сохранён, но провайдер всё ещё сообщает об отсутствующих учётных данных.", id: "Kunci API disimpan, tetapi penyedia masih melaporkan kredensial hilang."}
