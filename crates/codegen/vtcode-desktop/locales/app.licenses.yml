    title: {en: "License & open source", vi: "Giấy phép và mã nguồn mở", es: "Licencia y código abierto", fr: "Licence et open source", ja: "ライセンスとオープンソース", de: "Lizenz und Open Source", it: "Licenza e open source", zh-CN: "许可证与开源", zh-TW: "授權與開源", zh-HK: "授權與開源", pt-BR: "Licença e código aberto", ko: "라이선스 및 오픈 소스", nl: "Licentie en opensource", sv: "Licens och öppen källkod", uk: "Ліцензія та відкритий код", hi: "लाइसेंस और ओपन सोर्स", pl: "Licencja i otwarte oprogramowanie", tr: "Lisans ve açık kaynak", ru: "Лицензия и открытый исходный код", id: "Lisensi dan sumber terbuka"}
    description: {en: "VT Code is available under MIT or Apache-2.0. Bundled third-party components keep their own licenses.", vi: "VT Code được phát hành theo MIT hoặc Apache-2.0. Các thành phần bên thứ ba đi kèm giữ nguyên giấy phép của chúng.", es: "VT Code se ofrece bajo MIT o Apache-2.0. Los componentes de terceros incluidos conservan sus propias licencias.", fr: "VT Code est disponible sous MIT ou Apache-2.0. Les composants tiers inclus conservent leurs propres licences.", ja: "VT Code は MIT または Apache-2.0 で提供されます。同梱のサードパーティ製コンポーネントはそれぞれのライセンスに従います。", de: "VT Code ist unter MIT oder Apache-2.0 verfügbar. Enthaltene Drittanbieterkomponenten behalten ihre eigenen Lizenzen.", it: "VT Code è disponibile con licenza MIT o Apache-2.0. I componenti di terze parti inclusi mantengono le proprie licenze.", zh-CN: "VT Code 以 MIT 或 Apache-2.0 提供。随附的第三方组件保留其各自的许可证。", zh-TW: "VT Code 以 MIT 或 Apache-2.0 提供。隨附的第三方元件保留其各自的授權。", zh-HK: "VT Code 以 MIT 或 Apache-2.0 提供。隨附的第三方元件保留其各自的授權。", pt-BR: "O VT Code está disponível sob MIT ou Apache-2.0. Os componentes de terceiros incluídos mantêm suas próprias licenças.", ko: "VT Code는 MIT 또는 Apache-2.0으로 제공됩니다. 포함된 서드파티 구성 요소는 각자의 라이선스를 유지합니다.", nl: "VT Code is beschikbaar onder MIT of Apache-2.0. Meegeleverde componenten van derden behouden hun eigen licenties.", sv: "VT Code är tillgängligt under MIT eller Apache-2.0. Inkluderade tredjepartskomponenter behåller sina egna licenser.", uk: "VT Code доступний за ліцензією MIT або Apache-2.0. Включені сторонні компоненти зберігають власні ліцензії.", hi: "VT Code MIT या Apache-2.0 के अंतर्गत उपलब्ध है। शामिल तृतीय-पक्ष घटक अपने स्वयं के लाइसेंस बनाए रखते हैं।", pl: "VT Code jest dostępny na licencji MIT lub Apache-2.0. Dołączone komponenty podmiotów trzecich zachowują własne licencje.", tr: "VT Code MIT veya Apache-2.0 altında sunulur. Dahil edilen üçüncü taraf bileşenler kendi lisanslarını korur.", ru: "VT Code доступен по лицензии MIT или Apache-2.0. Включённые сторонние компоненты сохраняют свои лицензии.", id: "VT Code tersedia di bawah MIT atau Apache-2.0. Komponen pihak ketiga yang disertakan tetap memakai lisensinya sendiri."}
    first_party_title: {en: "VT Code license", vi: "Giấy phép VT Code", es: "Licencia de VT Code", fr: "Licence de VT Code", ja: "VT Code のライセンス", de: "VT Code-Lizenz", it: "Licenza di VT Code", zh-CN: "VT Code 许可证", zh-TW: "VT Code 授權", zh-HK: "VT Code 授權", pt-BR: "Licença do VT Code", ko: "VT Code 라이선스", nl: "Licentie van VT Code", sv: "VT Code-licens", uk: "Ліцензія VT Code", hi: "VT Code लाइसेंस", pl: "Licencja VT Code", tr: "VT Code lisansı", ru: "Лицензия VT Code", id: "Lisensi VT Code"}
    first_party_description: {en: "Dual-licensed under MIT or Apache-2.0.", vi: "Cấp phép kép theo MIT hoặc Apache-2.0.", es: "Doble licencia MIT o Apache-2.0.", fr: "Sous double licence MIT ou Apache-2.0.", ja: "MIT または Apache-2.0 のデュアルライセンスです。", de: "Dual lizenziert unter MIT oder Apache-2.0.", it: "Doppia licenza MIT o Apache-2.0.", zh-CN: "采用 MIT 或 Apache-2.0 双许可证。", zh-TW: "採用 MIT 或 Apache-2.0 雙授權。", zh-HK: "採用 MIT 或 Apache-2.0 雙授權。", pt-BR: "Licença dupla MIT ou Apache-2.0.", ko: "MIT 또는 Apache-2.0 듀얼 라이선스입니다.", nl: "Dubbele licentie onder MIT of Apache-2.0.", sv: "Dubbellicensierad under MIT eller Apache-2.0.", uk: "Подвійна ліцензія MIT або Apache-2.0.", hi: "MIT या Apache-2.0 के अंतर्गत दोहरा लाइसेंस।", pl: "Podwójna licencja MIT lub Apache-2.0.", tr: "MIT veya Apache-2.0 çift lisanslıdır.", ru: "Двойная лицензия MIT или Apache-2.0.", id: "Lisensi ganda MIT atau Apache-2.0."}
