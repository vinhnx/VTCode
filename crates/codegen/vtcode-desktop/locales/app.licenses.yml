    viewer_description: {en: "Read the bundled license texts and third-party notices. Press Escape to close.", vi: "Đọc văn bản giấy phép đi kèm và thông báo bên thứ ba. Nhấn Escape để đóng.", es: "Lee los textos de licencia incluidos y los avisos de terceros. Pulsa Escape para cerrar.", fr: "Lisez les textes de licence inclus et les avis tiers. Appuyez sur Échap pour fermer.", ja: "同梱のライセンス条文とサードパーティ通知を表示します。Escapeキーで閉じます。", de: "Die enthaltenen Lizenztexte und Drittanbieterhinweise lesen. Zum Schließen Escape drücken.", it: "Leggi i testi delle licenze inclusi e le note di terze parti. Premi Esc per chiudere.", zh-CN: "阅读随附的许可证文本和第三方声明。按 Esc 关闭。", zh-TW: "閱讀隨附的授權文字和第三方聲明。按 Esc 關閉。", zh-HK: "閱讀隨附的授權文字和第三方聲明。按 Esc 關閉。", pt-BR: "Leia os textos de licença incluídos e os avisos de terceiros. Pressione Esc para fechar.", ko: "포함된 라이선스 전문과 서드파티 고지를 읽습니다. Esc 키를 눌러 닫으세요.", nl: "Lees de meegeleverde licentieteksten en kennisgevingen van derden. Druk op Escape om te sluiten.", sv: "Läs de inkluderade licenstexterna och tredjepartsmeddelandena. Tryck på Escape för att stänga.", uk: "Читайте включені тексти ліцензій і повідомлення третіх сторін. Натисніть Escape, щоб закрити.", hi: "शामिल लाइसेंस पाठ और तृतीय-पक्ष सूचनाएँ पढ़ें। बंद करने के लिए Escape दबाएँ।", pl: "Przeczytaj dołączone teksty licencji i informacje podmiotów trzecich. Naciśnij Escape, aby zamknąć.", tr: "Dahil edilen lisans metinlerini ve üçüncü taraf bildirimlerini okuyun. Kapatmak için Escape tuşuna basın.", ru: "Читайте включённые тексты лицензий и уведомления третьих сторон. Нажмите Escape, чтобы закрыть.", id: "Baca teks lisensi dan pemberitahuan pihak ketiga yang disertakan. Tekan Escape untuk menutup."}
