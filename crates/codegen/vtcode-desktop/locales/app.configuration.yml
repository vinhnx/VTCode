    save_disconnected: {en: "The service disconnected while saving. The outcome is unknown; reload CLI settings before trying again.", vi: "Dịch vụ bị ngắt kết nối khi đang lưu. Kết quả chưa rõ; hãy tải lại cài đặt CLI trước khi thử lại.", es: "El servicio se desconectó al guardar. El resultado es desconocido; recarga los ajustes de CLI antes de reintentarlo.", fr: "Le service s'est déconnecté pendant l'enregistrement. Le résultat est inconnu ; rechargez les réglages CLI avant de réessayer.", ja: "保存中にサービスが切断されました。結果は不明です。再試行する前にCLI設定を再読み込みしてください。", de: "Der Dienst hat die Verbindung beim Speichern getrennt. Das Ergebnis ist unbekannt; lade die CLI-Einstellungen vor einem erneuten Versuch neu.", it: "Il servizio si è disconnesso durante il salvataggio. L'esito è sconosciuto; ricarica le impostazioni CLI prima di riprovare.", zh-CN: "保存时服务已断开连接。结果未知；请在重试前重新加载 CLI 设置。", zh-TW: "儲存時服務已中斷連線。結果不明；請在重試前重新載入 CLI 設定。", zh-HK: "儲存時服務已中斷連線。結果不明；請在重試前重新載入 CLI 設定。", pt-BR: "O serviço desconectou ao salvar. O resultado é desconhecido; recarregue os ajustes do CLI antes de tentar de novo.", ko: "저장 중에 서비스 연결이 끊어졌습니다. 결과를 알 수 없으니 다시 시도하기 전에 CLI 설정을 다시 불러오세요.", nl: "De service heeft de verbinding verbroken tijdens het opslaan. Het resultaat is onbekend; laad de CLI-instellingen opnieuw voordat je het opnieuw probeert.", sv: "Tjänsten kopplades från under sparningen. Resultatet är okänt; läs om CLI-inställningarna innan du försöker igen.", uk: "Служба відключилася під час збереження. Результат невідомий; перезавантажте налаштування CLI, перш ніж повторювати спробу.", hi: "सहेजते समय सेवा डिस्कनेक्ट हो गई। परिणाम अज्ञात है; पुनः प्रयास से पहले CLI सेटिंग पुनः लोड करें।", pl: "Usługa rozłączyła się podczas zapisywania. Wynik jest nieznany; przed ponowieniem przeładuj ustawienia CLI.", tr: "Kaydetme sırasında hizmetin bağlantısı kesildi. Sonuç bilinmiyor; yeniden denemeden önce CLI ayarlarını yeniden yükleyin.", ru: "Служба отключилась во время сохранения. Результат неизвестен; перезагрузите настройки CLI перед повторной попыткой.", id: "Layanan terputus saat menyimpan. Hasilnya tidak diketahui; muat ulang pengaturan CLI sebelum mencoba lagi."}
    opened_editor: {en: "Opened vtcode.toml in the default editor.", vi: "Đã mở vtcode.toml trong trình chỉnh sửa mặc định.", es: "Se abrió vtcode.toml en el editor predeterminado.", fr: "vtcode.toml ouvert dans l'éditeur par défaut.", ja: "vtcode.tomlを既定のエディターで開きました。", de: "vtcode.toml wurde im Standardeditor geöffnet.", it: "vtcode.toml aperto nell'editor predefinito.", zh-CN: "已在默认编辑器中打开 vtcode.toml。", zh-TW: "已在預設編輯器中開啟 vtcode.toml。", zh-HK: "已在預設編輯器中開啟 vtcode.toml。", pt-BR: "vtcode.toml aberto no editor padrão.", ko: "기본 편집기에서 vtcode.toml을 열었습니다.", nl: "vtcode.toml geopend in de standaardeditor.", sv: "vtcode.toml öppnades i standardredigeraren.", uk: "vtcode.toml відкрито в редакторі за замовчуванням.", hi: "vtcode.toml डिफ़ॉल्ट संपादक में खोला गया।", pl: "Otwarto vtcode.toml w domyślnym edytorze.", tr: "vtcode.toml varsayılan düzenleyicide açıldı.", ru: "Файл vtcode.toml открыт в редакторе по умолчанию.", id: "vtcode.toml dibuka di editor default."}
    saved_overridden: {en: "Saved %{setting} to %{layer} configuration. A higher-precedence layer still controls the active value.", vi: "Đã lưu %{setting} vào cấu hình %{layer}. Lớp có độ ưu tiên cao hơn vẫn đang điều khiển giá trị hiệu lực.", es: "Se guardó %{setting} en la configuración de %{layer}. Una capa de mayor precedencia sigue controlando el valor activo.", fr: "%{setting} enregistré dans la configuration %{layer}. Une couche de priorité supérieure contrôle toujours la valeur active.", ja: "%{setting}を%{layer}設定に保存しました。優先度の高いレイヤーが引き続きアクティブな値を制御しています。", de: "%{setting} wurde in der %{layer}-Konfiguration gespeichert. Eine Ebene mit höherer Priorität steuert weiterhin den aktiven Wert.", it: "%{setting} salvato nella configurazione %{layer}. Un livello con precedenza maggiore controlla ancora il valore attivo.", zh-CN: "已将 %{setting} 保存到%{layer}配置。优先级更高的层仍控制着活动值。", zh-TW: "已將 %{setting} 儲存到%{layer}組態。優先順序更高的圖層仍控制著使用中的值。", zh-HK: "已將 %{setting} 儲存到%{layer}組態。優先順序更高的圖層仍控制著使用中的值。", pt-BR: "%{setting} salvo na configuração de %{layer}. Uma camada de precedência maior ainda controla o valor ativo.", ko: "%{setting}을(를) %{layer} 구성에 저장했습니다. 우선순위가 높은 레이어가 여전히 활성 값을 제어합니다.", nl: "%{setting} opgeslagen in %{layer}-configuratie. Een laag met hogere prioriteit bepaalt nog steeds de actieve waarde.", sv: "%{setting} sparades i %{layer}-konfigurationen. Ett lager med högre prioritet styr fortfarande det aktiva värdet.", uk: "%{setting} збережено до конфігурації %{layer}. Шар із вищим пріоритетом усе ще керує активним значенням.", hi: "%{setting} को %{layer} कॉन्फ़िगरेशन में सहेजा गया। उच्च प्राथमिकता वाली परत अभी भी सक्रिय मान को नियंत्रित करती है।", pl: "Zapisano %{setting} w konfiguracji %{layer}. Warstwa o wyższym priorytecie nadal kontroluje aktywną wartość.", tr: "%{setting}, %{layer} yapılandırmasına kaydedildi. Önceliği daha yüksek bir katman etkin değeri denetlemeye devam ediyor.", ru: "%{setting} сохранено в конфигурации %{layer}. Слой с более высоким приоритетом по-прежнему управляет активным значением.", id: "%{setting} disimpan ke konfigurasi %{layer}. Lapisan berprioritas lebih tinggi tetap mengendalikan nilai aktif."}
