    save_note: {en: "Saving uses VT Code's validated configuration writer and reloads the local CLI service. Higher-precedence settings can still override the selected layer.", vi: "Việc lưu dùng trình ghi cấu hình đã kiểm chứng của VT Code và tải lại dịch vụ CLI cục bộ. Cài đặt có độ ưu tiên cao hơn vẫn có thể ghi đè lớp đã chọn.", es: "Al guardar se usa el escritor de configuración validado de VT Code y se recarga el servicio CLI local. Los ajustes de mayor precedencia aún pueden anular la capa seleccionada.", fr: "L'enregistrement utilise l'enregistreur de configuration validé de VT Code et recharge le service CLI local. Les réglages de priorité supérieure peuvent toujours remplacer la couche sélectionnée.", ja: "保存にはVT Codeの検証済み設定ライターを使用し、ローカルCLIサービスを再読み込みします。優先度の高い設定は選択中のレイヤーを上書きできます。", de: "Beim Speichern wird der validierte Konfigurationsschreiber von VT Code verwendet und der lokale CLI-Dienst neu geladen. Einstellungen mit höherer Priorität können die gewählte Ebene weiterhin überschreiben.", it: "Il salvataggio usa lo scrittore di configurazione validato di VT Code e ricarica il servizio CLI locale. Le impostazioni con precedenza maggiore possono comunque sovrascrivere il livello selezionato.", zh-CN: "保存使用 VT Code 经过验证的配置写入器，并重新加载本地 CLI 服务。优先级更高的设置仍可覆盖所选层。", zh-TW: "儲存使用 VT Code 經過驗證的組態寫入器，並重新載入本機 CLI 服務。優先順序更高的設定仍可覆寫所選圖層。", zh-HK: "儲存使用 VT Code 經過驗證的組態寫入器，並重新載入本機 CLI 服務。優先順序更高的設定仍可覆寫所選圖層。", pt-BR: "Salvar usa o gravador de configuração validado do VT Code e recarrega o serviço CLI local. Ajustes de precedência maior ainda podem substituir a camada selecionada.", ko: "저장 시 VT Code의 검증된 구성 기록기를 사용하고 로컬 CLI 서비스를 다시 불러옵니다. 우선순위가 높은 설정은 선택한 레이어를 재정의할 수 있습니다.", nl: "Opslaan gebruikt de gevalideerde configuratieschrijver van VT Code en laadt de lokale CLI-service opnieuw. Instellingen met hogere prioriteit kunnen de geselecteerde laag nog steeds overschrijven.", sv: "Vid sparning används VT Codes validerade konfigurationsskrivare och den lokala CLI-tjänsten läses om. Inställningar med högre prioritet kan fortfarande åsidosätta det valda lagret.", uk: "Збереження використовує перевірений записувач конфігурації VT Code та перезавантажує локальну службу CLI. Налаштування з вищим пріоритетом усе ще можуть перевизначити вибраний шар.", hi: "सहेजने में VT Code के सत्यापित कॉन्फ़िगरेशन राइटर का उपयोग होता है और स्थानीय CLI सेवा पुनः लोड होती है। उच्च प्राथमिकता वाली सेटिंग फिर भी चयनित परत को ओवरराइड कर सकती हैं।", pl: "Zapisywanie korzysta ze zweryfikowanego zapisywacza konfiguracji VT Code i przeładowuje lokalną usługę CLI. Ustawienia o wyższym priorytecie mogą nadal zastąpić wybraną warstwę.", tr: "Kaydetme, VT Code'un doğrulanmış yapılandırma yazıcısını kullanır ve yerel CLI hizmetini yeniden yükler. Önceliği daha yüksek ayarlar seçili katmanı geçersiz kılabilir.", ru: "Сохранение использует проверенный записыватель конфигурации VT Code и перезагружает локальную службу CLI. Настройки с более высоким приоритетом всё равно могут переопределить выбранный слой.", id: "Penyimpanan menggunakan penulis konfigurasi tervalidasi VT Code dan memuat ulang layanan CLI lokal. Pengaturan berprioritas lebih tinggi tetap dapat menimpa lapisan yang dipilih."}
    write_target_label: {en: "Write CLI settings to %{label} configuration%{suffix}", vi: "Ghi cài đặt CLI vào cấu hình %{label}%{suffix}", es: "Escribir ajustes de CLI en la configuración de %{label}%{suffix}", fr: "Écrire les réglages CLI dans la configuration %{label}%{suffix}", ja: "%{label}設定にCLI設定を書き込む%{suffix}", de: "CLI-Einstellungen in die %{label}-Konfiguration schreiben%{suffix}", it: "Scrivi le impostazioni CLI nella configurazione %{label}%{suffix}", zh-CN: "将 CLI 设置写入%{label}配置%{suffix}", zh-TW: "將 CLI 設定寫入%{label}組態%{suffix}", zh-HK: "將 CLI 設定寫入%{label}組態%{suffix}", pt-BR: "Gravar ajustes do CLI na configuração de %{label}%{suffix}", ko: "%{label} 구성에 CLI 설정 기록%{suffix}", nl: "CLI-instellingen schrijven naar %{label}-configuratie%{suffix}", sv: "Skriv CLI-inställningar till %{label}-konfigurationen%{suffix}", uk: "Записати налаштування CLI до конфігурації %{label}%{suffix}", hi: "CLI सेटिंग को %{label} कॉन्फ़िगरेशन में लिखें%{suffix}", pl: "Zapisz ustawienia CLI do konfiguracji %{label}%{suffix}", tr: "CLI ayarlarını %{label} yapılandırmasına yaz%{suffix}", ru: "Записать настройки CLI в конфигурацию %{label}%{suffix}", id: "Tulis pengaturan CLI ke konfigurasi %{label}%{suffix}"}
    reasoning_effort_hint: {en: "Choose which reasoning effort levels appear in model controls. Availability varies by model.", vi: "Chọn mức nỗ lực suy luận nào xuất hiện trong điều khiển mô hình. Tính khả dụng tùy theo mô hình.", es: "Elige qué niveles de esfuerzo de razonamiento aparecen en los controles de modelo. La disponibilidad varía según el modelo.", fr: "Choisissez les niveaux d'effort de raisonnement affichés dans les contrôles de modèle. La disponibilité varie selon le modèle.", ja: "モデルコントロールに表示する推論エフォートレベルを選択します。利用可否はモデルにより異なります。", de: "Wähle, welche Reasoning-Effort-Stufen in den Modellsteuerelementen erscheinen. Die Verfügbarkeit variiert je nach Modell.", it: "Scegli quali livelli di sforzo di ragionamento compaiono nei controlli del modello. La disponibilità varia in base al modello.", zh-CN: "选择在模型控件中显示哪些推理强度级别。可用性因模型而异。", zh-TW: "選擇在模型控制項中顯示哪些推理強度層級。可用性因模型而異。", zh-HK: "選擇在模型控制項中顯示哪些推理強度層級。可用性因模型而異。", pt-BR: "Escolha quais níveis de esforço de raciocínio aparecem nos controles de modelo. A disponibilidade varia por modelo.", ko: "모델 컨트롤에 표시할 추론 노력 수준을 선택하세요. 사용 가능 여부는 모델에 따라 다릅니다.", nl: "Kies welke redeneerinspanningsniveaus in modelbesturingselementen verschijnen. Beschikbaarheid verschilt per model.", sv: "Välj vilka resonemangsansträngningsnivåer som visas i modellkontroller. Tillgängligheten varierar mellan modeller.", uk: "Виберіть, які рівні зусиль міркування відображатимуться в елементах керування моделлю. Доступність залежить від моделі.", hi: "चुनें कि मॉडल नियंत्रणों में कौन-से तर्क प्रयास स्तर दिखें। उपलब्धता मॉडल के अनुसार भिन्न होती है।", pl: "Wybierz, które poziomy wysiłku rozumowania pojawiają się w kontrolkach modelu. Dostępność zależy od modelu.", tr: "Model denetimlerinde hangi muhakeme çaba düzeylerinin görüneceğini seçin. Kullanılabilirlik modele göre değişir.", ru: "Выберите, какие уровни усилия рассуждения отображать в элементах управления моделью. Доступность зависит от модели.", id: "Pilih level upaya penalaran mana yang muncul di kontrol model. Ketersediaan berbeda-beda per model."}
    current_version: {en: "Current version: %{version}", vi: "Phiên bản hiện tại: %{version}", es: "Versión actual: %{version}", fr: "Version actuelle : %{version}", ja: "現在のバージョン：%{version}", de: "Aktuelle Version: %{version}", it: "Versione corrente: %{version}", zh-CN: "当前版本：%{version}", zh-TW: "目前版本：%{version}", zh-HK: "目前版本：%{version}", pt-BR: "Versão atual: %{version}", ko: "현재 버전: %{version}", nl: "Huidige versie: %{version}", sv: "Aktuell version: %{version}", uk: "Поточна версія: %{version}", hi: "वर्तमान संस्करण: %{version}", pl: "Bieżąca wersja: %{version}", tr: "Geçerli sürüm: %{version}", ru: "Текущая версия: %{version}", id: "Versi saat ini: %{version}"}
    credential_note: {en: "Credential-bearing fields are excluded; manage credentials with `vtcode auth` or the configured environment variable.", vi: "Các trường chứa thông tin xác thực bị loại trừ; hãy quản lý thông tin xác thực bằng `vtcode auth` hoặc biến môi trường đã cấu hình.", es: "Los campos con credenciales están excluidos; gestiona las credenciales con `vtcode auth` o la variable de entorno configurada.", fr: "Les champs contenant des identifiants sont exclus ; gérez les identifiants avec `vtcode auth` ou la variable d'environnement configurée.", ja: "認証情報を含むフィールドは除外されます。認証情報は `vtcode auth` または設定済みの環境変数で管理してください。", de: "Felder mit Anmeldeinformationen sind ausgeschlossen; verwalte Anmeldeinformationen mit `vtcode auth` oder der konfigurierten Umgebungsvariable.", it: "I campi contenenti credenziali sono esclusi; gestisci le credenziali con `vtcode auth` o la variabile d'ambiente configurata.", zh-CN: "包含凭据的字段已被排除；请使用 `vtcode auth` 或已配置的环境变量管理凭据。", zh-TW: "包含憑證的欄位已被排除；請使用 `vtcode auth` 或已設定的環境變數管理憑證。", zh-HK: "包含憑證的欄位已被排除；請使用 `vtcode auth` 或已設定的環境變數管理憑證。", pt-BR: "Campos com credenciais estão excluídos; gerencie credenciais com `vtcode auth` ou a variável de ambiente configurada.", ko: "자격 증명 포함 필드는 제외됩니다. `vtcode auth` 또는 구성된 환경 변수로 자격 증명을 관리하세요.", nl: "Velden met referenties zijn uitgesloten; beheer referenties met `vtcode auth` of de geconfigureerde omgevingsvariabele.", sv: "Fält med autentiseringsuppgifter är undantagna; hantera autentiseringsuppgifter med `vtcode auth` eller den konfigurerade miljövariabeln.", uk: "Поля з обліковими даними виключено; керуйте обліковими даними за допомогою `vtcode auth` або налаштованої змінної середовища.", hi: "क्रेडेंशियल वाले फ़ील्ड बाहर रखे गए हैं; क्रेडेंशियल `vtcode auth` या कॉन्फ़िगर किए गए पर्यावरण चर से प्रबंधित करें।", pl: "Pola zawierające poświadczenia są wykluczone; zarządzaj poświadczeniami za pomocą `vtcode auth` lub skonfigurowanej zmiennej środowiskowej.", tr: "Kimlik bilgisi içeren alanlar hariç tutulur; kimlik bilgilerini `vtcode auth` veya yapılandırılan ortam değişkeniyle yönetin.", ru: "Поля с учётными данными исключены; управляйте учётными данными через `vtcode auth` или настроенную переменную окружения.", id: "Kolom berisi kredensial dikecualikan; kelola kredensial dengan `vtcode auth` atau variabel lingkungan yang dikonfigurasi."}
    omitted_large_note: {en: "Some unusually large or numerous settings are omitted from this browser.", vi: "Một số cài đặt quá lớn hoặc quá nhiều bị lược khỏi trình duyệt này.", es: "Algunos ajustes inusualmente grandes o numerosos se omiten en este explorador.", fr: "Certains réglages inhabituellement volumineux ou nombreux sont omis de cet explorateur.", ja: "異常に大きい、または多数の設定はこのブラウザーから省略されます。", de: "Einige ungewöhnlich große oder zahlreiche Einstellungen werden in diesem Browser ausgelassen.", it: "Alcune impostazioni insolitamente grandi o numerose sono omesse da questo browser.", zh-CN: "此浏览器中省略了一些异常庞大或数量众多的设置。", zh-TW: "此瀏覽器中省略了一些異常龐大或數量眾多的設定。", zh-HK: "此瀏覽器中省略了一些異常龐大或數量眾多的設定。", pt-BR: "Alguns ajustes excepcionalmente grandes ou numerosos são omitidos neste navegador.", ko: "비정상적으로 크거나 많은 일부 설정은 이 브라우저에서 생략됩니다.", nl: "Sommige ongewoon grote of talrijke instellingen worden in deze browser weggelaten.", sv: "Vissa ovanligt stora eller talrika inställningar utelämnas i den här webbläsaren.", uk: "Деякі незвично великі або численні налаштування пропущено в цьому переглядачі.", hi: "कुछ असामान्य रूप से बड़ी या अनेक सेटिंग इस ब्राउज़र से छोड़ी गई हैं।", pl: "Niektóre niezwykle duże lub liczne ustawienia zostały pominięte w tej przeglądarce.", tr: "Olağandışı derecede büyük veya çok sayıdaki bazı ayarlar bu tarayıcıda atlanır.", ru: "Некоторые необычно крупные или многочисленные настройки пропущены в этом обозревателе.", id: "Beberapa pengaturan yang luar biasa besar atau banyak dihilangkan dari peramban ini."}
    read_only_note: {en: "%{count} documented schema entries are reference-only until they have a concrete value.", vi: "%{count} mục lược đồ đã ghi tài liệu chỉ mang tính tham chiếu cho đến khi có giá trị cụ thể.", es: "%{count} entradas de esquema documentadas son solo de referencia hasta que tengan un valor concreto.", fr: "%{count} entrées de schéma documentées sont en référence seule jusqu'à ce qu'elles aient une valeur concrète.", ja: "文書化されたスキーマエントリ%{count}件は、具体的な値が設定されるまで参照専用です。", de: "%{count} dokumentierte Schemaeinträge sind nur Referenzen, bis sie einen konkreten Wert haben.", it: "%{count} voci di schema documentate sono di solo riferimento finché non hanno un valore concreto.", zh-CN: "%{count} 个已记录的架构条目在具有具体值之前仅供引用。", zh-TW: "%{count} 個已記錄的結構描述項目在具有具體值之前僅供參照。", zh-HK: "%{count} 個已記錄的結構描述項目在具有具體值之前僅供參照。", pt-BR: "%{count} entradas de esquema documentadas são somente referência até terem um valor concreto.", ko: "문서화된 스키마 항목 %{count}개는 구체적인 값이 있을 때까지 참조 전용입니다.", nl: "%{count} gedocumenteerde schema-items zijn alleen referentie totdat ze een concrete waarde hebben.", sv: "%{count} dokumenterade schemaposter är endast referenser tills de har ett konkret värde.", uk: "%{count} задокументованих записів схеми доступні лише для довідки, доки не матимуть конкретного значення.", hi: "%{count} प्रलेखित स्कीमा प्रविष्टियाँ ठोस मान होने तक केवल संदर्भ हेतु हैं।", pl: "%{count} udokumentowanych wpisów schematu jest dostępnych tylko w celach informacyjnych, dopóki nie mają konkretnej wartości.", tr: "%{count} belgelenmiş şema girdisi somut bir değer alana kadar yalnızca başvuru amaçlıdır.", ru: "%{count} задокументированных записей схемы доступны только для справки, пока у них нет конкретного значения.", id: "%{count} entri skema terdokumentasi hanya referensi sampai memiliki nilai konkret."}
