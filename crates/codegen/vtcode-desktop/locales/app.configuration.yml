    choose_value_before_saving: {en: "Choose a documented value before saving.", vi: "Chọn một giá trị đã ghi tài liệu trước khi lưu.", es: "Elige un valor documentado antes de guardar.", fr: "Choisissez une valeur documentée avant d'enregistrer.", ja: "保存する前に文書化された値を選択してください。", de: "Wähle vor dem Speichern einen dokumentierten Wert.", it: "Scegli un valore documentato prima di salvare.", zh-CN: "请在保存前选择一个已记录的值。", zh-TW: "請在儲存前選擇一個已記錄的值。", zh-HK: "請在儲存前選擇一個已記錄的值。", pt-BR: "Escolha um valor documentado antes de salvar.", ko: "저장하기 전에 문서화된 값을 선택하세요.", nl: "Kies een gedocumenteerde waarde voordat je opslaat.", sv: "Välj ett dokumenterat värde innan du sparar.", uk: "Виберіть задокументоване значення перед збереженням.", hi: "सहेजने से पहले कोई प्रलेखित मान चुनें।", pl: "Wybierz udokumentowaną wartość przed zapisaniem.", tr: "Kaydetmeden önce belgelenmiş bir değer seçin.", ru: "Перед сохранением выберите задокументированное значение.", id: "Pilih nilai yang didokumentasikan sebelum menyimpan."}
