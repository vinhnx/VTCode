    row_sandbox_description: {en: "Choose how much VT Code can do when running commands. Takes effect when sandboxing is enabled.", vi: "Chọn mức độ VT Code được phép khi chạy lệnh. Có hiệu lực khi đã bật sandbox.", es: "Elige cuánto puede hacer VT Code al ejecutar comandos. Tiene efecto cuando el espacio aislado está activado.", fr: "Choisissez ce que VT Code peut faire lors de l'exécution de commandes. Prend effet lorsque le bac à sable est activé.", ja: "コマンド実行時にVT Codeに許可する範囲を選択します。サンドボックス有効時に適用されます。", de: "Wähle, wie viel VT Code beim Ausführen von Befehlen tun darf. Wirkt, wenn Sandboxing aktiviert ist.", it: "Scegli quanto può fare VT Code durante l'esecuzione dei comandi. Ha effetto quando la sandbox è attiva.", zh-CN: "选择 VT Code 运行命令时可执行的范围。启用沙盒后生效。", zh-TW: "選擇 VT Code 執行命令時可執行的範圍。啟用沙箱後生效。", zh-HK: "選擇 VT Code 執行命令時可執行的範圍。啟用沙箱後生效。", pt-BR: "Escolha o quanto o VT Code pode fazer ao executar comandos. Vale quando o sandbox está ativado.", ko: "명령 실행 시 VT Code가 수행할 수 있는 범위를 선택하세요. 샌드박스가 활성화된 경우 적용됩니다.", nl: "Kies hoeveel VT Code mag doen bij het uitvoeren van opdrachten. Geldt wanneer sandboxing is ingeschakeld.", sv: "Välj hur mycket VT Code får göra vid körning av kommandon. Gäller när sandlådan är aktiverad.", uk: "Виберіть, що VT Code може робити під час виконання команд. Діє, коли пісочницю ввімкнено.", hi: "चुनें कि आदेश चलाते समय VT Code कितना कुछ कर सके। सैंडबॉक्स सक्षम होने पर प्रभावी होता है।", pl: "Wybierz, ile VT Code może robić podczas uruchamiania poleceń. Obowiązuje, gdy piaskownica jest włączona.", tr: "VT Code'un komut çalıştırırken ne kadarını yapabileceğini seçin. Korumalı alan etkinken geçerlidir.", ru: "Выберите, что VT Code может делать при выполнении команд. Действует, когда песочница включена.", id: "Pilih seberapa banyak VT Code dapat dilakukan saat menjalankan perintah. Berlaku saat sandbox diaktifkan."}
