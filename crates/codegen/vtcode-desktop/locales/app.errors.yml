    fast_processing_unavailable: {en: "Fast processing is unavailable for the selected model.", sv: "Snabb bearbetning är inte tillgänglig för den valda modellen.", uk: "Швидке виконання недоступне для вибраної моделі.", hi: "चुने गए मॉडल के लिए तेज़ प्रोसेसिंग उपलब्ध नहीं है।", pl: "Szybkie przetwarzanie jest niedostępne dla wybranego modelu.", tr: "Seçili model için hızlı işleme kullanılamıyor.", vi: "Mô hình đã chọn không hỗ trợ chế độ xử lý nhanh.", es: "El modelo seleccionado no admite el procesamiento rápido.", fr: "Le traitement rapide n’est pas disponible pour le modèle sélectionné.", ja: "選択したモデルでは高速処理を利用できません。", de: "Die schnelle Verarbeitung ist für das ausgewählte Modell nicht verfügbar.", it: "L’elaborazione rapida non è disponibile per il modello selezionato.", zh-CN: "当前模型不支持快速处理。", zh-TW: "目前選擇的模型不支援快速處理。", zh-HK: "目前選擇的模型不支援快速處理。", pt-BR: "O processamento rápido não está disponível para o modelo selecionado.", ko: "선택한 모델은 빠른 처리를 지원하지 않습니다.", nl: "Snelle verwerking is niet beschikbaar voor het geselecteerde model.", ru: "Быстрая обработка недоступна для выбранной модели.", id: "Pemrosesan cepat tidak tersedia untuk model yang dipilih."}
    model_selection_runtime_changing: {en: "Model selection is unavailable while the runtime is changing.", sv: "Modellval är inte tillgängligt medan körtiden ändras.", uk: "Вибір моделі недоступний, поки змінюється середовище виконання.", hi: "रनटाइम बदलते समय मॉडल चयन उपलब्ध नहीं है।", pl: "Nie można wybrać modelu podczas zmiany środowiska uruchomieniowego.", tr: "Çalışma zamanı değişirken model seçimi kullanılamaz.", vi: "Không thể chọn mô hình khi môi trường chạy đang thay đổi.", es: "No se puede seleccionar un modelo mientras cambia el entorno de ejecución.", fr: "La sélection d’un modèle est indisponible pendant le changement du moteur d’exécution.", ja: "ランタイムの切り替え中はモデルを選択できません。", de: "Während des Laufzeitwechsels ist keine Modellauswahl möglich.", it: "Non è possibile selezionare un modello mentre cambia il runtime.", zh-CN: "运行时切换期间无法选择模型。", zh-TW: "執行環境切換期間無法選擇模型。", zh-HK: "執行環境切換期間無法選擇模型。", pt-BR: "A seleção de modelo fica indisponível enquanto o runtime está mudando.", ko: "런타임이 변경되는 동안 모델을 선택할 수 없습니다.", nl: "Een model kiezen kan niet terwijl de runtime wordt gewijzigd.", ru: "Выбор модели недоступен во время смены среды выполнения.", id: "Model tidak dapat dipilih saat runtime sedang berubah."}
    runtime_options_unavailable: {en: "Runtime options are still loading or unavailable. Try again when they finish loading.", sv: "Körtidsalternativ laddas fortfarande eller är inte tillgängliga. Försök igen när de är klara med laddningen.", uk: "Параметри середовища виконання ще завантажуються або недоступні. Спробуйте пізніше.", hi: "रनटाइम विकल्प अभी लोड हो रहे हैं या उपलब्ध नहीं हैं। लोड पूरा होने पर फिर कोशिश करें।", pl: "Opcje środowiska uruchomieniowego są nadal wczytywane lub niedostępne. Spróbuj ponownie po zakończeniu wczytywania.", tr: "Çalışma zamanı seçenekleri hâlâ yükleniyor veya kullanılamıyor. Yükleme tamamlandığında yeniden deneyin.", vi: "Các tùy chọn thời gian chạy vẫn đang tải hoặc không khả dụng. Hãy thử lại sau khi tải xong.", es: "Las opciones de ejecución aún se están cargando o no están disponibles. Vuelve a intentarlo cuando terminen de cargar.", fr: "Les options d’exécution sont encore en cours de chargement ou indisponibles. Réessayez une fois le chargement terminé.", ja: "実行オプションを読み込み中、または利用できません。読み込み完了後にもう一度お試しください。", de: "Laufzeitoptionen werden noch geladen oder sind nicht verfügbar. Versuche es nach dem Laden erneut.", it: "Le opzioni di runtime sono ancora in caricamento o non disponibili. Riprova al termine del caricamento.", zh-CN: "运行时选项仍在加载或暂不可用。加载完成后请重试。", zh-TW: "執行環境選項仍在載入或暫時無法使用。載入完成後請再試一次。", zh-HK: "執行環境選項仍在載入或暫時無法使用。載入完成後請再試一次。", pt-BR: "As opções de execução ainda estão carregando ou indisponíveis. Tente novamente quando o carregamento terminar.", ko: "런타임 옵션을 불러오는 중이거나 사용할 수 없습니다. 로딩이 끝난 뒤 다시 시도하세요.", nl: "Runtimeopties worden nog geladen of zijn niet beschikbaar. Probeer het opnieuw zodra het laden is voltooid.", ru: "Параметры среды выполнения ещё загружаются или недоступны. Повторите попытку после загрузки.", id: "Opsi runtime masih dimuat atau tidak tersedia. Coba lagi setelah pemuatan selesai."}
    request_queue_unavailable: {en: "The local service request queue is unavailable.", sv: "Den lokala serviceförfrågningskön är inte tillgänglig.", uk: "Черга запитів локальної служби недоступна.", hi: "स्थानीय सेवा की अनुरोध कतार उपलब्ध नहीं है।", pl: "Kolejka żądań usługi lokalnej jest niedostępna.", tr: "Yerel hizmet istek kuyruğu kullanılamıyor.", vi: "Hàng đợi yêu cầu của dịch vụ cục bộ hiện không khả dụng.", es: "La cola de solicitudes del servicio local no está disponible.", fr: "La file de requêtes du service local est indisponible.", ja: "ローカルサービスのリクエストキューを利用できません。", de: "Die lokale Dienst-Warteschlange ist nicht verfügbar.", it: "La coda di richieste del servizio locale non è disponibile.", zh-CN: "本地服务请求队列不可用。", zh-TW: "本地服務請求隊列不可用。", zh-HK: "本地服務請求隊列不可用。", pt-BR: "A fila de solicitações do serviço local está indisponível.", ko: "로컬 서비스 요청 대기열을 사용할 수 없습니다.", nl: "De wachtrij voor lokale serviceverzoeken is niet beschikbaar.", ru: "Очередь запросов локальной службы недоступна.", id: "Antrean permintaan layanan lokal tidak tersedia."}
    desktop_command_unavailable: {en: "This desktop command is currently unavailable. Try again.", sv: "Det här skrivbordskommandot är för närvarande inte tillgängligt. Försök igen.", uk: "Ця команда Desktop зараз недоступна. Спробуйте ще раз.", hi: "यह डेस्कटॉप कमांड अभी उपलब्ध नहीं है। फिर कोशिश करें।", pl: "To polecenie pulpitu jest obecnie niedostępne. Spróbuj ponownie.", tr: "Bu masaüstü komutu şu anda kullanılamıyor. Yeniden deneyin.", vi: "Lệnh trên VT Code Desktop hiện không khả dụng. Hãy thử lại.", es: "Este comando de VT Code Desktop no está disponible ahora. Inténtalo de nuevo.", fr: "Cette commande de VT Code Desktop est indisponible pour le moment. Réessayez.", ja: "このデスクトップコマンドは現在利用できません。もう一度お試しください。", de: "Dieser Desktop-Befehl ist derzeit nicht verfügbar. Versuche es erneut.", it: "Questo comando desktop non è al momento disponibile. Riprova.", zh-CN: "此桌面命令当前不可用。请重试。", zh-TW: "此桌面指令目前無法使用。請再試一次。", zh-HK: "此桌面指令目前不可用。請再試一次。", pt-BR: "Este comando do Desktop não está disponível no momento. Tente novamente.", ko: "이 데스크톱 명령은 현재 사용할 수 없습니다. 다시 시도하세요.", nl: "Deze desktopopdracht is momenteel niet beschikbaar. Probeer het opnieuw.", ru: "Эта команда для рабочего стола сейчас недоступна. Попробуйте ещё раз.", id: "Perintah desktop ini sedang tidak tersedia. Coba lagi."}
