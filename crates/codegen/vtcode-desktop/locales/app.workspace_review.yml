    repository_unavailable_hint: {en: "Refresh after Git and a valid repository are available for this workspace.", sv: "Uppdatering efter Git och ett giltigt arkiv är tillgängligt för denna arbetsyta.", uk: "Оновіть після того, як Git і дійсний репозиторій стануть доступними для цього робочого простору.", hi: "इस वर्कस्पेस के लिए Git और मान्य रिपॉज़िटरी उपलब्ध होने पर रीफ़्रेश करें।", pl: "Odśwież, gdy Git i prawidłowe repozytorium będą dostępne dla tego obszaru roboczego.", tr: "Bu çalışma alanında Git ve geçerli bir depo kullanılabilir olduğunda yenileyin.", vi: "Làm mới sau khi Git và kho lưu trữ hợp lệ khả dụng cho không gian làm việc này.", es: "Actualiza cuando Git y un repositorio válido estén disponibles para este espacio de trabajo.", fr: "Actualisez lorsque Git et un dépôt valide sont disponibles pour cet espace de travail.", ja: "このワークスペースでGitと有効なリポジトリを利用できるようになってから更新してください。", de: "Aktualisiere, sobald Git und ein gültiges Repository für diesen Arbeitsbereich verfügbar sind.", it: "Aggiorna quando Git e un repository valido sono disponibili per questo spazio di lavoro.", zh-CN: "此工作区中的 Git 和有效仓库可用后再刷新。", zh-TW: "此工作區中的 Git 和有效倉庫可用後再刷新。", zh-HK: "此工作區中的 Git 和有效倉庫可用後再刷新。", pt-BR: "Atualize quando o Git e um repositório válido estiverem disponíveis para este espaço de trabalho.", ko: "이 작업 공간에서 Git과 유효한 저장소를 사용할 수 있게 된 후 새로고침하세요.", nl: "Vernieuw zodra Git en een geldige repository beschikbaar zijn voor deze werkruimte.", ru: "Обновите после того, как Git и корректный репозиторий станут доступны для этого рабочего пространства.", id: "Segarkan setelah Git dan repositori yang valid tersedia untuk ruang kerja ini."}
    no_previewable_changes: {en: "No previewable changes", sv: "Inga förhandsgranskningsbara ändringar", uk: "Немає змін для попереднього перегляду", hi: "पूर्वावलोकन योग्य बदलाव नहीं हैं", pl: "Brak zmian do podglądu", tr: "Önizlenebilir değişiklik yok", vi: "Không có thay đổi nào để xem trước", es: "No hay cambios que se puedan previsualizar", fr: "Aucune modification à prévisualiser", ja: "プレビューできる変更はありません", de: "Keine Änderungen für die Vorschau", it: "Nessuna modifica da visualizzare in anteprima", zh-CN: "没有可预览的更改", zh-TW: "沒有可預覽的更改", zh-HK: "沒有可預覽的更改", pt-BR: "Nenhuma alteração disponível para prévia", ko: "미리 볼 수 있는 변경 사항이 없습니다", nl: "Geen wijzigingen om te bekijken", ru: "Нет изменений для предпросмотра", id: "Tidak ada perubahan yang dapat dipratinjau"}
