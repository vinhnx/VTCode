    choose_what_to_review_hint: {en: "Leave Folder empty for the whole workspace, or enter a relative directory. Then choose Load changes.", sv: "Lämna mappen tom för hela arbetsytan, eller ange en relativ katalog. Välj sedan Ladda ändringar.", uk: "Залиште папку порожньою, щоб охопити весь робочий простір, або вкажіть відносний каталог. Потім виберіть «Завантажити зміни».", hi: "पूरे वर्कस्पेस के लिए Folder खाली छोड़ें या सापेक्ष डायरेक्टरी दर्ज करें। फिर Load changes चुनें।", pl: "Pozostaw pole Folder puste, aby objąć cały obszar roboczy, lub wpisz ścieżkę względną. Następnie wybierz Wczytaj zmiany.", tr: "Tüm çalışma alanı için Klasör alanını boş bırakın veya göreli bir dizin girin. Ardından Değişiklikleri yükle'yi seçin.", vi: "Để trống Thư mục để xem toàn bộ không gian làm việc, hoặc nhập thư mục tương đối. Sau đó chọn Tải thay đổi.", es: "Deja Carpeta vacía para revisar todo el espacio de trabajo o escribe una carpeta relativa. Después, selecciona Cargar cambios.", fr: "Laissez Dossier vide pour tout l’espace de travail ou saisissez un dossier relatif. Choisissez ensuite Charger les modifications.", ja: "ワークスペース全体を対象にするにはフォルダを空欄にし、特定の場所を対象にするには相対パスを入力してから「変更を読み込む」を選択します。", de: "Lass Ordner leer, um den gesamten Arbeitsbereich zu prüfen, oder gib ein relatives Verzeichnis ein. Wähle danach Änderungen laden.", it: "Lascia vuota Cartella per l’intero spazio di lavoro oppure inserisci una directory relativa. Poi scegli Carica modifiche.", zh-CN: "留空文件夹可查看整个工作区，或输入相对目录。然后选择“加载更改”。", zh-TW: "留空資料夾可查看整個工作區，或輸入相對目錄。然後選擇“加載更改”。", zh-HK: "留空資料夾可查看整個工作區，或輸入相對目錄。然後選擇“加載更改”。", pt-BR: "Deixe Pasta vazia para revisar todo o espaço de trabalho ou informe um diretório relativo. Depois, escolha Carregar alterações.", ko: "전체 작업 공간을 검토하려면 폴더를 비워 두고, 특정 위치만 보려면 상대 디렉터리를 입력한 다음 변경 사항 불러오기를 선택하세요.", nl: "Laat Map leeg voor de hele werkruimte of voer een relatief pad in. Kies daarna Wijzigingen laden.", ru: "Оставьте поле «Папка» пустым, чтобы проверить всё рабочее пространство, или укажите относительный каталог. Затем нажмите «Загрузить изменения».", id: "Kosongkan Folder untuk seluruh ruang kerja, atau masukkan direktori relatif. Lalu pilih Muat perubahan."}
