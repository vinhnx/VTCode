    description: {en: "Read-only redacted snapshot · staged and unstaged changes · optional untracked text previews", sv: "Skrivskyddad redigerad ögonblicksbild · stegvisa och icke-stegade ändringar · valfria ospårade textförhandsvisningar", uk: "Лише для читання, з прихованими секретами · індексовані та неіндексовані зміни · за бажанням перегляд тексту невідстежуваних файлів", hi: "केवल-पठन संपादित स्नैपशॉट · स्टेज किए और बिना स्टेज किए बदलाव · वैकल्पिक अनट्रैक किए टेक्स्ट पूर्वावलोकन", pl: "Tylko do odczytu, zanonimizowany zrzut · zmiany w indeksie i poza nim · opcjonalne podglądy nieśledzonych plików tekstowych", tr: "Salt okunur, gizli verileri ayıklanmış anlık görüntü · hazırlama alanına eklenmiş ve eklenmemiş değişiklikler · isteğe bağlı izlenmeyen metin önizlemeleri", vi: "Ảnh chụp đã ẩn thông tin nhạy cảm, chỉ đọc · thay đổi đã đưa vào và chưa đưa vào vùng chờ · tùy chọn xem trước tệp văn bản chưa được theo dõi", es: "Instantánea redactada de solo lectura · cambios preparados y sin preparar · vista previa opcional de archivos de texto sin seguimiento", fr: "Instantané expurgé en lecture seule · modifications indexées et non indexées · aperçu facultatif des fichiers texte non suivis", ja: "機密情報を除いた読み取り専用スナップショット · ステージ済み・未ステージの変更 · 未追跡テキストのプレビューは任意", de: "Bereinigte, schreibgeschützte Momentaufnahme · vorgemerkte und nicht vorgemerkte Änderungen · optionale Vorschau nicht verfolgter Textdateien", it: "Istantanea redatta e di sola lettura · modifiche nell’area di staging e non in staging · anteprima facoltativa dei file di testo non tracciati", zh-CN: "只读脱敏快照 · 已暂存和未暂存的更改 · 可选预览未跟踪的文本文件", zh-TW: "只讀脫敏快照 · 已暫存和未暫存的更改 · 可選預覽未跟蹤的文本檔案", zh-HK: "只讀脫敏快照 · 已暫存和未暫存的更改 · 可選預覽未跟蹤的文本檔案", pt-BR: "Instantâneo redigido e somente leitura · alterações preparadas e não preparadas · prévia opcional de arquivos de texto não rastreados", ko: "민감 정보를 제외한 읽기 전용 스냅샷 · 스테이징 및 미스테이징 변경 사항 · 추적되지 않는 텍스트 미리 보기 선택 가능", nl: "Opgeschoonde, alleen-lezen momentopname · klaargezette en niet-k