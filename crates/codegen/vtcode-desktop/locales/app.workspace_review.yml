    no_previewable_changes_hint: {en: "No previewable changes in this snapshot. See the capture note for omitted files.", sv: "Inga förhandsgranskningsbara ändringar i denna ögonblicksbild. Se inspelningsanteckningen för utelämnade filer.", uk: "У цьому знімку немає змін для попереднього перегляду. Див. примітку захоплення, щоб дізнатися про пропущені файли.", hi: "इस स्नैपशॉट में पूर्वावलोकन योग्य बदलाव नहीं हैं। छोड़ी गई फ़ाइलों के लिए कैप्चर नोट देखें।", pl: "W tym zrzucie nie ma zmian do podglądu. Sprawdź notatkę o przechwyceniu, aby zobaczyć pominięte pliki.", tr: "Bu anlık görüntüde önizlenebilir değişiklik yok. Hariç tutulan dosyalar için yakalama notuna bakın.", vi: "Không có thay đổi nào để xem trước trong ảnh chụp này. Xem ghi chú để biết các tệp bị bỏ qua.", es: "Esta instantánea no contiene cambios previsualizables. Consulta la nota para ver los archivos omitidos.", fr: "Aucune modification à prévisualiser dans cet instantané. Consultez la note pour les fichiers omis.", ja: "このスナップショットにプレビューできる変更はありません。省略されたファイルは取得時の注記を確認してください。", de: "In dieser Momentaufnahme gibt es keine Änderungen für die Vorschau. In der Erfassungsnotiz stehen ausgelassene Dateien.", it: "Nessuna modifica da visualizzare in anteprima in questa istantanea. Consulta la nota per i file omessi.", zh-CN: "此快照中没有可预览的更改。请查看捕获说明了解被省略的文件。", zh-TW: "此快照中沒有可預覽的更改。請查看捕獲說明瞭解被省略的檔案。", zh-HK: "此快照中沒有可預覽的更改。請查看捕獲說明瞭解被省略的檔案。", pt-BR: "Não há alterações para prévia neste instantâneo. Consulte a nota de captura para ver os arquivos omitidos.", ko: "이 스냅샷에는 미리 볼 수 있는 변경 사항이 없습니다. 제외된 파일은 캡처 참고 사항을 확인하세요.", nl: "Deze momentopname bevat geen wijzigingen om te bekijken. Zie de opmerking voor overgeslagen bestanden.", ru: "В этом снимке нет изменений для предпросмотра. Сведения о пропущенных файлах см. в примечании к снимку.", id: "Tidak ada perubahan yang dapat dipratinjau dalam snapshot ini. Lihat catatan pengambilan untuk file yang dilewati."}
    tracked_files_clean_hint: {en: "Tracked files match the captured Git baseline. Untracked files are excluded.", sv: "Spårade filer matchar den fångade Git-baslinjen. Ospårade filer är exkluderade.", uk: "Відстежувані файли відповідають збереженій базовій версії Git. Невідстежувані файли не включено.", hi: "ट्रैक की गई फ़ाइलें कैप्चर किए गए Git आधार से मेल खाती हैं। अनट्रैक फ़ाइलें शामिल नहीं हैं।", pl: "Śledzone pliki są zgodne z przechwyconą bazą Git. Nieśledzone pliki są wykluczone.", tr: "İzlenen dosyalar yakalanan Git temel çizgisiyle eşleşiyor. İzlenmeyen dosyalar hariç tutuldu.", vi: "Các tệp được theo dõi khớp với mốc Git đã ghi lại. Tệp chưa được theo dõi không được bao gồm.", es: "Los archivos registrados coinciden con la base de Git capturada. Se excluyen los archivos sin seguimiento.", fr: "Les fichiers suivis correspondent à la référence Git capturée. Les fichiers non suivis sont exclus.", ja: "追跡対象のファイルは取得したGitの基準と一致しています。未追跡ファイルは除外されています。", de: "Nachverfolgte Dateien stimmen mit der erfassten Git-Basis überein. Nicht verfolgte Dateien sind ausgeschlossen.", it: "I file tracciati corrispondono alla base Git acquisita. I file non tracciati sono esclusi.", zh-CN: "已跟踪文件与捕获的 Git 基线一致。未跟踪文件不包含在内。", zh-TW: "已跟蹤檔案與捕獲的 Git 基線一致。未跟蹤檔案不包含在內。", zh-HK: "已跟蹤檔案與捕獲的 Git 基線一致。未跟蹤檔案不包含在內。", pt-BR: "Os arquivos rastreados correspondem à base Git capturada. Arquivos não rastreados foram excluídos.", ko: "추적 중인 파일은 캡처한 Git 기준과 일치합니다. 추적되지 않는 파일은 제외되었습니다.", nl: "Bijgehouden bestanden komen overeen met de vastgelegde Git-basis. Niet bijgehouden bestanden zijn uitgesloten.", ru: "Отслеживаемые файлы совпадают с сохранённой базой Git. Неотслеживаемые файлы исключены.", id: "File terlacak sesuai dengan baseline Git yang diambil. File tak terlacak dikecualikan."}
    preview_incomplete: {en: "Preview incomplete. See the capture note for omitted files or limits. Copy includes only the captured preview.", sv: "Förhandsgranskning ofullständig. Se inspelningsanteckningen för utelämnade filer eller begränsningar. Kopia innehåller endast den inspelade förhandsgranskningen.", uk: "Попередній перегляд неповний. Див. примітку захоплення щодо пропущених файлів або обмежень. Копіюється лише захоплений перегляд.", hi: "पूर्वावलोकन अधूरा है। छोड़ी गई फ़ाइलों या सीमाओं के लिए कैप्चर नोट देखें। कॉपी में केवल कैप्चर किया पूर्वावलोकन होगा।", pl: "Podgląd jest niekompletny. Sprawdź notatkę o przechwyceniu w sprawie pominiętych plików lub limitów. Kopiowanie obejmuje tylko przechwycony podgląd.", tr: "Önizleme tamamlanmadı. Hariç tutulan dosyalar veya sınırlar için yakalama notuna bakın. Kopyalama yalnızca yakalanan önizlemeyi içerir.", vi: "Bản xem trước chưa đầy đủ. Xem ghi chú để biết tệp bị bỏ qua hoặc giới hạn. Nội dung sao chép chỉ gồm bản xem trước đã ghi lại.", es: "La vista previa está incompleta. Consulta la nota para ver los archivos omitidos o los límites. La copia solo incluye la vista capturada.", fr: "L’aperçu est incomplet. Consultez la note pour connaître les fichiers omis ou les limites. La copie ne contient que l’aperçu capturé.", ja: "プレビューは不完全です。省略ファイルや上限は取得時の注記を確認してください。コピーには取得済みのプレビューのみ含まれます。", de: "Die Vorschau ist unvollständig. Ausgelassene Dateien und Grenzen stehen in der Erfassungsnotiz. Kopiert wird nur die erfasste Vorschau.", it: "L’anteprima è incompleta. Consulta la nota per i file omessi o i limiti. La copia include solo l’anteprima acquisita.", zh-CN: "预览不完整。请查看捕获说明了解被省略的文件或限制。复制内容仅包含已捕获的预览。", zh-TW: "預覽不完整。請查看捕獲說明瞭解被省略的檔案或限制。複製內容僅包含已捕獲的預覽。", zh-HK: "預覽不完整。請查看捕獲說明瞭解被省略的檔案或限制。複製內容僅包含已捕獲的預覽。", pt-BR: "A prévia está incompleta. Consulte a nota de captura para ver arquivos omitidos ou limites. A cópia inclui somente a prévia capturada.", ko: "미리 보기가 완전하지 않습니다. 제외된 파일이나 제한 사항은 캡처 참고 사항을 확인하세요. 복사에는 캡처한 미리 보기만 포함됩니다.", nl: "De voorvertoning is onvolledig. Zie de opmerking voor overgeslagen bestanden of limieten. Kopiëren neemt alleen de vastgelegde voorvertoning mee.", ru: "Предпросмотр неполный. Сведения о пропущенных файлах и ограничениях см. в примечании к снимку. Копируется только сохранённый предпросмотр.", id: "Pratinjau belum lengkap. Lihat catatan pengambilan untuk file yang dilewati atau batasan. Salinan hanya mencakup pratinjau yang diambil."}
    preview_truncated: {en: "Preview truncated at the review limit. Choose a narrower folder for a complete review. Copy includes only this preview.", sv: "Förhandsgranskning trunkerad vid granskningsgränsen. Välj en smalare mapp för en fullständig granskning. Kopia innehåller endast denna förhandsgranskning.", uk: "Попередній перегляд обрізано через обмеження. Виберіть вужчу папку для повного перегляду. Копіюється лише цей перегляд.", hi: "समीक्षा सीमा पर पूर्वावलोकन छोटा किया गया। पूरी समीक्षा के लिए छोटा फ़ोल्डर चुनें। कॉपी में केवल यही पूर्वावलोकन होगा।", pl: "Podgląd skrócono z powodu limitu przeglądu. Aby przejrzeć całość, wybierz węższy folder. Kopiowanie obejmuje tylko ten podgląd.", tr: "Önizleme inceleme sınırında kısaltıldı. Eksiksiz inceleme için daha dar bir klasör seçin. Kopyalama yalnızca bu önizlemeyi içerir.", vi: "Bản xem trước đã đạt giới hạn xem xét. Chọn thư mục hẹp hơn để xem đầy đủ. Nội dung sao chép chỉ gồm bản xem trước này.", es: "La vista previa alcanzó el límite de revisión. Elige una carpeta más específica para una revisión completa. La copia solo incluye esta vista.", fr: "L’aperçu a atteint la limite de revue. Choisissez un dossier plus précis pour tout examiner. La copie ne contient que cet aperçu.", ja: "プレビューはレビュー上限で切り詰められました。すべて確認するには対象フォルダを狭めてください。コピーにはこのプレビューのみ含まれます。", de: "Die Vorschau wurde am Prüflimit gekürzt. Wähle für eine vollständige Prüfung einen engeren Ordner. Kopiert wird nur diese Vorschau.", it: "L’anteprima è stata troncata al limite di revisione. Scegli una cartella più specifica per una revisione completa. La copia include solo questa anteprima.", zh-CN: "预览已达到审查上限。请选择更小的文件夹以完整查看。复制内容仅包含此预览。", zh-TW: "預覽已達到審查上限。請選擇更小的資料夾以完整查看。複製內容僅包含此預覽。", zh-HK: "預覽已達到審查上限。請選擇更小的資料夾以完整查看。複製內容僅包含此預覽。", pt-BR: "A prévia atingiu o limite de revisão. Escolha uma pasta mais específica para revisar tudo. A cópia inclui somente esta prévia.", ko: "검토 제한으로 미리 보기가 잘렸습니다. 전체 검토를 하려면 더 좁은 폴더를 선택하세요. 복사에는 이 미리 보기만 포함됩니다.", nl: "De voorvertoning is afgekapt bij de controlelimiet. Kies een kleinere map voor een volledige controle. Kopiëren bevat alleen deze voorvertoning.", ru: "Предпросмотр усечён из-за ограничения. Для полного просмотра выберите более узкую папку. Копируется только этот предпросмотр.", id: "Pratinjau dipotong karena batas ukuran. Pilih folder yang lebih sempit untuk tinjauan lengkap. Salinan hanya mencakup pratinjau ini."}
    structured_preview_unavailable: {en: "Structured preview unavailable for this patch. Showing the captured text.", sv: "Strukturerad förhandsgranskning är inte tillgänglig för denna patch. Visar den fångade texten.", uk: "Структурований перегляд цього патча недоступний. Показано захоплений текст.", hi: "इस पैच के लिए संरचित पूर्वावलोकन उपलब्ध नहीं है। कैप्चर किया गया टेक्स्ट दिखाया जा रहा है।", pl: "Podgląd strukturalny tej poprawki jest niedostępny. Wyświetlany jest przechwycony tekst.", tr: "Bu yama için yapılandırılmış önizleme kullanılamıyor. Yakalanan metin gösteriliyor.", vi: "Không thể hiển thị bản xem trước có cấu trúc cho bản vá này. Đang hiển thị văn bản đã ghi lại.", es: "La vista previa estructurada no está disponible para este parche. Se muestra el texto capturado.", fr: "L’aperçu structuré n’est pas disponible pour ce patch. Le texte capturé est affiché.", ja: "このパッチの構造化プレビューを利用できません。取得したテキストを表示しています。", de: "Für diesen Patch ist keine strukturierte Vorschau verfügbar. Der erfasste Text wird angezeigt.", it: "L’anteprima strutturata non è disponibile per questa patch. È mostrato il testo acquisito.", zh-CN: "此补丁无法使用结构化预览。正在显示捕获的文本。", zh-TW: "此補丁無法使用結構化預覽。正在顯示捕獲的文本。", zh-HK: "此補丁無法使用結構化預覽。正在顯示捕獲的文本。", pt-BR: "A prévia estruturada não está disponível para este patch. Exibindo o texto capturado.", ko: "이 패치에는 구조화된 미리 보기를 사용할 수 없습니다. 캡처한 텍스트를 표시합니다.", nl: "Er is geen gestructureerde voorvertoning voor deze patch. De vastgelegde tekst wordt getoond.", ru: "Структурированный предпросмотр этого патча недоступен. Показан сохранённый текст.", id: "Pratinjau terstruktur tidak tersedia untuk patch ini. Menampilkan teks yang diambil."}
    changed_files: {en: "Changed files", sv: "Ändrade filer", uk: "Змінені файли", hi: "बदली हुई फ़ाइलें", pl: "Zmienione pliki", tr: "Değişen dosyalar", vi: "Tệp đã thay đổi", es: "Archivos modificados", fr: "Fichiers modifiés", ja: "変更されたファイル", de: "Geänderte Dateien", it: "File modificati", zh-CN: "已更改的文件", zh-TW: "已更改的檔案", zh-HK: "已更改的檔案", pt-BR: "Arquivos alterados", ko: "변경된 파일", nl: "Gewijzigde bestanden", ru: "Изменённые файлы", id: "File yang berubah"}
