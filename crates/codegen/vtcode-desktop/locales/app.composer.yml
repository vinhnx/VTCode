    delivery_unconfirmed: {en: "Delivery was not confirmed. Check session history before resending. Restore this draft or copy it before dismissing.", vi: "Việc gửi chưa được xác nhận. Kiểm tra lịch sử phiên trước khi gửi lại. Khôi phục bản nháp này hoặc sao chép trước khi bỏ qua.", es: "El envío no se confirmó. Revisa el historial de la sesión antes de reenviar. Restaura este borrador o cópialo antes de descartarlo.", fr: "L'envoi n'a pas été confirmé. Vérifiez l'historique de la session avant de renvoyer. Restaurez ce brouillon ou copiez-le avant de l'ignorer.", ja: "配信が確認されませんでした。再送する前にセッション履歴を確認してください。破棄する前にこの下書きを復元またはコピーしてください。", de: "Die Zustellung wurde nicht bestätigt. Prüfe den Sitzungsverlauf vor dem erneuten Senden. Stelle diesen Entwurf wieder her oder kopiere ihn vor dem Verwerfen.", it: "L'invio non è stato confermato. Controlla la cronologia della sessione prima di rinviare. Ripristina questa bozza o copiala prima di scartarla.", zh-CN: "传递未得到确认。请在重新发送前检查会话历史。放弃前请恢复此草稿或复制它。", zh-TW: "傳送未獲確認。重新傳送前請檢查工作階段歷程。捨棄前請還原此草稿或複製它。", zh-HK: "傳送未獲確認。重新傳送前請檢查工作階段歷程。捨棄前請還原此草稿或複製它。", pt-BR: "A entrega não foi confirmada. Verifique o histórico da sessão antes de reenviar. Restaure este rascunho ou copie-o antes de dispensar.", ko: "전달이 확인되지 않았습니다. 다시 보내기 전에 세션 기록을 확인하세요. 닫기 전에 이 초안을 복원하거나 복사하세요.", nl: "Aflevering is niet bevestigd. Controleer de sessiegeschiedenis voordat je opnieuw verzendt. Herstel dit concept of kopieer het voordat je het negeert.", sv: "Leveransen bekräftades inte. Kontrollera sessionshistoriken innan du skickar igen. Återställ utkastet eller kopiera det innan du avfärdar det.", uk: "Доставку не підтверджено. Перевірте історію сеансу перед повторним надсиланням. Відновіть цю чернетку або скопіюйте її перед відхиленням.", hi: "वितरण की पुष्टि नहीं हुई। पुनः भेजने से पहले सत्र इतिहास जाँचें। खारिज करने से पहले यह मसौदा पुनर्स्थापित करें या कॉपी करें।", pl: "Dostarczenie nie zostało potwierdzone. Sprawdź historię sesji przed ponownym wysłaniem. Przywróć tę wersję roboczą lub skopiuj ją przed odrzuceniem.", tr: "Teslimat onaylanmadı. Yeniden göndermeden önce oturum geçmişini denetleyin. Kapatmadan önce bu taslağı geri yükleyin veya kopyalayın.", ru: "Доставка не подтверждена. Проверьте историю сеанса перед повторной отправкой. Восстановите этот черновик или скопируйте его перед отклонением.", id: "Pengiriman tidak dikonfirmasi. Periksa riwayat sesi sebelum mengirim ulang. Pulihkan draf ini atau salin sebelum mengabaikan."}
    draft_not_submitted: {en: "This message was not submitted. Restore this draft or copy it before dismissing.", vi: "Tin nhắn này chưa được gửi. Khôi phục bản nháp hoặc sao chép trước khi bỏ qua.", es: "Este mensaje no se envió. Restaura este borrador o cópialo antes de descartarlo.", fr: "Ce message n'a pas été envoyé. Restaurez ce brouillon ou copiez-le avant de l'ignorer.", ja: "このメッセージは送信されませんでした。破棄する前にこの下書きを復元またはコピーしてください。", de: "Diese Nachricht wurde nicht gesendet. Stelle diesen Entwurf wieder her oder kopiere ihn vor dem Verwerfen.", it: "Questo messaggio non è stato inviato. Ripristina questa bozza o copiala prima di scartarla.", zh-CN: "此消息未发送。放弃前请恢复此草稿或复制它。", zh-TW: "此訊息未傳送。捨棄前請還原此草稿或複製它。", zh-HK: "此訊息未傳送。捨棄前請還原此草稿或複製它。", pt-BR: "Esta mensagem não foi enviada. Restaure este rascunho ou copie-o antes de dispensar.", ko: "이 메시지가 전송되지 않았습니다. 닫기 전에 이 초안을 복원하거나 복사하세요.", nl: "Dit bericht is niet verzonden. Herstel dit concept of kopieer het voordat je het negeert.", sv: "Det här meddelandet skickades inte. Återställ utkastet eller kopiera det innan du avfärdar det.", uk: "Це повідомлення не надіслано. Відновіть цю чернетку або скопіюйте її перед відхиленням.", hi: "यह संदेश सबमिट नहीं हुआ। खारिज करने से पहले यह मसौदा पुनर्स्थापित करें या कॉपी करें।", pl: "Ta wiadomość nie została wysłana. Przywróć wersję roboczą lub skopiuj ją przed odrzuceniem.", tr: "Bu mesaj gönderilmedi. Kapatmadan önce bu taslağı geri yükleyin veya kopyalayın.", ru: "Это сообщение не отправлено. Восстановите черновик или скопируйте его перед отклонением.", id: "Pesan ini tidak terkirim. Pulihkan draf ini atau salin sebelum mengabaikan."}
    clear_draft_hint: {en: "Clear the current draft and attachments to restore.", vi: "Xóa bản nháp và tệp đính kèm hiện tại để khôi phục.", es: "Borra el borrador actual y los adjuntos para restaurar.", fr: "Effacez le brouillon actuel et les pièces jointes pour restaurer.", ja: "復元するには現在の下書きと添付ファイルをクリアしてください。", de: "Lösche den aktuellen Entwurf und Anhänge zum Wiederherstellen.", it: "Cancella la bozza corrente e gli allegati per ripristinare.", zh-CN: "清除当前草稿和附件以恢复。", zh-TW: "清除目前草稿和附件以還原。", zh-HK: "清除目前草稿和附件以還原。", pt-BR: "Limpe o rascunho atual e anexos para restaurar.", ko: "복원하려면 현재 초안과 첨부 파일을 지우세요.", nl: "Wis het huidige concept en bijlagen om te herstellen.", sv: "Rensa aktuellt utkast och bilagor för att återställa.", uk: "Очистьте поточну чернетку та вкладення для відновлення.", hi: "पुनर्स्थापित करने हेतु वर्तमान मसौदा और संलग्नक साफ़ करें।", pl: "Wyczyść bieżącą wersję roboczą i załączniki, aby przywrócić.", tr: "Geri yüklemek için geçerli taslağı ve ekleri temizleyin.", ru: "Очистите текущий черновик и вложения для восстановления.", id: "Hapus draf saat ini dan lampiran untuk memulihkan."}
