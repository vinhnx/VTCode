    cancelling_turn: {en: "Cancelling turn and waiting for cleanup…", vi: "Đang hủy lượt và chờ dọn dẹp…", es: "Cancelando el turno y esperando la limpieza…", fr: "Annulation du tour et attente du nettoyage…", ja: "ターンをキャンセルし、クリーンアップを待っています…", de: "Durchlauf wird abgebrochen, warte auf Bereinigung…", it: "Annullamento del turno e attesa della pulizia…", zh-CN: "正在取消轮次并等待清理…", zh-TW: "正在取消回合並等待清理…", zh-HK: "正在取消回合並等待清理…", pt-BR: "Cancelando o turno e aguardando a limpeza…", ko: "턴을 취소하고 정리 대기 중…", nl: "Beurt wordt geannuleerd, wachten op opruimen…", sv: "Avbryter tur och väntar på rensning…", uk: "Скасування ходу й очікування очищення…", hi: "टर्न रद्द हो रहा है और सफ़ाई की प्रतीक्षा है…", pl: "Anulowanie tury i oczekiwanie na sprzątanie…", tr: "Tur iptal ediliyor ve temizlik bekleniyor…", ru: "Отмена хода и ожидание очистки…", id: "Membatalkan giliran dan menunggu pembersihan…"}
