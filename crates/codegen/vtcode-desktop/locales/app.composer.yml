    cancellation_not_queued: {en: "The cancellation request could not be queued.", vi: "Không thể xếp yêu cầu hủy.", es: "La solicitud de cancelación no se pudo poner en cola.", fr: "La demande d'annulation n'a pas pu être mise en file d'attente.", ja: "キャンセル要求をキューに追加できませんでした。", de: "Die Abbruchanfrage konnte nicht eingereiht werden.", it: "La richiesta di annullamento non può essere messa in coda.", zh-CN: "取消请求无法排队。", zh-TW: "取消要求無法排隊。", zh-HK: "取消要求無法排隊。", pt-BR: "A solicitação de cancelamento não pôde ser enfileirada.", ko: "취소 요청을 대기열에 추가할 수 없습니다.", nl: "Het annuleringsverzoek kan niet in de wachtrij worden geplaatst.", sv: "Avbrytningsbegäran kunde inte köas.", uk: "Запит на скасування не вдалося поставити в чергу.", hi: "रद्दीकरण अनुरोध कतारबद्ध नहीं किया जा सका।", pl: "Nie można było umieścić żądania anulowania w kolejce.", tr: "İptal isteği kuyruğa alınamadı.", ru: "Запрос на отмену не удалось поставить в очередь.", id: "Permintaan pembatalan tidak dapat diantrekan."}
