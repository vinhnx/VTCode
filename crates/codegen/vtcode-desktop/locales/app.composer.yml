    reasoning_effort_hint: {en: "Use Left and Right arrows to adjust reasoning effort.", sv: "Använd vänster och höger pil för att justera resonemangsinsatsen.", uk: "Використовуйте стрілки вліво та вправо, щоб змінити рівень міркування.", hi: "तर्क प्रयास बदलने के लिए बाएँ और दाएँ तीर दबाएँ।", pl: "Użyj strzałek w lewo i w prawo, aby zmienić poziom rozumowania.", tr: "Akıl yürütme düzeyini ayarlamak için Sol ve Sağ ok tuşlarını kullanın.", vi: "Dùng phím mũi tên trái/phải để điều chỉnh mức độ suy luận.", es: "Usa las flechas izquierda y derecha para ajustar el esfuerzo de razonamiento.", fr: "Utilisez les flèches gauche et droite pour ajuster le niveau de raisonnement.", ja: "左右の矢印キーで推論の労力を調整します。", de: "Mit Links und Rechts den Denkaufwand anpassen.", it: "Usa le frecce sinistra e destra per regolare l’impegno di ragionamento.", zh-CN: "使用左右方向键调整推理强度。", zh-TW: "使用左右方向鍵調整推理強度。", zh-HK: "使用左右方向鍵調整推理強度。", pt-BR: "Use as setas esquerda e direita para ajustar o nível de raciocínio.", ko: "왼쪽/오른쪽 화살표 키로 추론 강도를 조정하세요.", nl: "Gebruik de pijltjestoetsen Links en Rechts om het redeneerniveau aan te passen.", ru: "Используйте стрелки влево и вправо для настройки уровня рассуждения.", id: "Gunakan tombol panah Kiri dan Kanan untuk mengatur tingkat penalaran."}
