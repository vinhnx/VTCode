    closed_new: {en: "Session closed. Start a new session to continue.", vi: "Đã đóng phiên. Bắt đầu phiên mới để tiếp tục.", es: "Sesión cerrada. Inicia una nueva sesión para continuar.", fr: "Session fermée. Démarrez une nouvelle session pour continuer.", ja: "セッションを閉じました。続けるには新しいセッションを開始してください。", de: "Sitzung geschlossen. Beginnen Sie eine neue Sitzung, um fortzufahren.", it: "Sessione chiusa. Avvia una nuova sessione per continuare.", zh-CN: "会话已关闭。开始新会话以继续。", zh-TW: "工作階段已關閉。開始新的工作階段以繼續。", zh-HK: "工作階段已關閉。開始新的工作階段以繼續。", pt-BR: "Sessão encerrada. Inicie uma nova sessão para continuar.", ko: "세션이 종료되었습니다. 계속하려면 새 세션을 시작하세요.", nl: "Sessie gesloten. Start een nieuwe sessie om door te gaan.", sv: "Sessionen stängd. Starta en ny session för att fortsätta.", uk: "Сеанс закрито. Почніть новий сеанс, щоб продовжити.", hi: "सत्र बंद हो गया। जारी रखने के लिए नया सत्र शुरू करें।", pl: "Sesja zamknięta. Rozpocznij nową sesję, aby kontynuować.", tr: "Oturum kapatıldı. Devam etmek için yeni bir oturum başlatın.", ru: "Сеанс закрыт. Начните новый сеанс, чтобы продолжить.", id: "Sesi ditutup. Mulai sesi baru untuk melanjutkan."}
    unsent_blocks_change: {en: "Restore or dismiss the unsent message before changing sessions or models.", vi: "Khôi phục hoặc loại bỏ tin nhắn chưa gửi trước khi đổi phiên hoặc mô hình.", es: "Restaura o descarta el mensaje no enviado antes de cambiar de sesión o modelo.", fr: "Restaurez ou ignorez le message non envoyé avant de changer de session ou de modèle.", ja: "セッションやモデルを変更する前に、未送信のメッセージを復元または破棄してください。", de: "Stellen Sie die ungesendete Nachricht wieder her oder verwerfen Sie sie, bevor Sie die Sitzung oder das Modell wechseln.", it: "Ripristina o ignora il messaggio non inviato prima di cambiare sessione o modello.", zh-CN: "在切换会话或模型之前，请恢复或放弃未发送的消息。", zh-TW: "在切換工作階段或模型之前，請還原或捨棄未傳送的訊息。", zh-HK: "在切換工作階段或模型之前，請還原或捨棄未傳送的訊息。", pt-BR: "Restaure ou dispense a mensagem não enviada antes de trocar de sessão ou modelo.", ko: "세션이나 모델을 변경하기 전에 전송되지 않은 메시지를 복원하거나 해제하세요.", nl: "Herstel of negeer het niet-verzonden bericht voordat je van sessie of model wisselt.", sv: "Återställ eller ignorera det oskickade meddelandet innan du byter session eller modell.", uk: "Відновіть або відхиліть ненадіслане повідомлення, перш ніж змінювати сеанс чи модель.", hi: "सत्र या मॉडल बदलने से पहले बिना भेजा संदेश पुनर्स्थापित या खारिज करें।", pl: "Przywróć lub odrzuć niewysłaną wiadomość przed zmianą sesji lub modelu.", tr: "Oturum veya model değiştirmeden önce gönderilmemiş mesajı geri yükleyin veya kapatın.", ru: "Восстановите или отклоните неотправленное сообщение, прежде чем менять сеанс или модель.", id: "Pulihkan atau abaikan pesan yang belum terkirim sebelum berganti sesi atau model."}
