app:
  session:
    preparing_new_thread: {en: "Preparing a new thread…", sv: "Förbereder en ny tråd...", uk: "Підготовка нової розмови…", hi: "नया थ्रेड तैयार हो रहा है…", pl: "Przygotowywanie nowego wątku…", tr: "Yeni sohbet hazırlanıyor…", es: "Preparando una conversación nueva…", fr: "Préparation d’une nouvelle conversation…", ja: "新しい会話を準備中…", vi: "Đang chuẩn bị một cuộc hội thoại mới…", de: "Neuer Chat wird vorbereitet…", it: "Preparazione di una nuova conversazione…", zh-CN: "正在准备新对话…", zh-TW: "正在準備新對話…", zh-HK: "正在準備新對話…", pt-BR: "Preparando uma nova conversa…", ko: "새 대화를 준비하는 중…", nl: "Nieuwe conversatie voorbereiden…", ru: "Подготовка нового диалога…", id: "Menyiapkan percakapan baru…"}
    waiting_to_send: {en: "Your message will send after the startup decision.", sv: "Ditt meddelande kommer att skickas efter startbeslutet.", uk: "Ваше повідомлення буде надіслано після ухвалення рішення про запуск.", hi: "शुरुआती निर्णय के बाद आपका संदेश भेजा जाएगा।", pl: "Wiadomość zostanie wysłana po podjęciu decyzji dotyczącej uruchomienia.", tr: "Başlangıç kararı verildikten sonra mesajınız gönderilecek.", es: "El mensaje se enviará después de la decisión inicial.", fr: "Votre message sera envoyé après la décision initiale.", ja: "最初の選択が完了するとメッセージが送信されます。", vi: "Tin nhắn sẽ được gửi sau khi bạn hoàn tất lựa chọn ban đầu.", de: "Deine Nachricht wird nach der Startentscheidung gesendet.", it: "Il messaggio verrà inviato dopo la scelta iniziale.", zh-CN: "初始选项确定后将发送你的消息。", zh-TW: "初始選項確定後將發送你的訊息。", zh-HK: "初始選項確定後將發送你的訊息。", pt-BR: "Sua mensagem será enviada após a decisão inicial.", ko: "시작 옵션을 결정한 후 메시지가 전송됩니다.", nl: "Je bericht wordt verzonden nadat de opstartkeuze is gemaakt.", ru: "Сообщение будет отправлено после решения при запуске.", id: "Pesan Anda akan dikirim setelah keputusan awal ditangani."}
    keep_as_draft: {en: "Keep as draft", sv: "Behåll som utkast", uk: "Залишити чернеткою", hi: "ड्राफ़्ट के रूप में रखें", pl: "Pozostaw jako wersję roboczą", tr: "Taslak olarak tut", es: "Guardar como borrador", fr: "Garder comme brouillon", ja: "下書きとして保持", vi: "Giữ làm bản nháp", de: "Als Entwurf behalten", it: "Mantieni come bozza", zh-CN: "保留为草稿", zh-TW: "保留為草稿", zh-HK: "保留為草稿", pt-BR: "Manter como rascunho", ko: "초안으로 유지", nl: "Als concept bewaren", ru: "Оставить черновиком", id: "Simpan sebagai draf"}
    updating_session: {en: "Updating session…", vi: "Đang cập nhật phiên…", es: "Actualizando sesión…", fr: "Mise à jour de la session…", ja: "セッションを更新しています…", de: "Sitzung wird aktualisiert…", it: "Aggiornamento della sessione…", zh-CN: "正在更新会话…", zh-TW: "正在更新工作階段…", zh-HK: "正在更新工作階段…", pt-BR: "Atualizando sessão…", ko: "세션 업데이트 중…", nl: "Sessie bijwerken…", sv: "Uppdaterar session…", uk: "Оновлення сеансу…", hi: "सत्र अपडेट हो रहा है…", pl: "Aktualizowanie sesji…", tr: "Oturum güncelleniyor…", ru: "Обновление сеанса…", id: "Memperbarui sesi…"}
    thread_ready: {en: "New thread ready. Submit a prompt to begin.", vi: "Cuộc trò chuyện mới đã sẵn sàng. Gửi lời nhắc để bắt đầu.", es: "Nuevo hilo listo. Envía un prompt para empezar.", fr: "Nouvelle conversation prête. Envoyez une invite pour commencer.", ja: "新しいスレッドの準備ができました。開始するにはプロンプトを送信してください。", de: "Neuer Chat bereit. Sende einen Prompt zum Starten.", it: "Nuova conversazione pronta. Invia un prompt per iniziare.", zh-CN: "新对话已就绪。提交提示以开始。", zh-TW: "新對話已就緒。提交提示以開始。", zh-HK: "新對話已就緒。提交提示以開始。", pt-BR: "Nova conversa pronta. Envie um prompt para começar.", ko: "새 대화가 준비되었습니다. 시작하려면 프롬프트를 제출하세요.", nl: "Nieuwe thread gereed. Verzend een prompt om te beginnen.", sv: "Ny tråd redo. Skicka en prompt för att börja.", uk: "Нова розмова готова. Надішліть запит, щоб почати.", hi: "नया थ्रेड तैयार। शुरू करने हेतु प्रॉम्प्ट सबमिट करें।", pl: "Nowy wątek gotowy. Wyślij monit, aby zacząć.", tr: "Yeni sohbet hazır. Başlamak için istem gönderin.", ru: "Новый диалог готов. Отправьте запрос, чтобы начать.", id: "Percakapan baru siap. Kirim perintah untuk memulai."}
    load_more_failed: {en: "Could not load more captured output. Try again.", vi: "Không thể tải thêm đầu ra đã ghi. Hãy thử lại.", es: "No se pudo cargar más salida capturada. Inténtalo de nuevo.", fr: "Impossible de charger plus de sortie capturée. Réessayez.", ja: "キャプチャした出力をさらに読み込めませんでした。再試行してください。", de: "Konnte nicht mehr erfasste Ausgabe laden. Versuche es erneut.", it: "Impossibile caricare altro output acquisito. Riprova.", zh-CN: "无法加载更多捕获的输出。请重试。", zh-TW: "無法載入更多擷取的輸出。請重試。", zh-HK: "無法載入更多擷取的輸出。請重試。", pt-BR: "Não foi possível carregar mais saída capturada. Tente novamente.", ko: "캡처한 출력을 더 로드할 수 없습니다. 다시 시도하세요.", nl: "Kan niet meer vastgelegde uitvoer laden. Probeer het opnieuw.", sv: "Kunde inte läsa in mer fångade utdata. Försök igen.", uk: "Не вдалося завантажити більше захопленого виводу. Спробуйте знову.", hi: "अधिक कैप्चर किया आउटपुट लोड नहीं किया जा सका। पुनः प्रयास करें।", pl: "Nie można wczytać więcej przechwyconych danych. Spróbuj ponownie.", tr: "Daha fazla yakalanan çıktı yüklenemedi. Yeniden deneyin.", ru: "Не удалось загрузить больше захваченного вывода. Повторите попытку.", id: "Tidak dapat memuat keluaran tertangkap lagi. Coba lagi."}
    restoring: {en: "Restoring conversation…", vi: "Đang khôi phục cuộc trò chuyện…", es: "Restaurando conversación…", fr: "Restauration de la conversation…", ja: "会話を復元しています…", de: "Unterhaltung wird wiederhergestellt…", it: "Ripristino della conversazione…", zh-CN: "正在恢复对话…", zh-TW: "正在還原對話…", zh-HK: "正在還原對話…", pt-BR: "Restaurando conversa…", ko: "대화 복원 중…", nl: "Gesprek herstellen…", sv: "Återställer konversation…", uk: "Відновлення розмови…", hi: "बातचीत पुनर्स्थापित हो रही है…", pl: "Przywracanie rozmowy…", tr: "Sohbet geri yükleniyor…", ru: "Восстановление диалога…", id: "Memulihkan percakapan…"}
    load_failed: {en: "Session load failed", vi: "Tải phiên thất bại", es: "Falló la carga de la sesión", fr: "Échec du chargement de la session", ja: "セッションの読み込みに失敗", de: "Sitzung konnte nicht geladen werden", it: "Caricamento sessione non riuscito", zh-CN: "会话加载失败", zh-TW: "工作階段載入失敗", zh-HK: "工作階段載入失敗", pt-BR: "Falha ao carregar sessão", ko: "세션 로드 실패", nl: "Sessie laden mislukt", sv: "Sessionsinläsning misslyckades", uk: "Не вдалося завантажити сеанс", hi: "सत्र लोड विफल", pl: "Wczytywanie sesji nie powiodło się", tr: "Oturum yüklenemedi", ru: "Не удалось загрузить сеанс", id: "Gagal memuat sesi"}
    invalid_load_result: {en: "The local service returned an invalid session load result.", vi: "Dịch vụ nội bộ trả về kết quả tải phiên không hợp lệ.", es: "El servicio local devolvió un resultado de carga de sesión no válido.", fr: "Le service local a renvoyé un résultat de chargement de session non valide.", ja: "ローカルサービスが無効なセッション読み込み結果を返しました。", de: "Der lokale Dienst gab ein ungültiges Sitzungsladeergebnis zurück.", it: "Il servizio locale ha restituito un risultato di caricamento sessione non valido.", zh-CN: "本地服务返回了无效的会话加载结果。", zh-TW: "本機服務傳回了無效的工作階段載入結果。", zh-HK: "本機服務傳回了無效的工作階段載入結果。", pt-BR: "O serviço local retornou um resultado de carregamento de sessão inválido.", ko: "로컬 서비스가 유효하지 않은 세션 로드 결과를 반환했습니다.", nl: "De lokale service heeft een ongeldig sessielaadresultaat geretourneerd.", sv: "Den lokala tjänsten returnerade ett ogiltigt sessionsinläsningsresultat.", uk: "Локальна служба повернула недійсний результат завантаження сеансу.", hi: "स्थानीय सेवा ने अमान्य सत्र लोड परिणाम दिया।", pl: "Usługa lokalna zwróciła nieprawidłowy wynik wczytywania sesji.", tr: "Yerel hizmet geçersiz bir oturum yükleme sonucu döndürdü.", ru: "Локальная служба вернула недействительный результат загрузки сеанса.", id: "Layanan lokal mengembalikan hasil muat sesi yang tidak valid."}
    transcript_limit: {en: "The transcript reached its local message limit. Start a new session to continue browsing.", vi: "Bản ghi đã đạt giới hạn tin nhắn nội bộ. Hãy bắt đầu phiên mới để tiếp tục duyệt.", es: "La transcripción alcanzó su límite local de mensajes. Inicia una nueva sesión para seguir explorando.", fr: "La transcription a atteint sa limite locale de messages. Démarrez une nouvelle session pour continuer à parcourir.", ja: "トランスクリプトがローカルメッセージ上限に達しました。引き続き参照するには新しいセッションを開始してください。", de: "Das Transkript hat sein lokales Nachrichtenlimit erreicht. Starte eine neue Sitzung, um weiter zu stöbern.", it: "La trascrizione ha raggiunto il limite locale di messaggi. Avvia una nuova sessione per continuare a sfogliare.", zh-CN: "对话已达到本地消息上限。请开始新会话以继续浏览。", zh-TW: "對話已達本機訊息上限。請開始新工作階段以繼續瀏覽。", zh-HK: "對話已達本機訊息上限。請開始新工作階段以繼續瀏覽。", pt-BR: "A transcrição atingiu seu limite local de mensagens. Inicie uma nova sessão para continuar navegando.", ko: "대화가 로컬 메시지 한도에 도달했습니다. 계속 찾아보려면 새 세션을 시작하세요.", nl: "De transcriptie heeft zijn lokale berichtenlimiet bereikt. Start een nieuwe sessie om verder te bladeren.", sv: "Transkriptet har nått sin lokala meddelandegräns. Starta en ny session för att fortsätta bläddra.", uk: "Транскрипт досяг локального ліміту повідомлень. Почніть новий сеанс, щоб продовжити перегляд.", hi: "ट्रांसक्रिप्ट अपनी स्थानीय संदेश सीमा पर पहुँचा। देखना जारी रखने हेतु नया सत्र शुरू करें।", pl: "Transkrypcja osiągnęła lokalny limit wiadomości. Rozpocznij nową sesję, aby kontynuować przeglądanie.", tr: "Transkript yerel ileti sınırına ulaştı. Göz atmaya devam etmek için yeni oturum başlatın.", ru: "Транскрипт достиг локального лимита сообщений. Начните новый сеанс, чтобы продолжить просмотр.", id: "Transkrip mencapai batas pesan lokal. Mulai sesi baru untuk lanjut menjelajah."}
    invalid_history_page: {en: "The local service returned an invalid history page.", vi: "Dịch vụ nội bộ trả về trang lịch sử không hợp lệ.", es: "El servicio local devolvió una página de historial no válida.", fr: "Le service local a renvoyé une page d'historique non valide.", ja: "ローカルサービスが無効な履歴ページを返しました。", de: "Der lokale Dienst gab eine ungültige Verlaufsseite zurück.", it: "Il servizio locale ha restituito una pagina di cronologia non valida.", zh-CN: "本地服务返回了无效的历史记录页。", zh-TW: "本機服務傳回了無效的歷程頁面。", zh-HK: "本機服務傳回了無效的歷程頁面。", pt-BR: "O serviço local retornou uma página de histórico inválida.", ko: "로컬 서비스가 유효하지 않은 기록 페이지를 반환했습니다.", nl: "De lokale service heeft een ongeldige geschiedenispagina geretourneerd.", sv: "Den lokala tjänsten returnerade en ogiltig historiksida.", uk: "Локальна служба повернула недійсну сторінку історії.", hi: "स्थानीय सेवा ने अमान्य इतिहास पृष्ठ दिया।", pl: "Usługa lokalna zwróciła nieprawidłową stronę historii.", tr: "Yerel hizmet geçersiz bir geçmiş sayfası döndürdü.", ru: "Локальная служба вернула недействительную страницу истории.", id: "Layanan lokal mengembalikan halaman riwayat yang tidak valid."}
    wrong_thread: {en: "The service returned a different thread than the navigation target.", vi: "Dịch vụ trả về cuộc trò chuyện khác với đích điều hướng.", es: "El servicio devolvió un hilo distinto del destino de navegación.", fr: "Le service a renvoyé une conversation différente de la cible de navigation.", ja: "サービスがナビゲーション先とは異なるスレッドを返しました。", de: "Der Dienst gab einen anderen Chat als das Navigationsziel zurück.", it: "Il servizio ha restituito una conversazione diversa dalla destinazione di navigazione.", zh-CN: "服务返回的对话与导航目标不一致。", zh-TW: "服務傳回的對話與導覽目標不一致。", zh-HK: "服務傳回的對話與導覽目標不一致。", pt-BR: "O serviço retornou uma conversa diferente do destino de navegação.", ko: "서비스가 탐색 대상과 다른 대화를 반환했습니다.", nl: "De service heeft een andere thread geretourneerd dan het navigatiedoel.", sv: "Tjänsten returnerade en annan tråd än navigeringsmålet.", uk: "Служба повернула іншу розмову, ніж ціль навігації.", hi: "सेवा ने नेविगेशन लक्ष्य से भिन्न थ्रेड दिया।", pl: "Usługa zwróciła inny wątek niż cel nawigacji.", tr: "Hizmet, gezinme hedefinden farklı bir sohbet döndürdü.", ru: "Служба вернула другой диалог, а не цель навигации.", id: "Layanan mengembalikan percakapan berbeda dari target navigasi."}
    wrong_session_retained: {en: "The service returned a different session; the unsent message was retained.", vi: "Dịch vụ trả về phiên khác; tin nhắn chưa gửi đã được giữ lại.", es: "El servicio devolvió una sesión distinta; el mensaje no enviado se conservó.", fr: "Le service a renvoyé une session différente ; le message non envoyé a été conservé.", ja: "サービスが異なるセッションを返しました。未送信メッセージは保持されました。", de: "Der Dienst gab eine andere Sitzung zurück; die ungesendete Nachricht wurde behalten.", it: "Il servizio ha restituito una sessione diversa; il messaggio non inviato è stato conservato.", zh-CN: "服务返回了不同的会话；未发送的消息已保留。", zh-TW: "服務傳回了不同的工作階段；未傳送的訊息已保留。", zh-HK: "服務傳回了不同的工作階段；未傳送的訊息已保留。", pt-BR: "O serviço retornou uma sessão diferente; a mensagem não enviada foi retida.", ko: "서비스가 다른 세션을 반환했습니다. 보내지 않은 메시지는 유지됩니다.", nl: "De service heeft een andere sessie geretourneerd; het niet-verzonden bericht is behouden.", sv: "Tjänsten returnerade en annan session; det oskickade meddelandet behölls.", uk: "Служба повернула інший сеанс; ненадіслане повідомлення збережено.", hi: "सेवा ने भिन्न सत्र दिया; अप्रेषित संदेश रखा गया।", pl: "Usługa zwróciła inną sesję; niewysłana wiadomość została zachowana.", tr: "Hizmet farklı bir oturum döndürdü; gönderilmeyen ileti saklandı.", ru: "Служба вернула другой сеанс; неотправленное сообщение сохранено.", id: "Layanan mengembalikan sesi berbeda; pesan yang belum terkirim dipertahankan."}
    loaded_partial: {en: "Session loaded. Recent inspector history is partial or unavailable.", vi: "Đã tải phiên. Lịch sử trình kiểm tra gần đây không đầy đủ hoặc không khả dụng.", es: "Sesión cargada. El historial reciente del inspector es parcial o no está disponible.", fr: "Session chargée. L'historique récent de l'inspecteur est partiel ou indisponible.", ja: "セッションを読み込みました。最近のインスペクター履歴は部分的または利用できません。", de: "Sitzung geladen. Der neueste Inspektorenverlauf ist unvollständig oder nicht verfügbar.", it: "Sessione caricata. La cronologia recente dell'ispettore è parziale o non disponibile.", zh-CN: "会话已加载。近期的检查器历史不完整或不可用。", zh-TW: "工作階段已載入。近期的檢閱器歷程不完整或無法使用。", zh-HK: "工作階段已載入。近期的檢閱器歷程不完整或無法使用。", pt-BR: "Sessão carregada. O histórico recente do inspetor está parcial ou indisponível.", ko: "세션을 로드했습니다. 최근 검사기 기록이 일부이거나 사용할 수 없습니다.", nl: "Sessie geladen. Recente inspectorgeschiedenis is gedeeltelijk of niet beschikbaar.", sv: "Session inläst. Senaste inspektörshistorik är partiell eller inte tillgänglig.", uk: "Сеанс завантажено. Нещодавня історія інспектора часткова або недоступна.", hi: "सत्र लोड हुआ। हालिया इंस्पेक्टर इतिहास आंशिक या अनुपलब्ध है।", pl: "Wczytano sesję. Ostatnia historia inspektora jest częściowa lub niedostępna.", tr: "Oturum yüklendi. Son denetçi geçmişi kısmi veya kullanılamıyor.", ru: "Сеанс загружен. Недавняя история инспектора частична или недоступна.", id: "Sesi dimuat. Riwayat inspektur terkini sebagian atau tidak tersedia."}
    loaded_prompt: {en: "Session loaded. Submit a prompt to continue.", vi: "Đã tải phiên. Gửi lời nhắc để tiếp tục.", es: "Sesión cargada. Envía un prompt para continuar.", fr: "Session chargée. Envoyez une invite pour continuer.", ja: "セッションを読み込みました。続行するにはプロンプトを送信してください。", de: "Sitzung geladen. Sende einen Prompt zum Fortfahren.", it: "Sessione caricata. Invia un prompt per continuare.", zh-CN: "会话已加载。提交提示以继续。", zh-TW: "工作階段已載入。提交提示以繼續。", zh-HK: "工作階段已載入。提交提示以繼續。", pt-BR: "Sessão carregada. Envie um prompt para continuar.", ko: "세션을 로드했습니다. 계속하려면 프롬프트를 제출하세요.", nl: "Sessie geladen. Verzend een prompt om door te gaan.", sv: "Session inläst. Skicka en prompt för att fortsätta.", uk: "Сеанс завантажено. Надішліть запит, щоб продовжити.", hi: "सत्र लोड हुआ। जारी रखने हेतु प्रॉम्प्ट सबमिट करें।", pl: "Wczytano sesję. Wyślij monit, aby kontynuować.", tr: "Oturum yüklendi. Devam etmek için istem gönderin.", ru: "Сеанс загружен. Отправьте запрос, чтобы продолжить.", id: "Sesi dimuat. Kirim perintah untuk melanjutkan."}
    switching_model: {en: "Switching model…", vi: "Đang chuyển mô hình…", es: "Cambiando de modelo…", fr: "Changement de modèle…", ja: "モデルを切り替えています…", de: "Modell wird gewechselt…", it: "Cambio modello…", zh-CN: "正在切换模型…", zh-TW: "正在切換模型…", zh-HK: "正在切換模型…", pt-BR: "Alternando modelo…", ko: "모델 전환 중…", nl: "Model wisselen…", sv: "Byter modell…", uk: "Перемикання моделі…", hi: "मॉडल बदला जा रहा है…", pl: "Przełączanie modelu…", tr: "Model değiştiriliyor…", ru: "Переключение модели…", id: "Beralih model…"}
