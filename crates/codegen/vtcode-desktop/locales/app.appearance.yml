    custom_theme_delete_detail: {en: "This removes the theme from this device. The current selection falls back to the default theme.", vi: "Thao tác này xóa chủ đề khỏi thiết bị. Lựa chọn hiện tại sẽ trở về chủ đề mặc định.", es: "Esto elimina el tema de este dispositivo. La selección actual vuelve al tema predeterminado.", fr: "Le thème sera retiré de cet appareil. La sélection actuelle reviendra au thème par défaut.", ja: "このテーマをこのデバイスから削除します。現在の選択は既定のテーマに戻ります。", de: "Das entfernt das Theme von diesem Gerät. Die aktuelle Auswahl fällt auf das Standard-Theme zurück.", it: "Questo rimuove il tema da questo dispositivo. La selezione attuale torna al tema predefinito.", zh-CN: "这会从此设备移除该主题。当前选择将回退到默认主题。", zh-TW: "這會從此裝置移除該主題。目前的選擇將回到預設主題。", zh-HK: "這會從此裝置移除該主題。目前的選擇將回到預設主題。", pt-BR: "Isso remove o tema deste dispositivo. A seleção atual volta para o tema padrão.", ko: "이 테마를 이 기기에서 제거합니다. 현재 선택은 기본 테마로 돌아갑니다.", nl: "Hiermee wordt het thema van dit apparaat verwijderd. De huidige selectie valt terug op het standaardthema.", sv: "Detta tar bort temat från den här enheten. Den aktuella valet faller tillbaka på standardtemat.", uk: "Це видалить тему з цього пристрою. Поточний вибір повернеться до типової теми.", hi: "इससे थीम इस डिवाइस से हट जाएगी। वर्तमान चयन डिफ़ॉल्ट थीम पर लौट आएगा।", pl: "Spowoduje to usunięcie motywu z tego urządzenia. Bieżący wybór wróci do motywu domyślnego.", tr: "Bu, temayı bu cihazdan kaldırır. Geçerli seçim varsayılan temaya döner.", ru: "Тема будет удалена с этого устройства. Текущий выбор вернётся к теме по умолчанию.", id: "Ini menghapus tema dari perangkat ini. Pilihan saat ini kembali ke tema default."}
    custom_theme_name_required: {en: "Enter a theme name.", vi: "Hãy nhập tên chủ đề.", es: "Introduce un nombre para el tema.", fr: "Saisissez un nom de thème.", ja: "テーマ名を入力してください。", de: "Gib einen Theme-Namen ein.", it: "Inserisci un nome per il tema.", zh-CN: "请输入主题名称。", zh-TW: "請輸入主題名稱。", zh-HK: "請輸入主題名稱。", pt-BR: "Digite um nome para o tema.", ko: "테마 이름을 입력하세요.", nl: "Voer een themanaam in.", sv: "Ange ett temanamn.", uk: "Введіть назву теми.", hi: "थीम का नाम दर्ज करें।", pl: "Wpisz nazwę motywu.", tr: "Bir tema adı girin.", ru: "Введите название темы.", id: "Masukkan nama tema."}
    custom_theme_name_too_long: {en: "Theme names are limited to 40 characters.", vi: "Tên chủ đề tối đa 40 ký tự.", es: "Los nombres de tema se limitan a 40 caracteres.", fr: "Les noms de thème sont limités à 40 caractères.", ja: "テーマ名は 40 文字までです。", de: "Theme-Namen sind auf 40 Zeichen begrenzt.", it: "I nomi dei temi sono limitati a 40 caratteri.", zh-CN: "主题名称最多 40 个字符。", zh-TW: "主題名稱最多 40 個字元。", zh-HK: "主題名稱最多 40 個字元。", pt-BR: "Os nomes de tema são limitados a 40 caracteres.", ko: "테마 이름은 40자로 제한됩니다.", nl: "Themanamen zijn beperkt tot 40 tekens.", sv: "Temanamn är begränsade till 40 tecken.", uk: "Назви тем обмежені 40 символами.", hi: "थीम नाम 40 वर्णों तक सीमित हैं।", pl: "Nazwy motywów są ograniczone do 40 znaków.", tr: "Tema adları 40 karakterle sınırlıdır.", ru: "Названия тем ограничены 40 символами.", id: "Nama tema dibatasi 40 karakter."}
    custom_theme_name_taken: {en: "A theme with that name already exists.", vi: "Đã có chủ đề với tên này.", es: "Ya existe un tema con ese nombre.", fr: "Un thème portant ce nom existe déjà.", ja: "その名前のテーマはすでに存在します。", de: "Ein Theme mit diesem Namen existiert bereits.", it: "Esiste già un tema con questo nome.", zh-CN: "已存在同名主题。", zh-TW: "已存在同名主題。", zh-HK: "已存在同名主題。", pt-BR: "Já existe um tema com esse nome.", ko: "같은 이름의 테마가 이미 있습니다.", nl: "Er bestaat al een thema met die naam.", sv: "Det finns redan ett tema med det namnet.", uk: "Тема з такою назвою вже існує.", hi: "इस नाम की थीम पहले से मौजूद है।", pl: "Motyw o tej nazwie już istnieje.", tr: "Bu ada sahip bir tema zaten var.", ru: "Тема с таким названием уже существует.", id: "Tema dengan nama itu sudah ada."}
    custom_theme_contrast_low_error: {en: "Text and background need at least 4.5:1 contrast.", vi: "Chữ và nền cần độ tương phản tối thiểu 4,5:1.", es: "El texto y el fondo necesitan un contraste de al menos 4,5:1.", fr: "Le texte et le fond doivent avoir un contraste d’au moins 4,5:1.", ja: "テキストと背景には 4.5:1 以上のコントラストが必要です。", de: "Text und Hintergrund brauchen mindestens 4,5:1 Kontrast.", it: "Testo e sfondo richiedono un contrasto di almeno 4,5:1.", zh-CN: "文字与背景的对比度至少需要 4.5:1。", zh-TW: "文字與背景的對比度至少需要 4.5:1。", zh-HK: "文字與背景的對比度至少需要 4.5:1。", pt-BR: "Texto e fundo precisam de pelo menos 4,5:1 de contraste.", ko: "텍스트와 배경에는 최소 4.5:1의 대비가 필요합니다.", nl: "Tekst en achtergrond hebben minimaal 4,5:1 contrast nodig.", sv: "Text och bakgrund behöver minst 4,5:1 i kontrast.", uk: "Текст і фон потребують контрастності щонайменше 4,5:1.", hi: "टेक्स्ट और पृष्ठभूमि के लिए कम से कम 4.5:1 कंट्रास्ट आवश्यक है।", pl: "Tekst i tło wymagają kontrastu co najmniej 4,5:1.", tr: "Metin ve arka plan en az 4,5:1 kontrast gerektirir.", ru: "Текст и фон должны иметь контраст не менее 4,5:1.", id: "Teks dan latar belakang memerlukan kontras minimal 4,5:1."}
