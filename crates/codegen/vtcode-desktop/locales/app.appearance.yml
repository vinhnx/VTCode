    custom_themes_description: {en: "Create themes from your own colors. They stay on this device and are never sent to the CLI.", vi: "Tạo chủ đề từ màu của bạn. Chủ đề chỉ lưu trên thiết bị này và không bao giờ được gửi tới CLI.", es: "Crea temas con tus propios colores. Se guardan en este dispositivo y nunca se envían a la CLI.", fr: "Créez des thèmes à partir de vos propres couleurs. Ils restent sur cet appareil et ne sont jamais envoyés à la CLI.", ja: "独自の色からテーマを作成できます。テーマはこのデバイスにのみ保存され、CLI には送信されません。", de: "Erstelle Themes aus deinen eigenen Farben. Sie bleiben auf diesem Gerät und werden nie an die CLI gesendet.", it: "Crea temi dai tuoi colori. Restano su questo dispositivo e non vengono mai inviati alla CLI.", zh-CN: "使用自己的颜色创建主题。主题仅保留在此设备上，绝不会发送到 CLI。", zh-TW: "使用自己的顏色建立主題。主題僅保留在此裝置上，絕不會傳送到 CLI。", zh-HK: "使用自己的顏色建立主題。主題僅保留在此裝置上，絕不會傳送到 CLI。", pt-BR: "Crie temas com suas próprias cores. Eles ficam neste dispositivo e nunca são enviados para a CLI.", ko: "사용자의 색상으로 테마를 만듭니다. 테마는 이 기기에만 저장되며 CLI로 전송되지 않습니다.", nl: "Maak thema's van je eigen kleuren. Ze blijven op dit apparaat en worden nooit naar de CLI gestuurd.", sv: "Skapa teman av dina egna färger. De stannar på den här enheten och skickas aldrig till CLI.", uk: "Створюйте теми зі своїх кольорів. Вони зберігаються на цьому пристрої й ніколи не надсилаються до CLI.", hi: "अपने रंगों से थीम बनाएँ। ये केवल इस डिवाइस पर रहती हैं और कभी CLI को नहीं भेजी जाती हैं।", pl: "Twórz motywy z własnych kolorów. Pozostają na tym urządzeniu i nigdy nie są wysyłane do CLI.", tr: "Kendi renklerinizden tema oluşturun. Tema bu cihazda kalır ve hiçbir zaman CLI'ya gönderilmez.", ru: "Создавайте темы из своих цветов. Они остаются на этом устройстве и никогда не отправляются в CLI.", id: "Buat tema dari warna Anda sendiri. Tema disimpan di perangkat ini dan tidak pernah dikirim ke CLI."}
