    unsent_guard: {en: "Restore or dismiss the unsent message before changing workspaces.", vi: "Khôi phục hoặc bỏ qua tin nhắn chưa gửi trước khi đổi không gian làm việc.", es: "Restaura o descarta el mensaje no enviado antes de cambiar de espacio de trabajo.", fr: "Restaurez ou ignorez le message non envoyé avant de changer d'espace de travail.", ja: "ワークスペースを変更する前に未送信メッセージを復元または破棄してください。", de: "Stelle die ungesendete Nachricht wieder her oder verwerfe sie, bevor du den Arbeitsbereich wechselst.", it: "Ripristina o scarta il messaggio non inviato prima di cambiare spazio di lavoro.", zh-CN: "请先恢复或放弃未发送的消息，再切换工作区。", zh-TW: "請先還原或捨棄未傳送的訊息，再切換工作區。", zh-HK: "請先還原或捨棄未傳送的訊息，再切換工作區。", pt-BR: "Restaure ou dispense a mensagem não enviada antes de trocar de espaço de trabalho.", ko: "작업 공간을 변경하기 전에 보내지 않은 메시지를 복원하거나 닫으세요.", nl: "Herstel of negeer het niet-verzonden bericht voordat je van werkruimte wisselt.", sv: "Återställ eller avfärda det oskickade meddelandet innan du byter arbetsyta.", uk: "Відновіть або відхиліть ненадіслане повідомлення, перш ніж змінювати робочу область.", hi: "कार्यक्षेत्र बदलने से पहले अप्रेषित संदेश पुनर्स्थापित करें या खारिज करें।", pl: "Przywróć lub odrzuć niewysłaną wiadomość przed zmianą obszaru roboczego.", tr: "Çalışma alanını değiştirmeden önce gönderilmeyen iletiyi geri yükleyin veya kapatın.", ru: "Восстановите или отклоните неотправленное сообщение перед сменой рабочей области.", id: "Pulihkan atau abaikan pesan yang belum terkirim sebelum berganti ruang kerja."}
    busy_guard: {en: "Cancel the active turn or wait for the pending session change before switching workspaces.", vi: "Hủy lượt đang chạy hoặc đợi chuyển phiên đang chờ trước khi đổi không gian làm việc.", es: "Cancela el turno activo o espera el cambio de sesión pendiente antes de cambiar de espacio de trabajo.", fr: "Annulez le tour actif ou attendez le changement de session en attente avant de changer d'espace de travail.", ja: "ワークスペースを切り替える前にアクティブなターンをキャンセルするか、保留中のセッション変更を待ってください。", de: "Brich den aktiven Durchlauf ab oder warte auf den ausstehenden Sitzungswechsel, bevor du den Arbeitsbereich wechselst.", it: "Annulla il turno attivo o attendi il cambio di sessione in sospeso prima di cambiare spazio di lavoro.", zh-CN: "请先取消正在进行的轮次，或等待待处理的会话切换完成，再切换工作区。", zh-TW: "請先取消進行中的回合，或等待待處理的工作階段切換完成，再切換工作區。", zh-HK: "請先取消進行中的回合，或等待待處理的工作階段切換完成，再切換工作區。", pt-BR: "Cancele o turno ativo ou aguarde a troca de sessão pendente antes de trocar de espaço de trabalho.", ko: "작업 공간을 전환하기 전에 활성 턴을 취소하거나 보류 중인 세션 변경을 기다리세요.", nl: "Annuleer de actieve beurt of wacht op de openstaande sessiewissel voordat je van werkruimte wisselt.", sv: "Avbryt den aktiva turen eller vänta på det väntande sessionsbytet innan du byter arbetsyta.", uk: "Скасуйте активний хід або дочекайтеся незавершеної зміни сеансу, перш ніж змінювати робочу область.", hi: "कार्यक्षेत्र बदलने से पहले सक्रिय टर्न रद्द करें या लंबित सत्र परिवर्तन की प्रतीक्षा करें।", pl: "Anuluj aktywną turę lub poczekaj na oczekującą zmianę sesji przed zmianą obszaru roboczego.", tr: "Çalışma alanını değiştirmeden önce etkin turu iptal edin veya bekleyen oturum değişimini bekleyin.", ru: "Отмените активный ход или дождитесь незавершённой смены сеанса перед сменой рабочей области.", id: "Batalkan giliran aktif atau tunggu perubahan sesi tertunda sebelum berganti ruang kerja."}
