    footer_hint: {en: "Edit a row to press a new chord, or remove it to unbind it. Use cmd, ctrl, or alt with a key.", vi: "Sửa một hàng để nhấn tổ hợp mới, hoặc gỡ để hủy gán. Dùng cmd, ctrl hoặc alt với một phím.", es: "Edita una fila para pulsar una nueva combinación o quítala para desenlazarla. Usa cmd, ctrl o alt con una tecla.", fr: "Modifiez une ligne pour saisir un nouvel accord, ou supprimez-la pour la dissocier. Utilisez cmd, ctrl ou alt avec une touche.", ja: "行を編集して新しいコードを押すか、削除してバインドを解除します。キーとcmd、ctrl、altを組み合わせて使います。", de: "Bearbeite eine Zeile, um einen neuen Akkord zu drücken, oder entferne sie zum Entbinden. Nutze cmd, ctrl oder alt mit einer Taste.", it: "Modifica una riga per premere un nuovo accordo, o rimuovila per dissociarla. Usa cmd, ctrl o alt con un tasto.", zh-CN: "编辑一行以按下新的组合键，或将其移除以解绑。请将 cmd、ctrl 或 alt 与按键组合使用。", zh-TW: "編輯一列以按下新的按鍵組合，或將其移除以解除繫結。請將 cmd、ctrl 或 alt 與按鍵搭配使用。", zh-HK: "編輯一列以按下新的按鍵組合，或將其移除以解除繫結。請將 cmd、ctrl 或 alt 與按鍵搭配使用。", pt-BR: "Edite uma linha para pressionar um novo acorde ou remova-a para desvincular. Use cmd, ctrl ou alt com uma tecla.", ko: "행을 편집하여 새 코드를 누르거나 제거하여 바인딩을 해제하세요. 키와 함께 cmd, ctrl 또는 alt를 사용하세요.", nl: "Bewerk een rij om een nieuw akkoord in te drukken of verwijder deze om de binding op te heffen. Gebruik cmd, ctrl of alt met een toets.", sv: "Redigera en rad för att trycka ett nytt ackord, eller ta bort den för att koppla loss den. Använd cmd, ctrl eller alt med en tangent.", uk: "Відредагуйте рядок, щоб натиснути новий акорд, або приберіть його, щоб скасувати прив'язку. Використовуйте cmd, ctrl або alt із клавішею.", hi: "नया कॉर्ड दबाने हेतु कोई पंक्ति संपादित करें, या अनबाइंड हेतु हटाएँ। किसी कुंजी के साथ cmd, ctrl या alt उपयोग करें।", pl: "Edytuj wiersz, aby nacisnąć nowy akord, lub usuń go, aby cofnąć powiązanie. Użyj cmd, ctrl lub alt z klawiszem.", tr: "Yeni akor girmek için bir satırı düzenleyin veya bağını çözmek için kaldırın. Bir tuşla cmd, ctrl veya alt kullanın.", ru: "Отредактируйте строку, чтобы нажать новый аккорд, или уберите её, чтобы снять привязку. Используйте cmd, ctrl или alt с клавишей.", id: "Edit baris untuk menekan akor baru, atau hapus untuk melepasnya. Gunakan cmd, ctrl, atau alt dengan tombol."}
