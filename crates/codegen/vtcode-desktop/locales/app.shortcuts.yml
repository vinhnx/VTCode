    queue_batched_label: {en: "Queue as one turn", vi: "Xếp hàng thành một lượt", es: "Poner en cola como un turno", fr: "Mettre en file comme un seul tour", ja: "1つのターンとしてキューに追加", de: "Als einen Turn einreihen", it: "Accoda come un unico turno", zh-CN: "合并为一回合排队", zh-TW: "合併為一回合排入佇列", zh-HK: "合併做一個回合排隊", pt-BR: "Enfileirar como um turno", ko: "하나의 턴으로 대기열에 추가", nl: "In wachtrij als één beurt", sv: "Köa som en körning", uk: "Додати в чергу одним ходом", hi: "एक टर्न के रूप में कतार में लगाएं", pl: "Dodaj do kolejki jako jedną turę", tr: "Tek tur olarak kuyruğa ekle", ru: "Поставить в очередь одним ходом", id: "Antrekan sebagai satu giliran"}
    queue_batched_description: {en: "Submit the prompt; while a turn runs, merge it with other queued messages into a single turn.", vi: "Gửi lời nhắc; trong khi lượt chạy đang diễn ra, gộp nó với các tin nhắn chờ khác thành một lượt duy nhất.", es: "Envía la petición; mientras se ejecuta un turno, combínala con otros mensajes en cola en un solo turno.", fr: "Envoyer la requête ; pendant l’exécution d’un tour, la fusionner avec les autres messages en file en un seul tour.", ja: "プロンプトを送信します。ターンの実行中は、キュー内の他のメッセージと結合して1つのターンにします。", de: "Prompt senden; während ein Turn läuft, mit anderen eingereihten Nachrichten zu einem Turn zusammenführen.", it: "Invia il prompt; mentre è in corso un turno, uniscilo agli altri messaggi in coda in un unico turno.", zh-CN: "提交提示；在回合运行时，将其与队列中的其他消息合并为单个回合。", zh-TW: "送出提示；在回合執行時，將其與佇列中的其他訊息合併為單一回合。", zh-HK: "送出提示；喺回合執行緊嗰陣，將佢同排緊隊嘅其他訊息合併做一個回合。", pt-BR: "Envia o prompt; enquanto um turno está em execução, mescla-o com outras mensagens na fila em um único turno.", ko: "프롬프트를 제출합니다. 턴이 실행되는 동안 대기열의 다른 메시지와 합쳐 단일 턴으로 만듭니다.", nl: "Verstuur de prompt; terwijl een beurt loopt, voeg deze samen met andere berichten in de wachtrij tot één beurt.", sv: "Skicka prompten; medan en körning pågår slås den ihop med andra köade meddelanden till en enda körning.", uk: "Надіслати запит; поки хід виконується, об’єднати його з іншими повідомленнями в черзі в один хід.", hi: "प्रॉम्प्ट जमा करें; टर्न चलने के दौरान इसे अन्य कतारबद्ध संदेशों के साथ मिलाकर एक टर्न बनाएं।", pl: "Wyślij monit; gdy trwa tura, połącz go z innymi wiadomościami w kolejce w jedną turę.", tr: "İstemi gönder; bir tur çalışırken kuyruktaki diğer mesajlarla birleştirip tek tur yap.", ru: "Отправить запрос; пока выполняется ход, объединить его с другими сообщениями в очереди в один ход.", id: "Kirim perintah; saat giliran berjalan, gabungkan dengan pesan antre lainnya menjadi satu giliran."}
    prompt_history_label: {en: "Prompt history", vi: "Lịch sử prompt", es: "Historial de prompts", fr: "Historique des prompts", ja: "プロンプト履歴", de: "Promptverlauf", it: "Cronologia dei prompt", zh-CN: "提示词历史", zh-TW: "提示詞歷史", zh-HK: "提示詞歷史", pt-BR: "Histórico de prompts", ko: "프롬프트 기록", nl: "Promptgeschiedenis", sv: "Prompthistorik", uk: "Історія промптів", hi: "प्रॉम्प्ट इतिहास", pl: "Historia promptów", tr: "İstem geçmişi", ru: "История промптов", id: "Riwayat prompt"}
    prompt_history_description: {en: "Search previous prompts and reuse one as a draft", vi: "Tìm các prompt trước đây và dùng lại một prompt làm bản nháp", es: "Busca prompts anteriores y reutiliza uno como borrador", fr: "Rechercher des prompts précédents et en réutiliser un comme brouillon", ja: "以前のプロンプトを検索して下書きとして再利用", de: "Frühere Prompts suchen und einen als Entwurf wiederverwenden", it: "Cerca i prompt precedenti e riusane uno come bozza", zh-CN: "搜索以前的提示词并将其作为草稿重复使用", zh-TW: "搜尋以前的提示詞並將其作為草稿重複使用", zh-HK: "搜尋以前的提示詞並將其作為草稿重複使用", pt-BR: "Pesquise prompts anteriores e reutilize um como rascunho", ko: "이전 프롬프트를 검색하여 초안으로 다시 사용", nl: "Zoek eerdere prompts en hergebruik er een als concept", sv: "Sök tidigare promptar och återanvänd en som utkast", uk: "Шукайте попередні промпти й повторно використовуйте один як чернетку", hi: "पिछले प्रॉम्प्ट खोजें और एक को मसौदे के रूप में पुनः उपयोग करें", pl: "Szukaj poprzednich promptów i użyj jednego ponownie jako wersji roboczej", tr: "Önceki istemleri arayın ve birini taslak olarak yeniden kullanın", ru: "Ищите предыдущие промпты и повторно используйте один как черновик", id: "Cari prompt sebelumnya dan gunakan lagi satu sebagai draf"}
    edit_queue_label: {en: "Edit queued message", vi: "Sửa tin nhắn đang xếp hàng", es: "Editar mensaje en cola", fr: "Modifier le message en file d'attente", ja: "キュー済みメッセージを編集", de: "Nachricht in Warteschlange bearbeiten", it: "Modifica messaggio in coda", zh-CN: "编辑排队的消息", zh-TW: "編輯佇列中的訊息", zh-HK: "編輯佇列中的訊息", pt-BR: "Editar mensagem na fila", ko: "대기 중인 메시지 편집", nl: "Bericht in wachtrij bewerken", sv: "Redigera köat meddelande", uk: "Редагувати повідомлення в черзі", hi: "कतारबद्ध संदेश संपादित करें", pl: "Edytuj wiadomość w kolejce", tr: "Kuyruktaki iletiyi düzenleyin", ru: "Редактировать сообщение в очереди", id: "Edit pesan antre"}
    edit_queue_description: {en: "Pop the newest queued message back into the composer", vi: "Đưa tin nhắn đang xếp hàng mới nhất trở lại trình soạn", es: "Devuelve el mensaje en cola más reciente al editor", fr: "Renvoyer le message en file d'attente le plus récent dans l'éditeur", ja: "最新のキュー済みメッセージをコンポーザーに戻す", de: "Neueste Nachricht aus der Warteschlange zurück in den Composer holen", it: "Riporta il messaggio in coda più recente nel compositore", zh-CN: "将最新的排队消息取回编辑器", zh-TW: "將最新的佇列訊息取回編輯器", zh-HK: "將最新的佇列訊息取回編輯器", pt-BR: "Traga a mensagem mais recente da fila de volta ao composer", ko: "가장 최근의 대기 메시지를 작성기로 다시 가져오기", nl: "Haal het nieuwste bericht uit de wachtrij terug naar de editor", sv: "Hämta tillbaka det nyaste köade meddelandet till kompositören", uk: "Повернути найновіше повідомлення з черги назад у редактор", hi: "नवीनतम कतारबद्ध संदेश वापस संपादक में लाएँ", pl: "Przywróć najnowszą wiadomość z kolejki do edytora", tr: "Kuyruktaki en yeni iletiyi oluşturucuya geri alın", ru: "Вернуть самое новое сообщение из очереди обратно в редактор", id: "Kembalikan pesan antre terbaru ke penyusun"}
    unsaved_description: {en: "You have unsaved changes. Saved changes apply after restarting VT Code Desktop.", vi: "Bạn có thay đổi chưa lưu. Thay đổi đã lưu có hiệu lực sau khi khởi động lại VT Code Desktop.", es: "Tienes cambios sin guardar. Los cambios guardados se aplican tras reiniciar VT Code Desktop.", fr: "Vous avez des modifications non enregistrées. Elles s'appliquent après le redémarrage de VT Code Desktop.", ja: "未保存の変更があります。保存した変更はVT Code Desktopの再起動後に適用されます。", de: "Du hast ungespeicherte Änderungen. Gespeicherte Änderungen gelten nach einem Neustart von VT Code Desktop.", it: "Hai modifiche non salvate. Le modifiche salvate si applicano dopo il riavvio di VT Code Desktop.", zh-CN: "你有未保存的更改。已保存的更改在重启 VT Code Desktop 后生效。", zh-TW: "你有未儲存的變更。已儲存的變更在重新啟動 VT Code Desktop 後生效。", zh-HK: "你有未儲存的變更。已儲存的變更在重新啟動 VT Code Desktop 後生效。", pt-BR: "Você tem alterações não salvas. As alterações salvas se aplicam após reiniciar o VT Code Desktop.", ko: "저장하지 않은 변경이 있습니다. 저장된 변경은 VT Code Desktop을 다시 시작한 후 적용됩니다.", nl: "Je hebt niet-opgeslagen wijzigingen. Opgeslagen wijzigingen zijn van kracht na het opnieuw opstarten van VT Code Desktop.", sv: "Du har osparade ändringar. Sparade ändringar gäller efter omstart av VT Code Desktop.", uk: "У вас є незбережені зміни. Збережені зміни набудуть чинності після перезапуску VT Code Desktop.", hi: "आपके पास असहेजे परिवर्तन हैं। सहेजे परिवर्तन VT Code Desktop पुनः शुरू करने पर लागू होंगे।", pl: "Masz niezapisane zmiany. Zapisane zmiany zaczną obowiązywać po ponownym uruchomieniu VT Code Desktop.", tr: "Kaydedilmemiş değişiklikleriniz var. Kaydedilen değişiklikler VT Code Desktop yeniden başlatıldıktan sonra geçerli olur.", ru: "У вас есть несохранённые изменения. Сохранённые изменения вступят в силу после перезапуска VT Code Desktop.", id: "Anda memiliki perubahan yang belum disimpan. Perubahan tersimpan berlaku setelah memulai ulang VT Code Desktop."}
    browse_description: {en: "Search and customize desktop bindings. Saved changes apply after restarting VT Code Desktop.", vi: "Tìm và tùy chỉnh phím tắt desktop. Thay đổi đã lưu có hiệu lực sau khi khởi động lại VT Code Desktop.", es: "Busca y personaliza combinaciones de escritorio. Los cambios guardados se aplican tras reiniciar VT Code Desktop.", fr: "Recherchez et personnalisez les raccourcis du bureau. Les modifications enregistrées s'appliquent après le redémarrage de VT Code Desktop.", ja: "デスクトップのキーバインドを検索・カスタマイズ。保存した変更はVT Code Desktopの再起動後に適用されます。", de: "Desktop-Tastenkürzel suchen und anpassen. Gespeicherte Änderungen gelten nach einem Neustart von VT Code Desktop.", it: "Cerca e personalizza le associazioni desktop. Le modifiche salvate si applicano dopo il riavvio di VT Code Desktop.", zh-CN: "搜索和自定义桌面快捷键。已保存的更改在重启 VT Code Desktop 后生效。", zh-TW: "搜尋和自訂桌面按鍵繫結。已儲存的變更在重新啟動 VT Code Desktop 後生效。", zh-HK: "搜尋和自訂桌面按鍵繫結。已儲存的變更在重新啟動 VT Code Desktop 後生效。", pt-BR: "Pesquise e personalize atalhos do desktop. As alterações salvas se aplicam após reiniciar o VT Code Desktop.", ko: "데스크톱 바인딩을 검색하고 사용자 지정하세요. 저장된 변경은 VT Code Desktop을 다시 시작한 후 적용됩니다.", nl: "Zoek en pas desktoptoetsen aan. Opgeslagen wijzigingen zijn van kracht na het opnieuw opstarten van VT Code Desktop.", sv: "Sök och anpassa skrivbordsbindningar. Sparade ändringar gäller efter omstart av VT Code Desktop.", uk: "Шукайте й налаштовуйте прив'язки робочого столу. Збережені зміни набудуть чинності після перезапуску VT Code Desktop.", hi: "डेस्कटॉप बाइंडिंग खोजें व अनुकूलित करें। सहेजे परिवर्तन VT Code Desktop पुनः शुरू करने पर लागू होंगे।", pl: "Szukaj i dostosowuj powiązania pulpitu. Zapisane zmiany zaczną obowiązywać po ponownym uruchomieniu VT Code Desktop.", tr: "Masaüstü tuş atamalarını arayın ve özelleştirin. Kaydedilen değişiklikler VT Code Desktop yeniden başlatıldıktan sonra geçerli olur.", ru: "Ищите и настраивайте привязки рабочего стола. Сохранённые изменения вступят в силу после перезапуска VT Code Desktop.", id: "Cari dan sesuaikan binding desktop. Perubahan tersimpan berlaku setelah memulai ulang VT Code Desktop."}
