      zh-TW: "預覽不完整。請查看捕獲說明瞭解被省略的檔案或限制。複製內容僅包含已捕獲的預覽。"
      zh-HK: "預覽不完整。請查看捕獲說明瞭解被省略的檔案或限制。複製內容僅包含已捕獲的預覽。"
      pt-BR: "A prévia está incompleta. Consulte a nota de captura para ver arquivos omitidos ou limites. A cópia inclui somente a prévia capturada."
      ko: "미리 보기가 완전하지 않습니다. 제외된 파일이나 제한 사항은 캡처 참고 사항을 확인하세요. 복사에는 캡처한 미리 보기만 포함됩니다."
      nl: "De voorvertoning is onvolledig. Zie de opmerking voor overgeslagen bestanden of limieten. Kopiëren neemt alleen de vastgelegde voorvertoning mee."
      ru: "Предпросмотр неполный. Сведения о пропущенных файлах и ограничениях см. в примечании к снимку. Копируется только сохранённый предпросмотр."
      id: "Pratinjau belum lengkap. Lihat catatan pengambilan untuk file yang dilewati atau batasan. Salinan hanya mencakup pratinjau yang diambil."
    preview_truncated:
      en: "Preview truncated at the review limit. Choose a narrower folder for a complete review. Copy includes only this preview."
      hi: "समीक्षा सीमा पर पूर्वावलोकन छोटा किया गया। पूरी समीक्षा के लिए छोटा फ़ोल्डर चुनें। कॉपी में केवल यही पूर्वावलोकन होगा।"
      pl: "Podgląd skrócono z powodu limitu przeglądu. Aby przejrzeć całość, wybierz węższy folder. Kopiowanie obejmuje tylko ten podgląd."
      tr: "Önizleme inceleme sınırında kısaltıldı. Eksiksiz inceleme için daha dar bir klasör seçin. Kopyalama yalnızca bu önizlemeyi içerir."
      vi: "Bản xem trước đã đạt giới hạn xem xét. Chọn thư mục hẹp hơn để xem đầy đủ. Nội dung sao chép chỉ gồm bản xem trước này."
      es: "La vista previa alcanzó el límite de revisión. Elige una carpeta más específica para una revisión completa. La copia solo incluye esta vista."
      fr: "L’aperçu a atteint la limite de revue. Choisissez un dossier plus précis pour tout examiner. La copie ne contient que cet aperçu."
      ja: "プレビューはレビュー上限で切り詰められました。すべて確認するには対象フォルダを狭めてください。コピーにはこのプレビューのみ含まれます。"
      de: "Die Vorschau wurde am Prüflimit gekürzt. Wähle für eine vollständige Prüfung einen engeren Ordner. Kopiert wird nur diese Vorschau."
      it: "L’anteprima è stata troncata al limite di revisione. Scegli una cartella più specifica per una revisione completa. La copia include solo questa anteprima."
      zh-CN: "预览已达到审查上限。请选择更小的文件夹以完整查看。复制内容仅包含此预览。"
      zh-TW: "預覽已達到審查上限。請選擇更小的資料夾以完整查看。複製內容僅包含此預覽。"
      zh-HK: "預覽已達到審查上限。請選擇更小的資料夾以完整查看。複製內容僅包含此預覽。"
      pt-BR: "A prévia atingiu o limite de revisão. Escolha uma pasta mais específica para revisar tudo. A cópia inclui somente esta prévia."
      ko: "검토 제한으로 미리 보기가 잘렸습니다. 전체 검토를 하려면 더 좁은 폴더를 선택하세요. 복사에는 이 미리 보기만 포함됩니다."
      nl: "De voorvertoning is afgekapt bij de controlelimiet. Kies een kleinere map voor een volledige controle. Kopiëren bevat alleen deze voorvertoning."
      ru: "Предпросмотр усечён из-за ограничения. Для полного просмотра выберите более узкую папку. Копируется только этот предпросмотр."
      id: "Pratinjau dipotong karena batas ukuran. Pilih folder yang lebih sempit untuk tinjauan lengkap. Salinan hanya mencakup pratinjau ini."
    structured_preview_unavailable:
      en: "Structured preview unavailable for this patch. Showing the captured text."
      hi: "इस पैच के लिए संरचित पूर्वावलोकन उपलब्ध नहीं है। कैप्चर किया गया टेक्स्ट दिखाया जा रहा है।"
      pl: "Podgląd strukturalny tej poprawki jest niedostępny. Wyświetlany jest przechwycony tekst."
      tr: "Bu yama için yapılandırılmış önizleme kullanılamıyor. Yakalanan metin gösteriliyor."
      vi: "Không thể hiển thị bản xem trước có cấu trúc cho bản vá này. Đang hiển thị văn bản đã ghi lại."
      es: "La vista previa estructurada no está disponible para este parche. Se muestra el texto capturado."
      fr: "L’aperçu structuré n’est pas disponible pour ce patch. Le texte capturé est affiché."
      ja: "このパッチの構造化プレビューを利用できません。取得したテキストを表示しています。"
      de: "Für diesen Patch ist keine strukturierte Vorschau verfügbar. Der erfasste Text wird angezeigt."
      it: "L’anteprima strutturata non è disponibile per questa patch. È mostrato il testo acquisito."
      zh-CN: "此补丁无法使用结构化预览。正在显示捕获的文本。"
      zh-TW: "此補丁無法使用結構化預覽。正在顯示捕獲的文本。"
      zh-HK: "此補丁無法使用結構化預覽。正在顯示捕獲的文本。"
      pt-BR: "A prévia estruturada não está disponível para este patch. Exibindo o texto capturado."
      ko: "이 패치에는 구조화된 미리 보기를 사용할 수 없습니다. 캡처한 텍스트를 표시합니다."
      nl: "Er is geen gestructureerde voorvertoning voor deze patch. De vastgelegde tekst wordt getoond."
      ru: "Структурированный предпросмотр этого патча недоступен. Показан сохранённый текст."
      id: "Pratinjau terstruktur tidak tersedia untuk patch ini. Menampilkan teks yang diambil."
