      zh-HK: "桌面服務傳回無效的配對資料。"
      pt-BR: "O serviço do Desktop retornou detalhes de pareamento inválidos."
      ko: "데스크톱 서비스가 잘못된 페어링 정보를 반환했습니다."
      nl: "De desktopservice heeft ongeldige koppelingsgegevens geretourneerd."
      ru: "Служба Desktop вернула недопустимые данные сопряжения."
      id: "Layanan desktop mengembalikan detail pairing yang tidak valid."
    stopped:
      en: "WebMCP disconnected. Browser sessions and pairing codes were revoked."
      hi: "WebMCP डिस्कनेक्ट हो गया। ब्राउज़र सेशन और पेयरिंग कोड रद्द कर दिए गए।"
      pl: "WebMCP rozłączono. Sesje przeglądarki i kody parowania zostały unieważnione."
      tr: "WebMCP bağlantısı kesildi. Tarayıcı oturumları ve eşleştirme kodları iptal edildi."
      vi: "Đã ngắt kết nối WebMCP. Các phiên trình duyệt và mã ghép nối đã bị thu hồi."
      es: "WebMCP se desconectó. Se revocaron las sesiones del navegador y los códigos de emparejamiento."
      fr: "WebMCP a été déconnecté. Les sessions du navigateur et les codes d’association ont été révoqués."
      ja: "WebMCPを切断しました。ブラウザーセッションとペアリングコードは取り消されました。"
      de: "WebMCP wurde getrennt. Browsersitzungen und Kopplungscodes wurden widerrufen."
      it: "WebMCP disconnesso. Le sessioni del browser e i codici di associazione sono stati revocati."
      zh-CN: "WebMCP 已断开连接。浏览器会话和配对码均已撤销。"
      zh-TW: "WebMCP 已中斷連線。瀏覽器工作階段和配對碼均已撤銷。"
      zh-HK: "WebMCP 已中斷連線。瀏覽器工作階段和配對碼均已撤銷。"
