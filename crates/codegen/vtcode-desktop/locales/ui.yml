      ko: "WebMCP 연결이 해제되었습니다. 브라우저 세션과 페어링 코드가 취소되었습니다."
      nl: "WebMCP is verbroken. Browsersessies en koppelingscodes zijn ingetrokken."
      ru: "WebMCP отключён. Сеансы браузера и коды сопряжения отозваны."
