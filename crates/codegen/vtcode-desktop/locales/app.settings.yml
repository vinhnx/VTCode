      description: {en: "Changes supported labels immediately. Untranslated app text remains in English.", sv: "Ändrar etiketter som stöds omedelbart. Oöversatt apptext förblir på engelska.", uk: "Підтримувані написи змінюються одразу. Неперекладений текст програми залишається англійською.", hi: "समर्थित लेबल तुरंत बदलते हैं। जिन ऐप टेक्स्ट का अनुवाद नहीं हुआ है, वे अंग्रेज़ी में दिखेंगे।", pl: "Od razu zmienia przetłumaczone etykiety. Nieprzetłumaczony tekst aplikacji pozostaje po angielsku.", tr: "Desteklenen etiketleri hemen değiştirir. Çevrilmemiş uygulama metinleri İngilizce kalır.", es: "Cambia las etiquetas disponibles al instante. El texto sin traducir permanece en inglés.", fr: "Modifie immédiatement les libellés disponibles. Le texte non traduit reste en anglais.", ja: "対応するラベルをすぐに変更します。未翻訳のテキストは英語で表示されます。", vi: "Thay đổi nhãn đã hỗ trợ ngay lập tức. Nội dung chưa dịch vẫn hiển thị bằng tiếng Anh.", de: "Unterstützte Beschriftungen werden sofort geändert. Nicht übersetzte Texte bleiben auf Englisch.", it: "Le etichette supportate cambiano subito. Il testo non tradotto resta in inglese.", zh-CN: "支持的标签会立即更改。尚未翻译的文本仍以英语显示。", zh-TW: "支持的標籤會立即更改。尚未翻譯的文本仍以英語顯示。", zh-HK: "支持的標籤會立即更改。尚未翻譯的文本仍以英語顯示。", pt-BR: "Altera imediatamente os rótulos disponíveis. O texto do app sem tradução permanece em inglês.", ko: "지원되는 레이블은 즉시 변경됩니다. 번역되지 않은 앱 텍스트는 영어로 표시됩니다.", nl: "Ondersteunde labels worden direct bijgewerkt. Niet-vertaalde app-tekst blijft Engels.", ru: "Поддерживаемые подписи меняются сразу. Непереведённый текст приложения остаётся на английском.", id: "Label yang didukung langsung berubah. Teks aplikasi yang belum diterjemahkan tetap dalam bahasa Inggris."}
