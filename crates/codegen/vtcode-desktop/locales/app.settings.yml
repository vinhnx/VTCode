      navigation_hint: {en: "When hidden, project, thread, and workspace actions stay in the top bar.", sv: "När projekt-, tråd- och arbetsyteåtgärder är dolda förblir de i det övre fältet.", uk: "Коли її приховано, дії з проєктами, розмовами та робочим простором залишаються на верхній панелі.", hi: "छिपाने पर प्रोजेक्ट, थ्रेड और वर्कस्पेस के विकल्प ऊपर की पट्टी में रहते हैं।", pl: "Po ukryciu działania związane z projektami, wątkami i obszarem roboczym pozostają na górnym pasku.", tr: "Gizlendiğinde proje, sohbet ve çalışma alanı işlemleri üst çubukta kalır.", vi: "Khi ẩn, thao tác dự án, cuộc hội thoại và không gian làm việc vẫn ở thanh trên cùng.", es: "Al ocultarla, las acciones de proyectos, conversaciones y espacios de trabajo permanecen en la barra superior.", fr: "Masquées, les actions de projet, de conversation et d’espace de travail restent dans la barre supérieure.", ja: "非表示にしても、プロジェクト、スレッド、ワークスペースの操作は上部バーに残ります。", de: "Bei ausgeblendeter Navigation bleiben Projekt-, Chat- und Arbeitsbereichsaktionen in der oberen Leiste.", it: "Quando è nascosta, le azioni per progetti, conversazioni e spazi di lavoro restano nella barra superiore.", zh-CN: "隐藏后，项目、对话和工作区操作仍保留在顶部栏。", zh-TW: "隱藏後，項目、對話和工作區操作仍保留在頂部欄。", zh-HK: "隱藏後，項目、對話和工作區操作仍保留在頂部欄。", pt-BR: "Quando oculta, as ações de projeto, conversa e espaço de trabalho permanecem na barra superior.", ko: "숨겨도 프로젝트, 대화, 작업 공간 작업은 상단 바에 남습니다.", nl: "Als deze verborgen is, blijven acties voor projecten, gesprekken en werkruimten in de bovenste balk staan.", ru: "Если навигация скрыта, действия для проектов, диалогов и рабочих пространств остаются на верхней панели.", id: "Saat disembunyikan, tindakan untuk proyek, percakapan, dan ruang kerja tetap tersedia di bilah atas."}
