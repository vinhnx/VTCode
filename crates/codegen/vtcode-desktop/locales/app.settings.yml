      delete_detail: {en: "This permanently deletes the chat archive. This cannot be undone.", vi: "Thao tác này sẽ xóa vĩnh viễn kho lưu trữ đoạn chat. Không thể hoàn tác.", es: "Esto elimina definitivamente el archivo del chat. No se puede deshacer.", fr: "Ceci supprime définitivement l’archive de la discussion. Cette action est irréversible.", ja: "チャットのアーカイブが完全に削除されます。この操作は取り消せません。", de: "Dadurch wird das Chat-Archiv endgültig gelöscht. Dies kann nicht rückgängig gemacht werden.", it: "Questo elimina definitivamente l’archivio della chat. L’operazione non può essere annullata.", zh-CN: "这将永久删除聊天存档。此操作无法撤销。", zh-TW: "這將永久刪除聊天存檔。此動作無法復原。", zh-HK: "這將永久刪除聊天存檔。此動作無法復原。", pt-BR: "Isso exclui permanentemente o arquivo da conversa. Não é possível desfazer.", ko: "채팅 보관함이 영구적으로 삭제됩니다. 이 작업은 취소할 수 없습니다.", nl: "Hiermee wordt het chatarchief definitief verwijderd. Dit kan niet ongedaan worden gemaakt.", sv: "Detta tar permanent bort chattarkivet. Detta kan inte ångras.", uk: "Це назавжди видалить архів чату. Цю дію не можна скасувати.", hi: "इससे चैट संग्रह स्थायी रूप से हट जाएगा। इसे पूर्ववत नहीं किया जा सकता।", pl: "Spowoduje to trwałe usunięcie archiwum czatu. Tej operacji nie można cofnąć.", tr: "Bu işlem sohbet arşivini kalıcı olarak siler. Bu işlem geri alınamaz.", ru: "Архив чата будет удалён без возможности восстановления.", id: "Tindakan ini menghapus arsip chat secara permanen. Tindakan ini tidak dapat dibatalkan."}
      remove_title: {en: "Remove \"%{name}\"?", vi: "Gỡ bỏ \"%{name}\"?", es: "¿Quitar \"%{name}\"?", fr: "Retirer « %{name} » ?", ja: "\"%{name}\"を削除しますか?", de: "\"%{name}\" entfernen?", it: "Rimuovere \"%{name}\"?", zh-CN: "移除\"%{name}\"?", zh-TW: "移除\"%{name}\"?", zh-HK: "移除\"%{name}\"?", pt-BR: "Remover \"%{name}\"?", ko: "\"%{name}\"을(를) 제거하시겠습니까?", nl: "\"%{name}\" verwijderen?", sv: "Ta bort \"%{name}\"?", uk: "Прибрати \"%{name}\"?", hi: "\"%{name}\" हटाएं?", pl: "Usunąć \"%{name}\"?", tr: "\"%{name}\" kaldırılsın mı?", ru: "Убрать \"%{name}\"?", id: "Hapus \"%{name}\"?"}
      remove_detail: {en: "This permanently deletes the working copy. This cannot be undone.", vi: "Thao tác này sẽ xóa vĩnh viễn bản sao làm việc. Không thể hoàn tác.", es: "Esto elimina definitivamente la copia de trabajo. No se puede deshacer.", fr: "Ceci supprime définitivement la copie de travail. Cette action est irréversible.", ja: "作業コピーが完全に削除されます。この操作は取り消せません。", de: "Dadurch wird die Arbeitskopie endgültig gelöscht. Dies kann nicht rückgängig gemacht werden.", it: "Questo elimina definitivamente la copia di lavoro. L’operazione non può essere annullata.", zh-CN: "这将永久删除工作副本。此操作无法撤销。", zh-TW: "這將永久刪除工作複本。此動作無法復原。", zh-HK: "這將永久刪除工作複本。此動作無法復原。", pt-BR: "Isso remove permanentemente a cópia de trabalho. Não é possível desfazer.", ko: "작업 복사본이 영구적으로 삭제됩니다. 이 작업은 취소할 수 없습니다.", nl: "Hiermee wordt de werkkopie definitief verwijderd. Dit kan niet ongedaan worden gemaakt.", sv: "Detta tar permanent bort arbetskopian. Detta kan inte ångras.", uk: "Це назавжди видалить робочу копію. Цю дію не можна скасувати.", hi: "इससे कार्यशील प्रति स्थायी रूप से हट जाएगी। इसे पूर्ववत नहीं किया जा सकता।", pl: "Spowoduje to trwałe usunięcie kopii roboczej. Tej operacji nie można cofnąć.", tr: "Bu işlem çalışma kopyasını kalıcı olarak siler. Bu işlem geri alınamaz.", ru: "Рабочая копия будет удалена без возможности восстановления.", id: "Tindakan ini menghapus salinan kerja secara permanen. Tindakan ini tidak dapat dibatalkan."}
      remove_dirty_detail: {en: "This permanently deletes the working copy, including uncommitted changes. This cannot be undone.", vi: "Thao tác này sẽ xóa vĩnh viễn bản sao làm việc, kể cả các thay đổi chưa lưu. Không thể hoàn tác.", es: "Esto elimina definitivamente la copia de trabajo, incluidos los cambios sin guardar. No se puede deshacer.", fr: "Ceci supprime définitivement la copie de travail, y compris les modifications non enregistrées. Cette action est irréversible.", ja: "未保存の変更を含め、作業コピーが完全に削除されます。この操作は取り消せません。", de: "Dadurch wird die Arbeitskopie einschließlich ungespeicherter Änderungen endgültig gelöscht. Dies kann nicht rückgängig gemacht werden.", it: "Questo elimina definitivamente la copia di lavoro, comprese le modifiche non salvate. L’operazione non può essere annullata.", zh-CN: "这将永久删除工作副本，包括未保存的更改。此操作无法撤销。", zh-TW: "這將永久刪除工作複本，包括未儲存的變更。此動作無法復原。", zh-HK: "這將永久刪除工作複本，包括未儲存的變更。此動作無法復原。", pt-BR: "Isso remove permanentemente a cópia de trabalho, incluindo alterações não salvas. Não é possível desfazer.", ko: "저장되지 않은 변경 사항을 포함하여 작업 복사본이 영구적으로 삭제됩니다. 이 작업은 취소할 수 없습니다.", nl: "Hiermee wordt de werkkopie definitief verwijderd, inclusief niet-opgeslagen wijzigingen. Dit kan niet ongedaan worden gemaakt.", sv: "Detta tar permanent bort arbetskopian, inklusive osparade ändringar. Detta kan inte ångras.", uk: "Це назавжди видалить робочу копію, включно з незбереженими змінами. Цю дію не можна скасувати.", hi: "इससे असहेजे हुए परिवर्तनों सहित कार्यशील प्रति स्थायी रूप से हट जाएगी। इसे पूर्ववत नहीं किया जा सकता।", pl: "Spowoduje to trwałe usunięcie kopii roboczej, w tym niezapisanych zmian. Tej operacji nie można cofnąć.", tr: "Bu işlem, kaydedilmemiş değişiklikler dahil çalışma kopyasını kalıcı olarak siler. Bu işlem geri alınamaz.", ru: "Рабочая копия будет удалена вместе с несохранёнными изменениями без возможности восстановления.", id: "Tindakan ini menghapus salinan kerja secara permanen, termasuk perubahan yang belum disimpan. Tindakan ini tidak dapat dibatalkan."}
