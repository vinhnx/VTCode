      theme_unavailable: {en: "The CLI theme is not available in VT Code Desktop. Choose a desktop theme in Settings.", vi: "Giao diện CLI không khả dụng trong VT Code Desktop. Hãy chọn giao diện máy trong Cài đặt.", es: "El tema de CLI no está disponible en VT Code Desktop. Elige un tema de escritorio en Ajustes.", fr: "Le thème CLI n'est pas disponible dans VT Code Desktop. Choisissez un thème de bureau dans Réglages.", ja: "CLIテーマはVT Code Desktopで利用できません。設定でデスクトップテーマを選択してください。", de: "Das CLI-Theme ist in VT Code Desktop nicht verfügbar. Wähle in den Einstellungen ein Desktop-Theme.", it: "Il tema CLI non è disponibile in VT Code Desktop. Scegli un tema desktop nelle Impostazioni.", zh-CN: "CLI 主题在 VT Code Desktop 中不可用。请在设置中选择桌面主题。", zh-TW: "CLI 佈景主題在 VT Code Desktop 中無法使用。請在設定中選擇桌面佈景主題。", zh-HK: "CLI 佈景主題在 VT Code Desktop 中無法使用。請在設定中選擇桌面佈景主題。", pt-BR: "O tema do CLI não está disponível no VT Code Desktop. Escolha um tema de desktop em Ajustes.", ko: "CLI 테마를 VT Code Desktop에서 사용할 수 없습니다. 설정에서 데스크톱 테마를 선택하세요.", nl: "Het CLI-thema is niet beschikbaar in VT Code Desktop. Kies een desktopthema in Instellingen.", sv: "CLI-temat är inte tillgängligt i VT Code Desktop. Välj ett skrivbordstema i Inställningar.", uk: "Тема CLI недоступна у VT Code Desktop. Виберіть тему робочого столу в Налаштуваннях.", hi: "CLI थीम VT Code Desktop में उपलब्ध नहीं है। सेटिंग में कोई डेस्कटॉप थीम चुनें।", pl: "Motyw CLI jest niedostępny w VT Code Desktop. Wybierz motyw pulpitu w Ustawieniach.", tr: "CLI teması VT Code Desktop'ta kullanılamıyor. Ayarlar'dan bir masaüstü teması seçin.", ru: "Тема CLI недоступна в VT Code Desktop. Выберите тему рабочего стола в Настройках.", id: "Tema CLI tidak tersedia di VT Code Desktop. Pilih tema desktop di Pengaturan."}
      saving_theme: {en: "Saving the selected theme to CLI configuration…", vi: "Đang lưu chủ đề đã chọn vào cấu hình CLI…", es: "Guardando el tema seleccionado en la configuración de CLI…", fr: "Enregistrement du thème sélectionné dans la configuration CLI…", ja: "選択中のテーマを CLI 設定に保存しています…", de: "Ausgewähltes Theme wird in der CLI-Konfiguration gespeichert…", it: "Salvataggio del tema selezionato nella configurazione CLI…", zh-CN: "正在将所选主题保存到 CLI 配置…", zh-TW: "正在將所選主題儲存到 CLI 設定…", zh-HK: "正在將所選主題儲存到 CLI 設定…", pt-BR: "Salvando o tema selecionado na configuração de CLI…", ko: "선택한 테마를 CLI 구성에 저장하는 중…", nl: "Geselecteerd thema wordt opgeslagen in CLI-configuratie…", sv: "Sparar valt tema till CLI-konfigurationen…", uk: "Збереження вибраної теми в конфігурацію CLI…", hi: "चयनित थीम CLI कॉन्फ़िगरेशन में सहेजी जा रही है…", pl: "Zapisywanie wybranego motywu w konfiguracji CLI…", tr: "Seçili tema CLI yapılandırmasına kaydediliyor…", ru: "Сохранение выбранной темы в конфигурацию CLI…", id: "Menyimpan tema yang dipilih ke konfigurasi CLI…"}
      reload_blocked: {en: "Finish the active operation or restore the unsent message before reloading CLI settings.", vi: "Hoàn tất thao tác đang chạy hoặc khôi phục tin nhắn chưa gửi trước khi tải lại cài đặt CLI.", es: "Termina la operación activa o restaura el mensaje no enviado antes de recargar los ajustes de CLI.", fr: "Terminez l'opération active ou restaurez le message non envoyé avant de recharger les réglages CLI.", ja: "CLI 設定を再読み込みする前に、実行中の操作を終了するか、未送信のメッセージを復元してください。", de: "Schließen Sie den aktiven Vorgang ab oder stellen Sie die ungesendete Nachricht wieder her, bevor Sie die CLI-Einstellungen neu laden.", it: "Termina l'operazione attiva o ripristina il messaggio non inviato prima di ricaricare le impostazioni CLI.", zh-CN: "在重新加载 CLI 设置之前，请完成正在进行的操作或恢复未发送的消息。", zh-TW: "在重新載入 CLI 設定之前，請完成進行中的操作或還原未傳送的訊息。", zh-HK: "在重新載入 CLI 設定之前，請完成進行中的操作或還原未傳送的訊息。", pt-BR: "Conclua a operação ativa ou restaure a mensagem não enviada antes de recarregar as configurações de CLI.", ko: "CLI 설정을 다시 로드하기 전에 진행 중인 작업을 완료하거나 전송되지 않은 메시지를 복원하세요.", nl: "Voltooi de actieve bewerking of herstel het niet-verzonden bericht voordat je CLI-instellingen opnieuw laadt.", sv: "Slutför den aktiva åtgärden eller återställ det oskickade meddelandet innan du läser in CLI-inställningarna igen.", uk: "Завершіть активну операцію або відновіть ненадіслане повідомлення, перш ніж перезавантажувати налаштування CLI.", hi: "CLI सेटिंग पुनः लोड करने से पहले सक्रिय कार्रवाई पूरी करें या बिना भेजा संदेश पुनर्स्थापित करें।", pl: "Zakończ aktywną operację lub przywróć niewysłaną wiadomość przed ponownym załadowaniem ustawień CLI.", tr: "CLI ayarlarını yeniden yüklemeden önce etkin işlemi bitirin veya gönderilmemiş mesajı geri yükleyin.", ru: "Завершите активную операцию или восстановите неотправленное сообщение, прежде чем перезагружать настройки CLI.", id: "Selesaikan operasi yang aktif atau pulihkan pesan yang belum terkirim sebelum memuat ulang pengaturan CLI."}
      footer: {en: "Sync saves the selected built-in theme through the CLI config writer; new CLI sessions use it. System Light/Dark sync as their per-mode default built-in theme. Reload reads all CLI configuration layers through a fresh local service. Reload starts a new conversation, keeps the editable draft and attached files, and leaves previous sessions in history.", vi: "Đồng bộ lưu chủ đề tích hợp đã chọn qua trình ghi cấu hình CLI; các phiên CLI mới sẽ dùng nó. Sáng/Tối hệ thống đồng bộ dưới dạng chủ đề tích hợp mặc định theo từng chế độ. Tải lại đọc mọi lớp cấu hình CLI qua một dịch vụ cục bộ mới. Tải lại bắt đầu một cuộc hội thoại mới, giữ bản nháp có thể chỉnh sửa và tệp đính kèm, và để lại các phiên trước trong lịch sử.", es: "La sincronización guarda el tema integrado seleccionado con el escritor de configuración de CLI; las nuevas sesiones de CLI lo usan. Claro/Oscuro del sistema se sincronizan como tema integrado predeterminado de cada modo. Recargar lee todas las capas de configuración de CLI con un servicio local nuevo. Recargar inicia una nueva conversación, conserva el borrador editable y los archivos adjuntos, y deja las sesiones anteriores en el historial.", fr: "La synchronisation enregistre le thème intégré sélectionné via l'enregistreur de configuration CLI ; les nouvelles sessions CLI l'utilisent. Clair/Sombre du système se synchronisent comme thème intégré par défaut de chaque mode. Recharger lit toutes les couches de configuration CLI via un nouveau service local. Recharger démarre une nouvelle conversation, conserve le brouillon modifiable et les fichiers joints, et laisse les sessions précédentes dans l'historique.", ja: "同期では選択中のビルトインテーマが CLI 設定ライター経由で保存され、新しい CLI セッションがそれを使用します。システムのライト/ダークは各モードの既定ビルトインテーマとして同期されます。再読み込みでは新しいローカルサービス経由ですべての CLI 設定レイヤーを読み取ります。再読み込みにより新しい会話が開始され、編集可能なドラフトと添付ファイルは保持され、以前のセッションは履歴に残ります。", de: "Sync speichert das ausgewählte integrierte Theme über den CLI-Konfigurationswriter; neue CLI-Sitzungen verwenden es. System Hell/Dunkel werden als integriertes Standard-Theme je Modus synchronisiert. Neu laden liest alle CLI-Konfigurationsebenen über einen frischen lokalen Dienst. Neu laden startet eine neue Unterhaltung, behält den bearbeitbaren Entwurf und angehängte Dateien und belässt frühere Sitzungen im Verlauf.", it: "La sincronizzazione salva il tema integrato selezionato tramite lo scrittore di configurazione CLI; le nuove sessioni CLI lo usano. Chiaro/Scuro di sistema si sincronizzano come tema integrato predefinito di ciascuna modalità. Ricarica legge tutti i livelli di configurazione CLI tramite un nuovo servizio locale. Ricarica avvia una nuova conversazione, conserva la bozza modificabile e i file allegati e lascia le sessioni precedenti nella cronologia.", zh-CN: "同步会通过 CLI 配置写入器保存所选内置主题；新的 CLI 会话将使用它。“系统浅色/深色”按各模式的默认内置主题同步。重新加载会通过全新的本地服务读取所有 CLI 配置层。重新加载将开始新的对话，保留可编辑草稿和附件，并将以前的会话留在历史记录中。", zh-TW: "同步會透過 CLI 設定寫入器儲存所選內建主題；新的 CLI 工作階段將使用它。「系統淺色/深色」會按各模式的預設內建主題同步。重新載入會透過全新的本機服務讀取所有 CLI 設定層。重新載入將開始新的對話，保留可編輯草稿和附件，並將以前的工作階段留在歷程記錄中。", zh-HK: "同步會透過 CLI 設定寫入器儲存所選內建主題；新的 CLI 工作階段將使用它。「系統淺色/深色」會按各模式的預設內建主題同步。重新載入會透過全新的本機服務讀取所有 CLI 設定層。重新載入將開始新的對話，保留可編輯草稿和附件，並將以前的工作階段留在歷程記錄中。", pt-BR: "A sincronização salva o tema integrado selecionado pelo gravador de configuração de CLI; novas sessões de CLI o usam. Claro/Escuro do sistema sincronizam como tema integrado padrão de cada modo. Recarregar lê todas as camadas de configuração de CLI por um novo serviço local. Recarregar inicia uma nova conversa, mantém o rascunho editável e os anexos e deixa as sessões anteriores no histórico.", ko: "동기화하면 선택한 내장 테마가 CLI 구성 기록기를 통해 저장되며, 새 CLI 세션에서 사용합니다. 시스템 라이트/다크는 각 모드의 기본 내장 테마로 동기화됩니다. 다시 로드하면 새로운 로컬 서비스를 통해 모든 CLI 구성 레이어를 읽습니다. 다시 로드하면 새 대화를 시작하고, 편집 가능한 임시 보관 메시지와 첨부 파일은 유지되며, 이전 세션은 기록에 남습니다.", nl: "Synchroniseren slaat het geselecteerde ingebouwde thema op via de CLI-configuratieschrijver; nieuwe CLI-sessies gebruiken het. Lichte/donkere systeemmodus synchroniseren als het standaard ingebouwde thema per modus. Opnieuw laden leest alle CLI-configuratielagen via een nieuwe lokale service. Opnieuw laden start een nieuw gesprek, behoudt het bewerkbare concept en bijlagen, en laat eerdere sessies in de geschiedenis.", sv: "Synkronisering sparar det valda inbyggda temat via CLI-konfigurationsskrivaren; nya CLI-sessioner använder det. Systemets ljust/mörkt synkroniseras som standardinbyggt tema per läge. Läs in igen läser alla CLI-konfigurationslager via en ny lokal tjänst. Läs in igen startar en ny konversation, behåller det redigerbara utkastet och bifogade filer och lämnar tidigare sessioner i historiken.", uk: "Синхронізація зберігає вибрану вбудовану тему через засіб запису конфігурації CLI; нові сеанси CLI використовують її. Системні світла/темна синхронізуються як типова вбудована тема кожного режиму. Перезавантаження зчитує всі шари конфігурації CLI через нову локальну службу. Перезавантаження починає нову розмову, зберігає редагований чернетку й вкладення та залишає попередні сеанси в історії.", hi: "सिंक चयनित अंतर्निहित थीम को CLI कॉन्फ़िगरेशन राइटर के माध्यम से सहेजता है; नए CLI सत्र इसका उपयोग करते हैं। सिस्टम लाइट/डार्क प्रत्येक मोड की डिफ़ॉल्ट अंतर्निहित थीम के रूप में सिंक होते हैं। पुनः लोड नई स्थानीय सेवा के माध्यम से सभी CLI कॉन्फ़िगरेशन परतें पढ़ता है। पुनः लोड नई बातचीत शुरू करता है, संपादन योग्य मसौदा और अटैचमेंट रखता है, और पिछले सत्र इतिहास में छोड़ता है।", pl: "Synchronizacja zapisuje wybrany wbudowany motyw za pomocą programu zapisującego konfiguracji CLI; nowe sesje CLI go używają. Jasny/Ciemny systemu synchronizują się jako domyślny wbudowany motyw każdego trybu. Ponowne ładowanie odczytuje wszystkie warstwy konfiguracji CLI przez nową usługę lokalną. Ponowne ładowanie rozpoczyna nową rozmowę, zachowuje edytowalną wersję roboczą i załączniki oraz pozostawia poprzednie sesje w historii.", tr: "Senkronizasyon, seçili yerleşik temayı CLI yapılandırma yazıcısı aracılığıyla kaydeder; yeni CLI oturumları onu kullanır. Sistem Açık/Koyu, her modun varsayılan yerleşik teması olarak eşitlenir. Yeniden yükleme, yeni bir yerel hizmet üzerinden tüm CLI yapılandırma katmanlarını okur. Yeniden yükleme yeni bir konuşma başlatır, düzenlenebilir taslağı ve ekleri korur ve önceki oturumları geçmişte bırakır.", ru: "Синхронизация сохраняет выбранную встроенную тему через средство записи конфигурации CLI; новые сеансы CLI используют её. Системные светлая/тёмная синхронизируются как встроенная тема по умолчанию для каждого режима. Перезагрузка считывает все слои конфигурации CLI через новую локальную службу. Перезагрузка начинает новый разговор, сохраняет редактируемый черновик и вложения и оставляет предыдущие сеансы в истории.", id: "Sinkronisasi menyimpan tema bawaan yang dipilih melalui penulis konfigurasi CLI; sesi CLI baru menggunakannya. Terang/Gelap sistem disinkronkan sebagai tema bawaan default tiap mode. Muat ulang membaca semua lapisan konfigurasi CLI melalui layanan lokal yang baru. Muat ulang memulai percakapan baru, mempertahankan draf yang dapat diedit dan lampiran, serta membiarkan sesi sebelumnya dalam riwayat."}
