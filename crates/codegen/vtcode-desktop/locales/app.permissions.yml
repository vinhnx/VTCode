_version: 2
app:
  permissions:
    desc_ask: {en: "Confirm protected commands using the CLI's approval flow.", vi: "Xác nhận lệnh được bảo vệ bằng quy trình phê duyệt của CLI.", es: "Confirma comandos protegidos con el flujo de aprobación de CLI.", fr: "Confirmez les commandes protégées via le flux d'approbation du CLI.", ja: "CLIの承認フローで保護されたコマンドを確認します。", de: "Geschützte Befehle über den Genehmigungsfluss der CLI bestätigen.", it: "Conferma i comandi protetti con il flusso di approvazione della CLI.", zh-CN: "使用 CLI 的审批流程确认受保护的命令。", zh-TW: "使用 CLI 的核准流程確認受保護的命令。", zh-HK: "使用 CLI 的核准流程確認受保護的命令。", pt-BR: "Confirme comandos protegidos usando o fluxo de aprovação do CLI.", ko: "CLI 승인 흐름을 사용하여 보호된 명령을 확인하세요.", nl: "Bevestig beveiligde opdrachten via de goedkeuringsflow van de CLI.", sv: "Bekräfta skyddade kommandon med CLI:ns godkännandeflöde.", uk: "Підтверджуйте захищені команди через потік схвалення CLI.", hi: "CLI की स्वीकृति प्रवाह से सुरक्षित कमांड की पुष्टि करें।", pl: "Potwierdzaj chronione polecenia w procesie zatwierdzania CLI.", tr: "Korumalı komutları CLI onay akışıyla onaylayın.", ru: "Подтверждайте защищённые команды через процедуру одобрения CLI.", id: "Konfirmasi perintah yang dilindungi memakai alur persetujuan CLI."}
    desc_auto: {en: "Skip command confirmations. Sandbox and tool authorization still apply.", vi: "Bỏ qua xác nhận lệnh. Hộp cát và ủy quyền công cụ vẫn áp dụng.", es: "Omite confirmaciones de comandos. La sandbox y la autorización de herramientas siguen vigentes.", fr: "Ignorer les confirmations de commande. Le bac à sable et l'autorisation d'outil s'appliquent toujours.", ja: "コマンドの確認をスキップします。サンドボックスとツールの承認は引き続き適用されます。", de: "Befehlsbestätigungen überspringen. Sandbox und Toolautorisierung gelten weiterhin.", it: "Salta le conferme dei comandi. Sandbox e autorizzazione strumenti restano validi.", zh-CN: "跳过命令确认。沙盒和工具授权仍然有效。", zh-TW: "略過命令確認。沙箱和工具授權仍然有效。", zh-HK: "略過命令確認。沙箱和工具授權仍然有效。", pt-BR: "Pule confirmações de comando. Sandbox e autorização de ferramenta continuam valendo.", ko: "명령 확인을 건너뜁니다. 샌드박스와 도구 승인은 계속 적용됩니다.", nl: "Sla opdrachtbevestigingen over. Sandbox en toolautorisatie blijven gelden.", sv: "Hoppa över kommandobekräftelser. Sandlåda och verktygsbehörighet gäller fortfarande.", uk: "Пропускати підтвердження команд. Пісочниця й авторизація інструментів досі діють.", hi: "कमांड पुष्टियाँ छोड़ें। सैंडबॉक्स व टूल प्राधिकरण फिर भी लागू।", pl: "Pomijaj potwierdzenia poleceń. Piaskownica i autoryzacja narzędzi nadal obowiązują.", tr: "Komut onaylarını atlayın. Korumalı alan ve araç yetkilendirme yine geçerli.", ru: "Пропускать подтверждения команд. Песочница и авторизация инструментов действуют.", id: "Lewati konfirmasi perintah. Sandbox dan otorisasi alat tetap berlaku."}
    desc_full: {en: "Run without the process sandbox or approval prompts. Explicit denies still apply.", vi: "Chạy không có hộp cát tiến trình hay lời nhắc phê duyệt. Từ chối tường minh vẫn áp dụng.", es: "Ejecuta sin sandbox de procesos ni avisos de aprobación. Las denegaciones explícitas siguen vigentes.", fr: "Exécuter sans bac à sable de processus ni invites d'approbation. Les refus explicites s'appliquent toujours.", ja: "プロセスサンドボックスや承認プロンプトなしで実行します。明示的な拒否は引き続き適用されます。", de: "Ohne Prozess-Sandbox oder Genehmigungsaufforderungen ausführen. Explizite Ablehnungen gelten weiterhin.", it: "Esegui senza sandbox di processo o richieste di approvazione. I dinieghi espliciti restano validi.", zh-CN: "在无进程沙盒或审批提示时运行。明确拒绝仍然有效。", zh-TW: "在無處理程序沙箱或核准提示時執行。明確拒絕仍然有效。", zh-HK: "在無處理程序沙箱或核准提示時執行。明確拒絕仍然有效。", pt-BR: "Execute sem a sandbox de processo ou avisos de aprovação. Negações explícitas continuam valendo.", ko: "프로세스 샌드박스나 승인 프롬프트 없이 실행합니다. 명시적 거부는 계속 적용됩니다.", nl: "Uitvoeren zonder processandbox of goedkeuringsprompts. Expliciete weigeringen blijven gelden.", sv: "Kör utan processandlåda eller godkännandemeddelanden. Uttryckliga nekanden gäller fortfarande.", uk: "Запуск без пісочниці процесів і запитів схвалення. Явні заборони досі діють.", hi: "प्रक्रिया सैंडबॉक्स या स्वीकृति संकेतों के बिना चलाएँ। स्पष्ट अस्वीकृतियाँ फिर भी लागू।", pl: "Uruchamiaj bez piaskownicy procesów i monitów o zgodę. Jawne odmowy nadal obowiązują.", tr: "İşlem korumalı alanı veya onay istemleri olmadan çalıştırın. Açık retler yine geçerli.", ru: "Запуск без песочницы процессов и запросов одобрения. Явные запреты действуют.", id: "Jalankan tanpa sandbox proses atau prompt persetujuan. Penolakan eksplisit tetap berlaku."}
    group_next_session: {en: "For the next session", vi: "Cho phiên tiếp theo", es: "Para la próxima sesión", fr: "Pour la prochaine session", ja: "次のセッション用", de: "Für die nächste Sitzung", it: "Per la prossima sessione", zh-CN: "用于下一个会话", zh-TW: "用於下一個工作階段", zh-HK: "用於下一個工作階段", pt-BR: "Para a próxima sessão", ko: "다음 세션용", nl: "Voor de volgende sessie", sv: "För nästa session", uk: "Для наступного сеансу", hi: "अगले सत्र हेतु", pl: "Dla następnej sesji", tr: "Sonraki oturum için", ru: "Для следующего сеанса", id: "Untuk sesi berikutnya"}
    group_default_agent: {en: "Default agent for this workspace", vi: "Tác tử mặc định cho không gian làm việc này", es: "Agente predeterminado para este espacio de trabajo", fr: "Agent par défaut pour cet espace de travail", ja: "このワークスペースのデフォルトエージェント", de: "Standardagent für diesen Arbeitsbereich", it: "Agente predefinito per questo spazio di lavoro", zh-CN: "此工作区的默认智能体", zh-TW: "此工作區的預設智慧體", zh-HK: "此工作區的預設智慧體", pt-BR: "Agente padrão para este espaço de trabalho", ko: "이 작업 공간의 기본 에이전트", nl: "Standaardagent voor deze werkruimte", sv: "Standardagent för den här arbetsytan", uk: "Типовий агент для цієї робочої області", hi: "इस कार्यक्षेत्र हेतु डिफ़ॉल्ट एजेंट", pl: "Domyślny agent dla tego obszaru roboczego", tr: "Bu çalışma alanı için varsayılan ajan", ru: "Агент по умолчанию для этой рабочей области", id: "Agen default untuk ruang kerja ini"}
    updating_runtime: {en: "Updating runtime options…", vi: "Đang cập nhật tùy chọn runtime…", es: "Actualizando opciones de runtime…", fr: "Mise à jour des options de runtime…", ja: "ランタイムオプションを更新しています…", de: "Laufzeitoptionen werden aktualisiert…", it: "Aggiornamento delle opzioni di runtime…", zh-CN: "正在更新运行时选项…", zh-TW: "正在更新執行階段選項…", zh-HK: "正在更新執行階段選項…", pt-BR: "Atualizando opções de runtime…", ko: "런타임 옵션 업데이트 중…", nl: "Runtimeopties bijwerken…", sv: "Uppdaterar körtidsalternativ…", uk: "Оновлення параметрів середовища…", hi: "रनटाइम विकल्प अपडेट हो रहे हैं…", pl: "Aktualizowanie opcji wykonawczych…", tr: "Çalışma zamanı seçenekleri güncelleniyor…", ru: "Обновление параметров среды…", id: "Memperbarui opsi runtime…"}
    confirm_full_title: {en: "Enable Full access for this session?", vi: "Bật Toàn quyền cho phiên này?", es: "¿Habilitar Acceso total para esta sesión?", fr: "Activer l'accès complet pour cette session ?", ja: "このセッションでフルアクセスを有効にしますか？", de: "Vollzugriff für diese Sitzung aktivieren?", it: "Abilitare l'accesso completo per questa sessione?", zh-CN: "为此会话启用完全访问？", zh-TW: "為此工作階段啟用完整存取？", zh-HK: "為此工作階段啟用完整存取？", pt-BR: "Ativar Acesso total para esta sessão?", ko: "이 세션에 전체 액세스를 활성화할까요?", nl: "Volledige toegang inschakelen voor deze sessie?", sv: "Aktivera full åtkomst för den här sessionen?", uk: "Увімкнути повний доступ для цього сеансу?", hi: "इस सत्र हेतु पूर्ण पहुँच सक्षम करें?", pl: "Włączyć pełny dostęp dla tej sesji?", tr: "Bu oturum için Tam erişimi etkinleştirilsin mi?", ru: "Включить полный доступ для этого сеанса?", id: "Aktifkan akses Penuh untuk sesi ini?"}
    confirm_full_body: {en: "Shell commands can access files and the network without routine approval. Explicit denials and hard safety restrictions still apply.", vi: "Lệnh shell có thể truy cập tệp và mạng mà không cần phê duyệt thường lệ. Từ chối tường minh và hạn chế an toàn nghiêm ngặt vẫn áp dụng.", es: "Los comandos de shell pueden acceder a archivos y a la red sin aprobación rutinaria. Las denegaciones explícitas y las restricciones duras de seguridad siguen vigentes.", fr: "Les commandes shell peuvent accéder aux fichiers et au réseau sans approbation systématique. Les refus explicites et les restrictions de sécurité strictes s'appliquent toujours.", ja: "シェルコマンドは通常の承認なしにファイルやネットワークにアクセスできます。明示的な拒否と厳格な安全制限は引き続き適用されます。", de: "Shellbefehle können ohne routinemäßige Genehmigung auf Dateien und das Netzwerk zugreifen. Explizite Ablehnungen und harte Sicherheitseinschränkungen gelten weiterhin.", it: "I comandi shell possono accedere a file e rete senza approvazione di routine. I dinieghi espliciti e le rigide restrizioni di sicurezza restano validi.", zh-CN: "Shell 命令可以访问文件和网络，无需例行批准。明确拒绝和硬性安全限制仍然有效。", zh-TW: "Shell 命令可以存取檔案和網路，無需例行核准。明確拒絕和硬性安全限制仍然有效。", zh-HK: "Shell 命令可以存取檔案和網路，無需例行核准。明確拒絕和硬性安全限制仍然有效。", pt-BR: "Comandos shell podem acessar arquivos e a rede sem aprovação de rotina. Negações explícitas e restrições rígidas de segurança continuam valendo.", ko: "셸 명령이 일상적인 승인 없이 파일과 네트워크에 액세스할 수 있습니다. 명시적 거부와 엄격한 안전 제한은 계속 적용됩니다.", nl: "Shellopdrachten hebben toegang tot bestanden en het netwerk zonder routinematige goedkeuring. Expliciete weigeringen en harde veiligheidsbeperkingen blijven gelden.", sv: "Skalkommandon kan komma åt filer och nätverket utan rutinmässig godkännande. Uttryckliga nekanden och hårda säkerhetsbegränsningar gäller fortfarande.", uk: "Команди оболонки можуть звертатися до файлів і мережі без рутинного схвалення. Явні заборони й жорсткі обмеження безпеки досі діють.", hi: "शेल कमांड नियमित स्वीकृति के बिना फ़ाइलों व नेटवर्क तक पहुँच सकते हैं। स्पष्ट अस्वीकृतियाँ व कठोर सुरक्षा प्रतिबंध फिर भी लागू।", pl: "Polecenia powłoki mogą uzyskiwać dostęp do plików i sieci bez rutynowej zgody. Jawne odmowy i twarde ograniczenia bezpieczeństwa nadal obowiązują.", tr: "Kabuk komutları rutin onay olmadan dosyalara ve ağa erişebilir. Açık retler ve katı güvenlik kısıtlamaları yine geçerli.", ru: "Команды оболочки могут обращаться к файлам и сети без рутинного одобрения. Явные запреты и жёсткие ограничения безопасности действуют.", id: "Perintah shell dapat mengakses file dan jaringan tanpa persetujuan rutin. Penolakan eksplisit dan batasan keamanan ketat tetap berlaku."}
    enable_full: {en: "Enable Full access", vi: "Bật Toàn quyền", es: "Habilitar Acceso total", fr: "Activer l'accès complet", ja: "フルアクセスを有効化", de: "Vollzugriff aktivieren", it: "Abilita accesso completo", zh-CN: "启用完全访问", zh-TW: "啟用完整存取", zh-HK: "啟用完整存取", pt-BR: "Ativar Acesso total", ko: "전체 액세스 활성화", nl: "Volledige toegang inschakelen", sv: "Aktivera full åtkomst", uk: "Увімкнути повний доступ", hi: "पूर्ण पहुँच सक्षम करें", pl: "Włącz pełny dostęp", tr: "Tam erişimi etkinleştir", ru: "Включить полный доступ", id: "Aktifkan akses Penuh"}
    save_failed: {en: "Permission choice is active for this session, but could not be saved: %{error}", vi: "Lựa chọn quyền đang có hiệu lực cho phiên này nhưng không thể lưu: %{error}", es: "La elección de permiso está activa para esta sesión, pero no se pudo guardar: %{error}", fr: "Le choix d'autorisation est actif pour cette session, mais n'a pas pu être enregistré : %{error}", ja: "このセッションでは権限の選択が有効ですが、保存できませんでした: %{error}", de: "Die Berechtigungsauswahl ist für diese Sitzung aktiv, konnte aber nicht gespeichert werden: %{error}", it: "La scelta di autorizzazione è attiva per questa sessione, ma non è stato possibile salvarla: %{error}", zh-CN: "此会话的权限选择已生效，但无法保存：%{error}", zh-TW: "此工作階段的權限選擇已生效，但無法儲存：%{error}", zh-HK: "此工作階段的權限選擇已生效，但無法儲存：%{error}", pt-BR: "A escolha de permissão está ativa para esta sessão, mas não pôde ser salva: %{error}", ko: "이 세션에 대한 권한 선택이 활성화되어 있지만 저장할 수 없습니다: %{error}", nl: "De toestemmingskeuze is actief voor deze sessie, maar kon niet worden opgeslagen: %{error}", sv: "Behörighetsvalet är aktivt för den här sessionen, men kunde inte sparas: %{error}", uk: "Вибір дозволу діє для цього сеансу, але його не вдалося зберегти: %{error}", hi: "इस सत्र के लिए अनुमति विकल्प सक्रिय है, लेकिन सहेजा नहीं जा सका: %{error}", pl: "Wybór uprawnień obowiązuje w tej sesji, ale nie można go zapisać: %{error}", tr: "İzin seçimi bu oturum için etkin, ancak kaydedilemedi: %{error}", ru: "Выбор разрешения действует для этого сеанса, но его не удалось сохранить: %{error}", id: "Pilihan izin aktif untuk sesi ini, tetapi tidak dapat disimpan: %{error}"}
