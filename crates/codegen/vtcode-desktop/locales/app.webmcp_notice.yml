_version: 2
app:
  webmcp_notice:
    commands_help: {en: "Commands: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", sv: "Kommandon: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", uk: "Команди: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", hi: "कमांड: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop।", pl: "Polecenia: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", tr: "Komutlar: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", vi: "Lệnh: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", es: "Comandos: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", fr: "Commandes : /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", ja: "コマンド: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", de: "Befehle: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", it: "Comandi: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", zh-CN: "命令：/webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop。", zh-TW: "指令：/webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop。", zh-HK: "指令：/webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop。", pt-BR: "Comandos: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", ko: "명령: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", nl: "Opdrachten: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", ru: "Команды: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop.", id: "Perintah: /webmcp status | help | tools | roots | connect <origin> | pair <origin> | unpair | stop."}
    disconnected: {en: "The local VT Code service disconnected. Reconnect to refresh WebMCP status.", sv: "Den lokala VT Code-tjänsten kopplades bort. Återanslut för att uppdatera WebMCP-status.", uk: "Локальну службу VT Code від’єднано. Під’єднайтеся знову, щоб оновити стан WebMCP.", hi: "स्थानीय VT Code सेवा डिस्कनेक्ट हो गई। WebMCP स्थिति रीफ़्रेश करने के लिए फिर कनेक्ट करें।", pl: "Lokalna usługa VT Code została rozłączona. Połącz ponownie, aby odświeżyć stan WebMCP.", tr: "Yerel VT Code hizmeti bağlantısı kesildi. WebMCP durumunu yenilemek için yeniden bağlanın.", vi: "Dịch vụ VT Code cục bộ đã ngắt kết nối. Kết nối lại để làm mới trạng thái WebMCP.", es: "El servicio local de VT Code se desconectó. Vuelve a conectarte para actualizar el estado de WebMCP.", fr: "Le service local VT Code s’est déconnecté. Reconnectez-vous pour actualiser l’état de WebMCP.", ja: "ローカルVT Codeサービスが切断されました。再接続してWebMCPの状態を更新してください。", de: "Die lokale VT Code-Verbindung wurde getrennt. Stelle die Verbindung wieder her, um den WebMCP-Status zu aktualisieren.", it: "Il servizio locale di VT Code si è disconnesso. Riconnettiti per aggiornare lo stato di WebMCP.", zh-CN: "本地 VT Code 服务已断开连接。重新连接以刷新 WebMCP 状态。", zh-TW: "本機 VT Code 服務已中斷連線。重新連線以重新整理 WebMCP 狀態。", zh-HK: "本地 VT Code 服務已中斷連線。重新連線以重新整理 WebMCP 狀態。", pt-BR: "O serviço local do VT Code foi desconectado. Reconecte-se para atualizar o status do WebMCP.", ko: "로컬 VT Code 서비스 연결이 끊겼습니다. WebMCP 상태를 새로 고치려면 다시 연결하세요.", nl: "De lokale VT Code-service is verbroken. Maak opnieuw verbinding om de WebMCP-status te vernieuwen.", ru: "Соединение с локальной службой VT Code потеряно. Подключитесь снова, чтобы обновить статус WebMCP.", id: "Layanan VT Code lokal terputus. Hubungkan kembali untuk menyegarkan status WebMCP."}
    invalid_status: {en: "The desktop service returned an invalid WebMCP status.", sv: "Skrivbordstjänsten returnerade en ogiltig WebMCP-status.", uk: "Служба Desktop повернула неприпустимий стан WebMCP.", hi: "डेस्कटॉप सेवा ने अमान्य WebMCP स्थिति लौटाई।", pl: "Usługa Desktop zwróciła nieprawidłowy stan WebMCP.", tr: "Masaüstü hizmeti geçersiz bir WebMCP durumu döndürdü.", vi: "Dịch vụ Desktop trả về trạng thái WebMCP không hợp lệ.", es: "El servicio de escritorio devolvió un estado de WebMCP no válido.", fr: "Le service Desktop a renvoyé un état WebMCP invalide.", ja: "デスクトップサービスから無効なWebMCPステータスが返されました。", de: "Der Desktop-Dienst hat einen ungültigen WebMCP-Status zurückgegeben.", it: "Il servizio desktop ha restituito uno stato WebMCP non valido.", zh-CN: "桌面服务返回了无效的 WebMCP 状态。", zh-TW: "桌面服務傳回無效的 WebMCP 狀態。", zh-HK: "桌面服務傳回無效的 WebMCP 狀態。", pt-BR: "O serviço do Desktop retornou um status WebMCP inválido.", ko: "데스크톱 서비스가 잘못된 WebMCP 상태를 반환했습니다.", nl: "De desktopservice heeft een ongeldige WebMCP-status geretourneerd.", ru: "Служба Desktop вернула недопустимый статус WebMCP.", id: "Layanan desktop mengembalikan status WebMCP yang tidak valid."}
    pairing_created: {en: "Pairing code created. It is valid for a short time and can be used once.", sv: "Parkopplingskod skapad. Den är giltig under en kort tid och kan användas en gång.", uk: "Код підключення створено. Він дійсний недовго та може бути використаний лише один раз.", hi: "पेयरिंग कोड बनाया गया। यह थोड़े समय के लिए मान्य है और एक बार उपयोग किया जा सकता है।", pl: "Utworzono kod parowania. Jest ważny przez krótki czas i można go użyć tylko raz.", tr: "Eşleştirme kodu oluşturuldu. Kısa süre geçerlidir ve yalnızca bir kez kullanılabilir.", vi: "Đã tạo mã ghép nối. Mã có hiệu lực trong thời gian ngắn và chỉ dùng được một lần.", es: "Se creó un código de emparejamiento. Es válido por poco tiempo y solo se puede usar una vez.", fr: "Code d’association créé. Il est valable peu de temps et ne peut être utilisé qu’une fois.", ja: "ペアリングコードを作成しました。有効期限は短く、1回のみ使用できます。", de: "Kopplungscode erstellt. Er ist nur kurze Zeit gültig und kann einmal verwendet werden.", it: "Codice di associazione creato. È valido per poco tempo e può essere usato una sola volta.", zh-CN: "配对码已创建。它仅在短时间内有效，且只能使用一次。", zh-TW: "配對碼已建立。此碼僅在短時間內有效，且只能使用一次。", zh-HK: "配對碼已建立。此碼僅在短時間內有效，且只能使用一次。", pt-BR: "Código de pareamento criado. Ele é válido por pouco tempo e só pode ser usado uma vez.", ko: "페어링 코드가 생성되었습니다. 짧은 시간 동안 유효하며 한 번만 사용할 수 있습니다.", nl: "Koppelingscode aangemaakt. Deze is korte tijd geldig en kan één keer worden gebruikt.", ru: "Создан код сопряжения. Он действует недолго и может быть использован только один раз.", id: "Kode pairing dibuat. Kode ini berlaku sebentar dan hanya dapat digunakan satu kali."}
    invalid_pairing: {en: "The desktop service returned invalid pairing details.", sv: "Skrivbordstjänsten returnerade ogiltiga parkopplingsdetaljer.", uk: "Служба Desktop повернула неприпустимі дані підключення.", hi: "डेस्कटॉप सेवा ने अमान्य पेयरिंग विवरण लौटाए।", pl: "Usługa Desktop zwróciła nieprawidłowe dane parowania.", tr: "Masaüstü hizmeti geçersiz eşleştirme bilgileri döndürdü.", vi: "Dịch vụ Desktop trả về thông tin ghép nối không hợp lệ.", es: "El servicio de escritorio devolvió datos de emparejamiento no válidos.", fr: "Le service Desktop a renvoyé des informations d’association invalides.", ja: "デスクトップサービスから無効なペアリング情報が返されました。", de: "Der Desktop-Dienst hat ungültige Kopplungsdetails zurückgegeben.", it: "Il servizio desktop ha restituito dettagli di associazione non validi.", zh-CN: "桌面服务返回了无效的配对信息。", zh-TW: "桌面服務傳回無效的配對資訊。", zh-HK: "桌面服務傳回無效的配對資料。", pt-BR: "O serviço do Desktop retornou detalhes de pareamento inválidos.", ko: "데스크톱 서비스가 잘못된 페어링 정보를 반환했습니다.", nl: "De desktopservice heeft ongeldige koppelingsgegevens geretourneerd.", ru: "Служба Desktop вернула недопустимые данные сопряжения.", id: "Layanan desktop mengembalikan detail pairing yang tidak valid."}
    stopped: {en: "WebMCP disconnected. Browser sessions and pairing codes were revoked.", sv: "WebMCP frånkopplad. Webbläsarsessioner och parkopplingskoder återkallades.", uk: "WebMCP від’єднано. Сеанси браузера й коди підключення відкликано.", hi: "WebMCP डिस्कनेक्ट हो गया। ब्राउज़र सेशन और पेयरिंग कोड रद्द कर दिए गए।", pl: "WebMCP rozłączono. Sesje przeglądarki i kody parowania zostały unieważnione.", tr: "WebMCP bağlantısı kesildi. Tarayıcı oturumları ve eşleştirme kodları iptal edildi.", vi: "Đã ngắt kết nối WebMCP. Các phiên trình duyệt và mã ghép nối đã bị thu hồi.", es: "WebMCP se desconectó. Se revocaron las sesiones del navegador y los códigos de emparejamiento.", fr: "WebMCP a été déconnecté. Les sessions du navigateur et les codes d’association ont été révoqués.", ja: "WebMCPを切断しました。ブラウザーセッションとペアリングコードは取り消されました。", de: "WebMCP wurde getrennt. Browsersitzungen und Kopplungscodes wurden widerrufen.", it: "WebMCP disconnesso. Le sessioni del browser e i codici di associazione sono stati revocati.", zh-CN: "WebMCP 已断开连接。浏览器会话和配对码均已撤销。", zh-TW: "WebMCP 已中斷連線。瀏覽器工作階段和配對碼均已撤銷。", zh-HK: "WebMCP 已中斷連線。瀏覽器工作階段和配對碼均已撤銷。", pt-BR: "WebMCP foi desconectado. As sessões do navegador e os códigos de pareamento foram revogados.", ko: "WebMCP 연결이 해제되었습니다. 브라우저 세션과 페어링 코드가 취소되었습니다.", nl: "WebMCP is verbroken. Browsersessies en koppelingscodes zijn ingetrokken.", ru: "WebMCP отключён. Сеансы браузера и коды сопряжения отозваны.", id: "WebMCP terputus. Sesi browser dan kode pairing telah dicabut."}
