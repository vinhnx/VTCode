    id_exhausted: {en: "Desktop request identity space was exhausted.", vi: "Không gian định danh yêu cầu desktop đã cạn.", es: "El espacio de identidad de solicitudes de escritorio se agotó.", fr: "L'espace d'identité des requêtes de bureau est épuisé.", ja: "デスクトップ要求のID空間が枯渇しました。", de: "Der Identitätsraum für Desktopanfragen ist erschöpft.", it: "Spazio di identità delle richieste desktop esaurito.", zh-CN: "桌面请求标识空间已耗尽。", zh-TW: "桌面要求識別空間已耗盡。", zh-HK: "桌面要求識別空間已耗盡。", pt-BR: "O espaço de identidade de solicitações de desktop se esgotou.", ko: "데스크톱 요청 ID 공간이 소진되었습니다.", nl: "De identiteitsruimte voor desktopaanvragen is opgebruikt.", sv: "Identitetsutrymmet för skrivbordsförfrågningar är slut.", uk: "Простір ідентифікаторів запитів робочого столу вичерпано.", hi: "डेस्कटॉप अनुरोध पहचान स्थान समाप्त हुआ।", pl: "Przestrzeń tożsamości żądań pulpitu została wyczerpana.", tr: "Masaüstü istek kimlik alanı tükendi.", ru: "Пространство идентификаторов запросов рабочего стола исчерпано.", id: "Ruang identitas permintaan desktop habis."}
    not_accepting: {en: "The VT Code service stopped accepting requests.", vi: "Dịch vụ VT Code đã ngừng nhận yêu cầu.", es: "El servicio de VT Code dejó de aceptar solicitudes.", fr: "Le service VT Code a cessé d'accepter les requêtes.", ja: "VT Codeサービスは要求の受け付けを停止しました。", de: "Der VT Code-Dienst nimmt keine Anfragen mehr an.", it: "Il servizio VT Code ha smesso di accettare richieste.", zh-CN: "VT Code 服务已停止接受请求。", zh-TW: "VT Code 服務已停止接受要求。", zh-HK: "VT Code 服務已停止接受要求。", pt-BR: "O serviço do VT Code parou de aceitar solicitações.", ko: "VT Code 서비스가 요청 수락을 중단했습니다.", nl: "De VT Code-service accepteert geen aanvragen meer.", sv: "VT Code-tjänsten slutade acceptera förfrågningar.", uk: "Служба VT Code припинила приймати запити.", hi: "VT Code सेवा ने अनुरोध स्वीकारने बंद किए।", pl: "Usługa VT Code przestała przyjmować żądania.", tr: "VT Code hizmeti istek kabul etmeyi bıraktı.", ru: "Служба VT Code перестала принимать запросы.", id: "Layanan VT Code berhenti menerima permintaan."}
    malformed: {en: "The VT Code service sent a malformed protocol message.", vi: "Dịch vụ VT Code đã gửi thông điệp giao thức sai định dạng.", es: "El servicio de VT Code envió un mensaje de protocolo con formato incorrecto.", fr: "Le service VT Code a envoyé un message de protocole mal formé.", ja: "VT Codeサービスが不正な形式のプロトコルメッセージを送信しました。", de: "Der VT Code-Dienst hat eine fehlerhafte Protokollnachricht gesendet.", it: "Il servizio VT Code ha inviato un messaggio di protocollo malformato.", zh-CN: "VT Code 服务发送了格式错误的协议消息。", zh-TW: "VT Code 服務傳送了格式錯誤的通訊協定訊息。", zh-HK: "VT Code 服務傳送了格式錯誤的通訊協定訊息。", pt-BR: "O serviço do VT Code enviou uma mensagem de protocolo malformada.", ko: "VT Code 서비스가 잘못된 형식의 프로토콜 메시지를 보냈습니다.", nl: "De VT Code-service heeft een misvormd protocolbericht verzonden.", sv: "VT Code-tjänsten skickade ett felaktigt protokollmeddelande.", uk: "Служба VT Code надіслала неправильно сформоване повідомлення протоколу.", hi: "VT Code सेवा ने विकृत प्रोटोकॉल संदेश भेजा।", pl: "Usługa VT Code wysłała zniekształcony komunikat protokołu.", tr: "VT Code hizmeti bozuk bir protokol iletisi gönderdi.", ru: "Служба VT Code отправила некорректное сообщение протокола.", id: "Layanan VT Code mengirim pesan protokol yang cacat."}
    bad_frame: {en: "The VT Code service sent an invalid or oversized protocol frame.", vi: "Dịch vụ VT Code đã gửi khung giao thức không hợp lệ hoặc quá lớn.", es: "El servicio de VT Code envió un marco de protocolo no válido o demasiado grande.", fr: "Le service VT Code a envoyé un cadre de protocole non valide ou surdimensionné.", ja: "VT Codeサービスが無効または過大なプロトコルフレームを送信しました。", de: "Der VT Code-Dienst hat einen ungültigen oder zu großen Protokollrahmen gesendet.", it: "Il servizio VT Code ha inviato un frame di protocollo non valido o troppo grande.", zh-CN: "VT Code 服务发送了无效或过大的协议帧。", zh-TW: "VT Code 服務傳送了無效或過大的通訊協定框架。", zh-HK: "VT Code 服務傳送了無效或過大的通訊協定框架。", pt-BR: "O serviço do VT Code enviou um quadro de protocolo inválido ou grande demais.", ko: "VT Code 서비스가 유효하지 않거나 너무 큰 프로토콜 프레임을 보냈습니다.", nl: "De VT Code-service heeft een ongeldig of te groot protocolframe verzonden.", sv: "VT Code-tjänsten skickade en ogiltig eller för stor protokollram.", uk: "Служба VT Code надіслала недійсний або завеликий кадр протоколу.", hi: "VT Code सेवा ने अमान्य या बड़ा प्रोटोकॉल फ्रेम भेजा।", pl: "Usługa VT Code wysłała nieprawidłową lub zbyt dużą ramkę protokołu.", tr: "VT Code hizmeti geçersiz veya büyük bir protokol çerçevesi gönderdi.", ru: "Служба VT Code отправила недействительный или слишком большой кадр протокола.", id: "Layanan VT Code mengirim bingkai protokol yang tidak valid atau terlalu besar."}
    cannot_start: {en: "The local VT Code service could not start. Build VT Code or reinstall the desktop app, then try again.", vi: "Dịch vụ VT Code nội bộ không thể khởi động. Hãy build VT Code hoặc cài lại ứng dụng desktop rồi thử lại.", es: "El servicio local de VT Code no pudo iniciarse. Compila VT Code o reinstala la app de escritorio e inténtalo de nuevo.", fr: "Le service VT Code local n'a pas pu démarrer. Compilez VT Code ou réinstallez l'app de bureau, puis réessayez.", ja: "ローカルのVT Codeサービスを開始できませんでした。VT Codeをビルドするかデスクトップアプリを再インストールして再試行してください。", de: "Der lokale VT Code-Dienst konnte nicht starten. Baue VT Code oder installiere die Desktop-App neu und versuche es erneut.", it: "Il servizio VT Code locale non può avviarsi. Compila VT Code o reinstalla l'app desktop, poi riprova.", zh-CN: "本地 VT Code 服务无法启动。请构建 VT Code 或重新安装桌面应用，然后重试。", zh-TW: "本機 VT Code 服務無法啟動。請建置 VT Code 或重新安裝桌面應用程式，然後重試。", zh-HK: "本機 VT Code 服務無法啟動。請建置 VT Code 或重新安裝桌面應用程式，然後重試。", pt-BR: "O serviço local do VT Code não pôde iniciar. Compile o VT Code ou reinstale o app de desktop e tente novamente.", ko: "로컬 VT Code 서비스를 시작할 수 없습니다. VT Code를 빌드하거나 데스크톱 앱을 다시 설치한 후 다시 시도하세요.", nl: "De lokale VT Code-service kan niet starten. Bouw VT Code of installeer de desktopapp opnieuw en probeer het opnieuw.", sv: "Den lokala VT Code-tjänsten kunde inte startas. Bygg VT Code eller installera om skrivbordsappen och försök igen.", uk: "Локальна служба VT Code не змогла запуститися. Зберіть VT Code або перевстановіть застосунок, а потім повторіть.", hi: "स्थानीय VT Code सेवा शुरू नहीं हो सकी। VT Code बनाएँ या डेस्कटॉप ऐप पुनः स्थापित करें, फिर पुनः प्रयास करें।", pl: "Lokalna usługa VT Code nie mogła się uruchomić. Zbuduj VT Code lub zainstaluj ponownie aplikację pulpitu, a potem spróbuj ponownie.", tr: "Yerel VT Code hizmeti başlatılamadı. VT Code uygulamasını derleyin veya masaüstü uygulamasını yeniden yükleyip yeniden deneyin.", ru: "Локальная служба VT Code не смогла запуститься. Соберите VT Code или переустановите настольное приложение и повторите.", id: "Layanan VT Code lokal tidak dapat dimulai. Build VT Code atau instal ulang app desktop, lalu coba lagi."}
    no_binary: {en: "Could not locate the VT Code Desktop application binary.", vi: "Không tìm thấy tệp thực thi ứng dụng VT Code Desktop.", es: "No se pudo localizar el binario de la aplicación VT Code Desktop.", fr: "Impossible de localiser le binaire de l'application VT Code Desktop.", ja: "VT Code Desktopアプリのバイナリが見つかりませんでした。", de: "Die VT Code Desktop-Anwendungsbinärdatei konnte nicht gefunden werden.", it: "Impossibile trovare il binario dell'applicazione VT Code Desktop.", zh-CN: "找不到 VT Code Desktop 应用二进制文件。", zh-TW: "找不到 VT Code Desktop 應用程式二進位檔。", zh-HK: "找不到 VT Code Desktop 應用程式二進位檔。", pt-BR: "Não foi possível localizar o binário do aplicativo VT Code Desktop.", ko: "VT Code Desktop 애플리케이션 바이너리를 찾을 수 없습니다.", nl: "Kan het binaire bestand van VT Code Desktop niet vinden.", sv: "Kunde inte hitta VT Code Desktop-programmets binärfil.", uk: "Не вдалося знайти бінарний файл застосунку VT Code Desktop.", hi: "VT Code Desktop ऐप बाइनरी नहीं मिली।", pl: "Nie można zlokalizować pliku binarnego aplikacji VT Code Desktop.", tr: "VT Code Desktop uygulama ikilisi bulunamadı.", ru: "Не удалось найти бинарный файл приложения VT Code Desktop.", id: "Tidak dapat menemukan biner aplikasi VT Code Desktop."}
    no_parent: {en: "The app binary has no parent directory.", vi: "Tệp thực thi ứng dụng không có thư mục cha.", es: "El binario de la app no tiene directorio padre.", fr: "Le binaire de l'app n'a pas de répertoire parent.", ja: "アプリのバイナリに親ディレクトリがありません。", de: "Die App-Binärdatei hat kein übergeordnetes Verzeichnis.", it: "Il binario dell'app non ha una directory padre.", zh-CN: "应用二进制文件没有父目录。", zh-TW: "應用程式二進位檔沒有父目錄。", zh-HK: "應用程式二進位檔沒有父目錄。", pt-BR: "O binário do app não tem diretório pai.", ko: "앱 바이너리에 상위 디렉터리가 없습니다.", nl: "Het binaire app-bestand heeft geen bovenliggende map.", sv: "Appbinärfilen har ingen överordnad katalog.", uk: "Бінарний файл застосунку не має батьківського каталогу.", hi: "ऐप बाइनरी की कोई मूल निर्देशिका नहीं है।", pl: "Plik binarny aplikacji nie ma katalogu nadrzędnego.", tr: "Uygulama ikilisinin üst dizini yok.", ru: "У бинарного файла приложения нет родительского каталога.", id: "Biner app tidak memiliki direktori induk."}
    missing_helper: {en: "The matching VT Code service is missing from this app bundle. Rebuild or reinstall the app.", vi: "Dịch vụ VT Code tương ứng bị thiếu trong gói ứng dụng này. Hãy build lại hoặc cài lại ứng dụng.", es: "Falta el servicio de VT Code correspondiente en este paquete de app. Recompila o reinstala la app.", fr: "Le service VT Code correspondant manque dans ce paquet d'app. Recompilez ou réinstallez l'app.", ja: "このアプリバンドルに対応するVT Codeサービスがありません。アプリを再ビルドまたは再インストールしてください。", de: "Der passende VT Code-Dienst fehlt in diesem App-Paket. Baue die App neu oder installiere sie neu.", it: "Il servizio VT Code corrispondente manca in questo pacchetto app. Ricompila o reinstalla l'app.", zh-CN: "此应用包中缺少匹配的 VT Code 服务。请重新构建或重新安装应用。", zh-TW: "此應用程式套件中缺少相符的 VT Code 服務。請重新建置或重新安裝應用程式。", zh-HK: "此應用程式套件中缺少相符的 VT Code 服務。請重新建置或重新安裝應用程式。", pt-BR: "O serviço do VT Code correspondente está ausente neste pacote de app. Recompile ou reinstale o app.", ko: "이 앱 번들에 일치하는 VT Code 서비스가 없습니다. 앱을 다시 빌드하거나 다시 설치하세요.", nl: "De bijbehorende VT Code-service ontbreekt in deze app-bundel. Bouw de app opnieuw of installeer hem opnieuw.", sv: "Den matchande VT Code-tjänsten saknas i detta apppaket. Bygg om eller installera om appen.", uk: "У цьому пакеті застосунку немає відповідної служби VT Code. Перебудуйте або перевстановіть застосунок.", hi: "इस ऐप बंडल में मिलान सेवा गुम है। ऐप पुनः बनाएँ या पुनः स्थापित करें।", pl: "W tym pakiecie aplikacji brakuje pasującej usługi VT Code. Przebuduj lub zainstaluj ponownie aplikację.", tr: "Bu uygulama paketinde eşleşen VT Code hizmeti eksik. Uygulamayı yeniden derleyin veya yeniden yükleyin.", ru: "В этом пакете приложения нет подходящей службы VT Code. Пересоберите или переустановите приложение.", id: "Layanan VT Code yang cocok hilang dari bundel app ini. Build ulang atau instal ulang app."}
    request_rejected: {en: "The VT Code service rejected the request.", vi: "Dịch vụ VT Code đã từ chối yêu cầu.", es: "El servicio de VT Code rechazó la solicitud.", fr: "Le service VT Code a rejeté la requête.", ja: "VT Codeサービスは要求を拒否しました。", de: "Der VT Code-Dienst hat die Anfrage abgelehnt.", it: "Il servizio VT Code ha rifiutato la richiesta.", zh-CN: "VT Code 服务拒绝了该请求。", zh-TW: "VT Code 服務拒絕了該要求。", zh-HK: "VT Code 服務拒絕了該要求。", pt-BR: "O serviço do VT Code rejeitou a solicitação.", ko: "VT Code 서비스가 요청을 거부했습니다.", nl: "De VT Code-service heeft de aanvraag geweigerd.", sv: "VT Code-tjänsten avvisade förfrågan.", uk: "Служба VT Code відхилила запит.", hi: "VT Code सेवा ने अनुरोध अस्वीकार किया।", pl: "Usługa VT Code odrzuciła żądanie.", tr: "VT Code hizmeti isteği reddetti.", ru: "Служба VT Code отклонила запрос.", id: "Layanan VT Code menolak permintaan."}
    missing_dev_backend: {en: "The matching VT Code backend was not found. Run `cargo build --locked -p vtcode -p vtcode-desktop` or package the app again.", vi: "Không tìm thấy backend VT Code tương ứng. Hãy chạy `cargo build --locked -p vtcode -p vtcode-desktop` hoặc đóng gói lại ứng dụng.", es: "No se encontró el backend de VT Code correspondiente. Ejecuta `cargo build --locked -p vtcode -p vtcode-desktop` o vuelve a empaquetar la app.", fr: "Backend VT Code correspondant introuvable. Exécutez `cargo build --locked -p vtcode -p vtcode-desktop` ou reconditionnez l'app.", ja: "対応するVT Codeバックエンドが見つかりません。`cargo build --locked -p vtcode -p vtcode-desktop`を実行するか、アプリを再パッケージしてください。", de: "Das passende VT Code-Backend wurde nicht gefunden. Führe `cargo build --locked -p vtcode -p vtcode-desktop` aus oder packe die App erneut.", it: "Backend VT Code corrispondente non trovato. Esegui `cargo build --locked -p vtcode -p vtcode-desktop` o ricomponi l'app.", zh-CN: "未找到匹配的 VT Code 后端。请运行 `cargo build --locked -p vtcode -p vtcode-desktop` 或重新打包应用。", zh-TW: "未找到相符的 VT Code 後端。請執行 `cargo build --locked -p vtcode -p vtcode-desktop` 或重新封裝應用程式。", zh-HK: "未找到相符的 VT Code 後端。請執行 `cargo build --locked -p vtcode -p vtcode-desktop` 或重新封裝應用程式。", pt-BR: "O backend do VT Code correspondente não foi encontrado. Execute `cargo build --locked -p vtcode -p vtcode-desktop` ou empacote o app novamente.", ko: "일치하는 VT Code 백엔드를 찾을 수 없습니다. `cargo build --locked -p vtcode -p vtcode-desktop`을 실행하거나 앱을 다시 패키징하세요.", nl: "De bijbehorende VT Code-backend is niet gevonden. Voer `cargo build --locked -p vtcode -p vtcode-desktop` uit of verpak de app opnieuw.", sv: "Den matchande VT Code-servern hittades inte. Kör `cargo build --locked -p vtcode -p vtcode-desktop` eller paketera om appen.", uk: "Відповідний сервер VT Code не знайдено. Запустіть `cargo build --locked -p vtcode -p vtcode-desktop` або перепакуйте застосунок.", hi: "मिलान VT Code बैकएंड नहीं मिला। `cargo build --locked -p vtcode -p vtcode-desktop` चलाएँ या ऐप पुनः पैकेज करें।", pl: "Nie znaleziono pasującego backendu VT Code. Uruchom `cargo build --locked -p vtcode -p vtcode-desktop` lub spakuj aplikację ponownie.", tr: "Eşleşen VT Code arka ucu bulunamadı. `cargo build --locked -p vtcode -p vtcode-desktop` komutunu çalıştırın veya uygulamayı yeniden paketleyin.", ru: "Подходящий сервер VT Code не найден. Выполните `cargo build --locked -p vtcode -p vtcode-desktop` или переупакуйте приложение.", id: "Backend VT Code yang cocok tidak ditemukan. Jalankan `cargo build --locked -p vtcode -p vtcode-desktop` atau kemas ulang app."}
    disconnected: {en: "Local service disconnected", vi: "Dịch vụ nội bộ đã ngắt kết nối", es: "Servicio local desconectado", fr: "Service local déconnecté", ja: "ローカルサービスが切断されました", de: "Lokaler Dienst getrennt", it: "Servizio locale disconnesso", zh-CN: "本地服务已断开连接", zh-TW: "本機服務已中斷連線", zh-HK: "本機服務已中斷連線", pt-BR: "Serviço local desconectado", ko: "로컬 서비스 연결 끊김", nl: "Lokale service verbroken", sv: "Lokal tjänst frånkopplad", uk: "Локальну службу від'єднано", hi: "स्थानीय सेवा डिस्कनेक्ट हुई", pl: "Usługa lokalna rozłączona", tr: "Yerel hizmet bağlantısı kesildi", ru: "Локальная служба отключена", id: "Layanan lokal terputus"}
    startup_wait: {en: "Waiting for the startup decision before sending…", vi: "Đang đợi quyết định khởi động trước khi gửi…", es: "Esperando la decisión de inicio antes de enviar…", fr: "Attente de la décision de démarrage avant l'envoi…", ja: "送信前に起動の決定を待っています…", de: "Warte auf die Startentscheidung vor dem Senden…", it: "In attesa della decisione di avvio prima di inviare…", zh-CN: "发送前正在等待启动决定…", zh-TW: "傳送前正在等待啟動決定…", zh-HK: "傳送前正在等待啟動決定…", pt-BR: "Aguardando a decisão de inicialização antes de enviar…", ko: "보내기 전에 시작 결정을 기다리는 중…", nl: "Wachten op de opstartbeslissing vóór verzending…", sv: "Väntar på startbeslutet innan sändning…", uk: "Очікування рішення про запуск перед надсиланням…", hi: "भेजने से पहले स्टार्टअप निर्णय की प्रतीक्षा…", pl: "Oczekiwanie na decyzję startową przed wysłaniem…", tr: "Göndermeden önce başlatma kararı bekleniyor…", ru: "Ожидание решения о запуске перед отправкой…", id: "Menunggu keputusan startup sebelum mengirim…"}
    startup_question: {en: "Resolve the startup question before sending a message.", vi: "Hãy giải quyết câu hỏi khởi động trước khi gửi tin nhắn.", es: "Resuelve la pregunta de inicio antes de enviar un mensaje.", fr: "Résolvez la question de démarrage avant d'envoyer un message.", ja: "メッセージを送信する前に起動時の質問を解決してください。", de: "Kläre die Startfrage, bevor du eine Nachricht sendest.", it: "Risolvi la domanda di avvio prima di inviare un messaggio.", zh-CN: "请先解决启动问题，再发送消息。", zh-TW: "請先解決啟動問題，再傳送訊息。", zh-HK: "請先解決啟動問題，再傳送訊息。", pt-BR: "Resolva a pergunta de inicialização antes de enviar uma mensagem.", ko: "메시지를 보내기 전에 시작 질문을 해결하세요.", nl: "Los de opstartvraag op voordat je een bericht verzendt.", sv: "Lös startfrågan innan du skickar ett meddelande.", uk: "Розв'яжіть запитання про запуск, перш ніж надсилати повідомлення.", hi: "संदेश भेजने से पहले स्टार्टअप प्रश्न हल करें।", pl: "Rozwiąż pytanie startowe przed wysłaniem wiadomości.", tr: "İleti göndermeden önce başlatma sorusunu çözün.", ru: "Разрешите вопрос о запуске перед отправкой сообщения.", id: "Selesaikan pertanyaan startup sebelum mengirim pesan."}
    decision_rejected: {en: "The decision was not accepted. Review it and try again.", vi: "Quyết định không được chấp nhận. Hãy xem lại và thử lại.", es: "La decisión no fue aceptada. Revísala e inténtalo de nuevo.", fr: "La décision n'a pas été acceptée. Vérifiez-la et réessayez.", ja: "決定は受理されませんでした。確認して再試行してください。", de: "Die Entscheidung wurde nicht angenommen. Prüfe sie und versuche es erneut.", it: "La decisione non è stata accettata. Rivedila e riprova.", zh-CN: "决定未被接受。请检查后重试。", zh-TW: "決定未被接受。請檢查後重試。", zh-HK: "決定未被接受。請檢查後重試。", pt-BR: "A decisão não foi aceita. Revise-a e tente novamente.", ko: "결정이 수락되지 않았습니다. 검토 후 다시 시도하세요.", nl: "De beslissing is niet geaccepteerd. Controleer deze en probeer het opnieuw.", sv: "Beslutet accepterades inte. Granska det och försök igen.", uk: "Рішення не прийнято. Перегляньте його й повторіть.", hi: "निर्णय स्वीकार नहीं हुआ। समीक्षा करें और पुनः प्रयास करें।", pl: "Decyzja nie została przyjęta. Sprawdź ją i spróbuj ponownie.", tr: "Karar kabul edilmedi. Gözden geçirip yeniden deneyin.", ru: "Решение не принято. Проверьте его и повторите.", id: "Keputusan tidak diterima. Tinjau dan coba lagi."}
    request_failed: {en: "Service request failed", vi: "Yêu cầu dịch vụ thất bại", es: "La solicitud de servicio falló", fr: "Échec de la requête de service", ja: "サービス要求に失敗", de: "Dienstanfrage fehlgeschlagen", it: "Richiesta di servizio non riuscita", zh-CN: "服务请求失败", zh-TW: "服務要求失敗", zh-HK: "服務要求失敗", pt-BR: "Falha na solicitação de serviço", ko: "서비스 요청 실패", nl: "Serviceaanvraag mislukt", sv: "Tjänsteförfrågan misslyckades", uk: "Запит служби не вдався", hi: "सेवा अनुरोध विफल", pl: "Żądanie usługi nie powiodło się", tr: "Hizmet isteği başarısız", ru: "Запрос службы не удался", id: "Permintaan layanan gagal"}
    review_invalid: {en: "Invalid Git review response.", vi: "Phản hồi xem lại Git không hợp lệ.", es: "Respuesta de revisión de Git no válida.", fr: "Réponse d'examen Git non valide.", ja: "無効なGitレビュー応答です。", de: "Ungültige Git-Prüfantwort.", it: "Risposta di revisione Git non valida.", zh-CN: "无效的 Git 检查响应。", zh-TW: "無效的 Git 檢閱回應。", zh-HK: "無效的 Git 檢閱回應。", pt-BR: "Resposta de revisão do Git inválida.", ko: "유효하지 않은 Git 검토 응답입니다.", nl: "Ongeldige Git-controlereactie.", sv: "Ogiltigt Git-granskningssvar.", uk: "Недійсна відповідь перегляду Git.", hi: "अमान्य Git समीक्षा प्रत्युत्तर।", pl: "Nieprawidłowa odpowiedź przeglądu Git.", tr: "Geçersiz Git inceleme yanıtı.", ru: "Недействительный ответ проверки Git.", id: "Respons tinjauan Git tidak valid."}
    connected_service: {en: "Connected to the local VT Code service", vi: "Đã kết nối tới dịch vụ VT Code nội bộ", es: "Conectado al servicio local de VT Code", fr: "Connecté au service VT Code local", ja: "ローカルのVT Codeサービスに接続しました", de: "Mit dem lokalen VT Code-Dienst verbunden", it: "Connesso al servizio VT Code locale", zh-CN: "已连接到本地 VT Code 服务", zh-TW: "已連線到本機 VT Code 服務", zh-HK: "已連線到本機 VT Code 服務", pt-BR: "Conectado ao serviço local do VT Code", ko: "로컬 VT Code 서비스에 연결됨", nl: "Verbonden met de lokale VT Code-service", sv: "Ansluten till den lokala VT Code-tjänsten", uk: "Підключено до локальної служби VT Code", hi: "स्थानीय VT Code सेवा से कनेक्टेड", pl: "Połączono z lokalną usługą VT Code", tr: "Yerel VT Code hizmetine bağlanıldı", ru: "Подключено к локальной службе VT Code", id: "Terhubung ke layanan VT Code lokal"}
    invalid_init: {en: "The local service returned an invalid or incompatible initialization response. Rebuild the desktop app and its bundled helper together.", vi: "Dịch vụ nội bộ trả về phản hồi khởi tạo không hợp lệ hoặc không tương thích. Hãy build lại ứng dụng desktop và trình trợ giúp đi kèm cùng nhau.", es: "El servicio local devolvió una respuesta de inicialización no válida o incompatible. Recompila la app de escritorio y su ayudante incluido juntos.", fr: "Le service local a renvoyé une réponse d'initialisation non valide ou incompatible. Recompilez ensemble l'app de bureau et son utilitaire inclus.", ja: "ローカルサービスが無効または互換性のない初期化応答を返しました。デスクトップアプリと同梱ヘルパーを一緒に再ビルドしてください。", de: "Der lokale Dienst gab eine ungültige oder inkompatible Initialisierungsantwort zurück. Baue die Desktop-App und ihren gebündelten Helfer gemeinsam neu.", it: "Il servizio locale ha restituito una risposta di inizializzazione non valida o incompatibile. Ricompila insieme l'app desktop e il suo helper integrato.", zh-CN: "本地服务返回了无效或不兼容的初始化响应。请将桌面应用及其捆绑助手一起重新构建。", zh-TW: "本機服務傳回了無效或不相容的初始化回應。請將桌面應用程式及其內建協助程式一起重新建置。", zh-HK: "本機服務傳回了無效或不相容的初始化回應。請將桌面應用程式及其內建協助程式一起重新建置。", pt-BR: "O serviço local retornou uma resposta de inicialização inválida ou incompatível. Recompile o app de desktop e seu auxiliar incluído juntos.", ko: "로컬 서비스가 유효하지 않거나 호환되지 않는 초기화 응답을 반환했습니다. 데스크톱 앱과 번들 헬퍼를 함께 다시 빌드하세요.", nl: "De lokale service heeft een ongeldige of incompatibele initialisatiereactie geretourneerd. Bouw de desktopapp en zijn meegeleverde helper samen opnieuw.", sv: "Den lokala tjänsten returnerade ett ogiltigt eller inkompatibelt initieringssvar. Bygg om skrivbordsappen och dess medföljande hjälpare tillsammans.", uk: "Локальна служба повернула недійсну або несумісну відповідь ініціалізації. Перебудуйте разом застосунок і його вбудований помічник.", hi: "स्थानीय सेवा ने अमान्य या असंगत प्रारंभ प्रत्युत्तर दिया। डेस्कटॉप ऐप व उसके बंडल सहायक को साथ बनाएँ।", pl: "Usługa lokalna zwróciła nieprawidłową 