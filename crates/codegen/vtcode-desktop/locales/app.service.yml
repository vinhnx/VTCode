    decision_accepted: {en: "Decision accepted", vi: "Đã chấp nhận quyết định", es: "Decisión aceptada", fr: "Décision acceptée", ja: "決定を受け入れました", de: "Entscheidung angenommen", it: "Decisione accettata", zh-CN: "已接受决定", zh-TW: "已接受決定", zh-HK: "已接受決定", pt-BR: "Decisão aceita", ko: "결정이 수락됨", nl: "Beslissing geaccepteerd", sv: "Beslut accepterat", uk: "Рішення прийнято", hi: "निर्णय स्वीकृत", pl: "Zaakceptowano decyzję", tr: "Karar kabul edildi", ru: "Решение принято", id: "Keputusan diterima"}
    invalid_slash_catalog: {en: "The local CLI returned an invalid slash command catalog.", vi: "CLI cục bộ đã trả về danh mục lệnh gạch chéo không hợp lệ.", es: "La CLI local devolvió un catálogo de comandos de barra no válido.", fr: "La CLI locale a renvoyé un catalogue de commandes slash invalide.", ja: "ローカル CLI が無効なスラッシュコマンドカタログを返しました。", de: "Die lokale CLI hat einen ungültigen Slash-Befehlskatalog zurückgegeben.", it: "La CLI locale ha restituito un catalogo di comandi slash non valido.", zh-CN: "本地 CLI 返回了无效的斜杠命令目录。", zh-TW: "本機 CLI 傳回了無效的斜線命令目錄。", zh-HK: "本機 CLI 傳回了無效的斜線命令目錄。", pt-BR: "A CLI local retornou um catálogo de comandos de barra inválido.", ko: "로컬 CLI에서 잘못된 슬래시 명령 카탈로그를 반환했습니다.", nl: "De lokale CLI heeft een ongeldige slash-opdrachtencatalogus geretourneerd.", sv: "Den lokala CLI:n returnerade en ogiltig snedstreckskommandokatalog.", uk: "Локальний CLI повернув недійсний каталог слеш-команд.", hi: "स्थानीय CLI ने अमान्य स्लैश कमांड कैटलॉग लौटाया।", pl: "Lokalny interfejs CLI zwrócił nieprawidłowy katalog poleceń ukośnika.", tr: "Yerel CLI geçersiz bir eğik çizgi komut kataloğu döndürdü.", ru: "Локальный CLI вернул недопустимый каталог слеш-команд.", id: "CLI lokal mengembalikan katalog perintah garis miring yang tidak valid."}
    invalid_session: {en: "The service returned an invalid session. Your message has not been submitted.", vi: "Dịch vụ đã trả về một phiên không hợp lệ. Tin nhắn của bạn chưa được gửi.", es: "El servicio devolvió una sesión no válida. Tu mensaje no se ha enviado.", fr: "Le service a renvoyé une session invalide. Votre message n'a pas été envoyé.", ja: "サービスが無効なセッションを返しました。メッセージは送信されませんでした。", de: "Der Dienst hat eine ungültige Sitzung zurückgegeben. Ihre Nachricht wurde nicht gesendet.", it: "Il servizio ha restituito una sessione non valida. Il messaggio non è stato inviato.", zh-CN: "服务返回了无效的会话。您的消息尚未提交。", zh-TW: "服務傳回了無效的工作階段。您的訊息尚未提交。", zh-HK: "服務傳回了無效的工作階段。您的訊息尚未提交。", pt-BR: "O serviço retornou uma sessão inválida. Sua mensagem não foi enviada.", ko: "서비스에서 잘못된 세션을 반환했습니다. 메시지가 전송되지 않았습니다.", nl: "De service heeft een ongeldige sessie geretourneerd. Je bericht is niet verzonden.", sv: "Tjänsten returnerade en ogiltig session. Ditt meddelande har inte skickats.", uk: "Служба повернула недійсний сеанс. Ваше повідомлення не надіслано.", hi: "सेवा ने अमान्य सत्र लौटाया। आपका संदेश सबमिट नहीं हुआ।", pl: "Usługa zwróciła nieprawidłową sesję. Twoja wiadomość nie została wysłana.", tr: "Hizmet geçersiz bir oturum döndürdü. Mesajınız gönderilmedi.", ru: "Служба вернула недопустимый сеанс. Ваше сообщение не отправлено.", id: "Layanan mengembalikan sesi yang tidak valid. Pesan Anda belum terkirim."}
    reconnect_with_draft: {en: "Restore or dismiss the retained message, then choose Reload CLI settings in Settings → VT Code to reconnect.", vi: "Khôi phục hoặc loại bỏ tin nhắn đang giữ, sau đó chọn Tải lại cài đặt CLI trong Cài đặt → VT Code để kết nối lại.", es: "Restaura o descarta el mensaje retenido y luego elige Recargar ajustes de CLI en Ajustes → VT Code para reconectar.", fr: "Restaurez ou ignorez le message conservé, puis choisissez Recharger les réglages CLI dans Réglages → VT Code pour vous reconnecter.", ja: "保持中のメッセージを復元または破棄してから、設定 → VT Code で CLI 設定の再読み込みを選択して再接続してください。", de: "Stellen Sie die zurückgehaltene Nachricht wieder her oder verwerfen Sie sie, und wählen Sie dann CLI-Einstellungen neu laden in Einstellungen → VT Code, um die Verbindung wiederherzustellen.", it: "Ripristina o ignora il messaggio trattenuto, quindi scegli Ricarica impostazioni CLI in Impostazioni → VT Code per riconnetterti.", zh-CN: "恢复或放弃保留的消息，然后在“设置 → VT Code”中选择“重新加载 CLI 设置”以重新连接。", zh-TW: "還原或捨棄保留的訊息，然後在「設定 → VT Code」中選擇「重新載入 CLI 設定」以重新連線。", zh-HK: "還原或捨棄保留的訊息，然後在「設定 → VT Code」中選擇「重新載入 CLI 設定」以重新連線。", pt-BR: "Restaure ou dispense a mensagem retida e escolha Recarregar configurações de CLI em Configurações → VT Code para reconectar.", ko: "보관된 메시지를 복원하거나 해제하고, 설정 → VT Code에서 CLI 설정 다시 로드를 선택하여 다시 연결하세요.", nl: "Herstel of negeer het bewaarde bericht en kies vervolgens CLI-instellingen opnieuw laden in Instellingen → VT Code om opnieuw te verbinden.", sv: "Återställ eller ignorera det behållna meddelandet och välj sedan Läs in CLI-inställningar igen i Inställningar → VT Code för att återansluta.", uk: "Відновіть або відхиліть збережене повідомлення, а потім виберіть «Перезавантажити налаштування CLI» в «Налаштування → VT Code», щоб перепідключитися.", hi: "बनाए रखा संदेश पुनर्स्थापित या खारिज करें, फिर पुनः कनेक्ट करने के लिए Settings → VT Code में CLI सेटिंग पुनः लोड करें चुनें।", pl: "Przywróć lub odrzuć zachowaną wiadomość, a następnie wybierz Załaduj ponownie ustawienia CLI w Ustawienia → VT Code, aby połączyć się ponownie.", tr: "Tutulan mesajı geri yükleyin veya kapatın, ardından yeniden bağlanmak için Ayarlar → VT Code içinde CLI ayarlarını yeniden yükle'yi seçin.", ru: "Восстановите или отклоните сохранённое сообщение, затем выберите «Перезагрузить настройки CLI» в «Настройки → VT Code», чтобы переподключиться.", id: "Pulihkan atau abaikan pesan yang disimpan, lalu pilih Muat ulang pengaturan CLI di Pengaturan → VT Code untuk menyambung ulang."}
    reconnect_plain: {en: "Choose Reload CLI settings in Settings → VT Code to reconnect.", vi: "Chọn Tải lại cài đặt CLI trong Cài đặt → VT Code để kết nối lại.", es: "Elige Recargar ajustes de CLI en Ajustes → VT Code para reconectar.", fr: "Choisissez Recharger les réglages CLI dans Réglages → VT Code pour vous reconnecter.", ja: "設定 → VT Code で CLI 設定の再読み込みを選択して再接続してください。", de: "Wählen Sie CLI-Einstellungen neu laden in Einstellungen → VT Code, um die Verbindung wiederherzustellen.", it: "Scegli Ricarica impostazioni CLI in Impostazioni → VT Code per riconnetterti.", zh-CN: "在“设置 → VT Code”中选择“重新加载 CLI 设置”以重新连接。", zh-TW: "在「設定 → VT Code」中選擇「重新載入 CLI 設定」以重新連線。", zh-HK: "在「設定 → VT Code」中選擇「重新載入 CLI 設定」以重新連線。", pt-BR: "Escolha Recarregar configurações de CLI em Configurações → VT Code para reconectar.", ko: "설정 → VT Code에서 CLI 설정 다시 로드를 선택하여 다시 연결하세요.", nl: "Kies CLI-instellingen opnieuw laden in Instellingen → VT Code om opnieuw te verbinden.", sv: "Välj Läs in CLI-inställningar igen i Inställningar → VT Code för att återansluta.", uk: "Виберіть «Перезавантажити налаштування CLI» в «Налаштування → VT Code», щоб перепідключитися.", hi: "पुनः कनेक्ट करने के लिए Settings → VT Code में CLI सेटिंग पुनः लोड करें चुनें।", pl: "Wybierz Załaduj ponownie ustawienia CLI w Ustawienia → VT Code, aby połączyć się ponownie.", tr: "Yeniden bağlanmak için Ayarlar → VT Code içinde CLI ayarlarını yeniden yükle'yi seçin.", ru: "Выберите «Перезагрузить настройки CLI» в «Настройки → VT Code», чтобы переподключиться.", id: "Pilih Muat ulang pengaturan CLI di Pengaturan → VT Code untuk menyambung ulang."}
    authentication_failed: {en: "VT Code could not authenticate the configured provider. In Terminal, run `vtcode auth` or `vtcode login <provider>`. %{detail}", vi: "VT Code không thể xác thực nhà cung cấp đã cấu hình. Trong Terminal, hãy chạy `vtcode auth` hoặc `vtcode login <provider>`. %{detail}", es: "VT Code no pudo autenticar el proveedor configurado. En Terminal, ejecuta `vtcode auth` o `vtcode login <provider>`. %{detail}", fr: "VT Code n'a pas pu authentifier le fournisseur configuré. Dans Terminal, exécutez `vtcode auth` ou `vtcode login <provider>`. %{detail}", ja: "VT Code は設定済みプロバイダーを認証できませんでした。Terminal で `vtcode auth` または `vtcode login <provider>` を実行してください。%{detail}", de: "VT Code konnte den konfigurierten Anbieter nicht authentifizieren. Führen Sie in Terminal `vtcode auth` oder `vtcode login <provider>` aus. %{detail}", it: "VT Code non ha potuto autenticare il provider configurato. In Terminale, esegui `vtcode auth` o `vtcode login <provider>`. %{detail}", zh-CN: "VT Code 无法验证已配置的提供商。请在“终端”中运行 `vtcode auth` 或 `vtcode login <provider>`。%{detail}", zh-TW: "VT Code 無法驗證已設定的提供者。請在「終端機」中執行 `vtcode auth` 或 `vtcode login <provider>`。%{detail}", zh-HK: "VT Code 無法驗證已設定的提供者。請在「終端機」中執行 `vtcode auth` 或 `vtcode login <provider>`。%{detail}", pt-BR: "O VT Code não conseguiu autenticar o provedor configurado. No Terminal, execute `vtcode auth` ou `vtcode login <provider>`. %{detail}", ko: "VT Code에서 구성된 제공업체를 인증할 수 없습니다. 터미널에서 `vtcode auth` 또는 `vtcode login <provider>`을(를) 실행하세요. %{detail}", nl: "VT Code kon de geconfigureerde provider niet verifiëren. Voer in Terminal `vtcode auth` of `vtcode login <provider>` uit. %{detail}", sv: "VT Code kunde inte autentisera den konfigurerade leverantören. Kör `vtcode auth` eller `vtcode login <provider>` i Terminal. %{detail}", uk: "VT Code не вдалося автентифікувати налаштованого провайдера. У Terminal виконайте `vtcode auth` або `vtcode login <provider>`. %{detail}", hi: "VT Code कॉन्फ़िगर किए गए प्रदाता को प्रमाणित नहीं कर सका। Terminal में `vtcode auth` या `vtcode login <provider>` चलाएँ। %{detail}", pl: "VT Code nie mógł uwierzytelnić skonfigurowanego dostawcy. W Terminalu uruchom `vtcode auth` lub `vtcode login <provider>`. %{detail}", tr: "VT Code, yapılandırılan sağlayıcının kimliğini doğrulayamadı. Terminal'de `vtcode auth` veya `vtcode login <provider>` komutunu çalıştırın. %{detail}", ru: "VT Code не удалось пройти проверку подлинности у настроенного провайдера. В Terminal выполните `vtcode auth` или `vtcode login <provider>`. %{detail}", id: "VT Code tidak dapat mengautentikasi penyedia yang dikonfigurasi. Di Terminal, jalankan `vtcode auth` atau `vtcode login <provider>`. %{detail}"}
