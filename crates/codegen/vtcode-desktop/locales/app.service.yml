_version: 2
app:
  service:
    runtime_init: {en: "The VT Code desktop service could not initialize its runtime.", vi: "Dịch vụ desktop VT Code không thể khởi tạo runtime.", es: "El servicio de escritorio de VT Code no pudo inicializar su runtime.", fr: "Le service de bureau VT Code n'a pas pu initialiser son runtime.", ja: "VT Codeデスクトップサービスはランタイムを初期化できませんでした。", de: "Der VT Code-Desktopdienst konnte seine Laufzeit nicht initialisieren.", it: "Il servizio desktop VT Code non ha potuto inizializzare il suo runtime.", zh-CN: "VT Code 桌面服务无法初始化其运行时。", zh-TW: "VT Code 桌面服務無法初始化其執行階段。", zh-HK: "VT Code 桌面服務無法初始化其執行階段。", pt-BR: "O serviço de desktop do VT Code não pôde inicializar seu runtime.", ko: "VT Code 데스크톱 서비스가 런타임을 초기화할 수 없습니다.", nl: "De VT Code-desktopservice kan zijn runtime niet initialiseren.", sv: "VT Code-skrivbordstjänsten kunde inte initiera sin körtid.", uk: "Служба VT Code для робочого столу не змогла ініціалізувати середовище.", hi: "VT Code डेस्कटॉप सेवा अपना रनटाइम प्रारंभ नहीं कर सकी।", pl: "Usługa pulpitu VT Code nie mogła zainicjować swojego środowiska.", tr: "VT Code masaüstü hizmeti çalışma zamanını başlatamadı.", ru: "Службе VT Code для рабочего стола не удалось инициализировать среду.", id: "Layanan desktop VT Code tidak dapat menginisialisasi runtime-nya."}
    transport_thread: {en: "Could not start the VT Code desktop transport thread.", vi: "Không thể khởi động luồng truyền tải desktop VT Code.", es: "No se pudo iniciar el hilo de transporte de escritorio de VT Code.", fr: "Impossible de démarrer le thread de transport de bureau VT Code.", ja: "VT Codeデスクトップのトランスポートスレッドを開始できませんでした。", de: "Der VT Code-Desktoptransportthread konnte nicht gestartet werden.", it: "Impossibile avviare il thread di trasporto desktop VT Code.", zh-CN: "无法启动 VT Code 桌面传输线程。", zh-TW: "無法啟動 VT Code 桌面傳輸執行緒。", zh-HK: "無法啟動 VT Code 桌面傳輸執行緒。", pt-BR: "Não foi possível iniciar o thread de transporte de desktop do VT Code.", ko: "VT Code 데스크톱 전송 스레드를 시작할 수 없습니다.", nl: "Kan de VT Code-desktoptransportthread niet starten.", sv: "Kunde inte starta VT Code-skrivbordstransporttråden.", uk: "Не вдалося запустити потік транспорту VT Code для робочого столу.", hi: "VT Code डेस्कटॉप ट्रांसपोर्ट थ्रेड शुरू नहीं किया जा सका।", pl: "Nie można uruchomić wątku transportu pulpitu VT Code.", tr: "VT Code masaüstü aktarım iş parçacığı başlatılamadı.", ru: "Не удалось запустить поток транспорта VT Code для рабочего стола.", id: "Tidak dapat memulai thread transpor desktop VT Code."}
    no_proto_out: {en: "The VT Code service did not open its protocol output.", vi: "Dịch vụ VT Code không mở đầu ra giao thức.", es: "El servicio de VT Code no abrió su salida de protocolo.", fr: "Le service VT Code n'a pas ouvert sa sortie de protocole.", ja: "VT Codeサービスはプロトコル出力を開きませんでした。", de: "Der VT Code-Dienst hat seine Protokollausgabe nicht geöffnet.", it: "Il servizio VT Code non ha aperto il suo output di protocollo.", zh-CN: "VT Code 服务未打开其协议输出。", zh-TW: "VT Code 服務未開啟其通訊協定輸出。", zh-HK: "VT Code 服務未開啟其通訊協定輸出。", pt-BR: "O serviço do VT Code não abriu sua saída de protocolo.", ko: "VT Code 서비스가 프로토콜 출력을 열지 않았습니다.", nl: "De VT Code-service heeft zijn protocoluitvoer niet geopend.", sv: "VT Code-tjänsten öppnade inte sin protokollutdata.", uk: "Служба VT Code не відкрила свій вивід протоколу.", hi: "VT Code सेवा ने अपना प्रोटोकॉल आउटपुट नहीं खोला।", pl: "Usługa VT Code nie otworzyła swojego wyjścia protokołu.", tr: "VT Code hizmeti protokol çıktısını açmadı.", ru: "Служба VT Code не открыла свой вывод протокола.", id: "Layanan VT Code tidak membuka keluaran protokolnya."}
    no_proto_in: {en: "The VT Code service did not open its protocol input.", vi: "Dịch vụ VT Code không mở đầu vào giao thức.", es: "El servicio de VT Code no abrió su entrada de protocolo.", fr: "Le service VT Code n'a pas ouvert son entrée de protocole.", ja: "VT Codeサービスはプロトコル入力を開きませんでした。", de: "Der VT Code-Dienst hat seine Protokolleingabe nicht geöffnet.", it: "Il servizio VT Code non ha aperto il suo input di protocollo.", zh-CN: "VT Code 服务未打开其协议输入。", zh-TW: "VT Code 服務未開啟其通訊協定輸入。", zh-HK: "VT Code 服務未開啟其通訊協定輸入。", pt-BR: "O serviço do VT Code não abriu sua entrada de protocolo.", ko: "VT Code 서비스가 프로토콜 입력을 열지 않았습니다.", nl: "De VT Code-service heeft zijn protocolinvoer niet geopend.", sv: "VT Code-tjänsten öppnade inte sin protokollindata.", uk: "Служба VT Code не відкрила свій ввід протоколу.", hi: "VT Code सेवा ने अपना प्रोटोकॉल इनपुट नहीं खोला।", pl: "Usługa VT Code nie otworzyła swojego wejścia protokołu.", tr: "VT Code hizmeti protokol girdisini açmadı.", ru: "Служба VT Code не открыла свой ввод протокола.", id: "Layanan VT Code tidak membuka masukan protokolnya."}
