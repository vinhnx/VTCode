    pairing_instructions: {en: "In the browser app, open Settings → Connect to a local VT Code bridge and paste both values.", vi: "Trong ứng dụng trình duyệt, mở Cài đặt → Kết nối tới cầu VT Code nội bộ và dán cả hai giá trị.", es: "En la app de navegador, abre Ajustes → Conectar a un puente local de VT Code y pega ambos valores.", fr: "Dans l'app de navigateur, ouvrez Paramètres → Se connecter à un pont VT Code local et collez les deux valeurs.", ja: "ブラウザーアプリで設定 → ローカルのVT Codeブリッジに接続 を開き、両方の値を貼り付けます。", de: "Öffne in der Browser-App Einstellungen → Mit lokaler VT Code-Bridge verbinden und füge beide Werte ein.", it: "Nell'app browser, apri Impostazioni → Connetti a un bridge VT Code locale e incolla entrambi i valori.", zh-CN: "在浏览器应用中，打开“设置 → 连接到本地 VT Code 桥”并粘贴这两个值。", zh-TW: "在瀏覽器應用程式中，開啟「設定 → 連線到本機 VT Code 橋接器」並貼上這兩個值。", zh-HK: "在瀏覽器應用程式中，開啟「設定 → 連線到本機 VT Code 橋接器」並貼上這兩個值。", pt-BR: "No app de navegador, abra Configurações → Conectar a uma ponte local do VT Code e cole os dois valores.", ko: "브라우저 앱에서 설정 → 로컬 VT Code 브리지에 연결을 열고 두 값을 붙여넣으세요.", nl: "Open in de browser-app Instellingen → Verbinden met een lokale VT Code-brug en plak beide waarden.", sv: "Öppna Inställningar → Anslut till en lokal VT Code-brygga i webbläsarappen och klistra in båda värdena.", uk: "У застосунку браузера відкрийте Налаштування → Підключитися до локального мосту VT Code і вставте обидва значення.", hi: "ब्राउज़र ऐप में सेटिंग → स्थानीय VT Code ब्रिज से कनेक्ट करें खोलें और दोनों मान चिपकाएँ।", pl: "W aplikacji przeglądarki otwórz Ustawienia → Połącz z lokalnym mostem VT Code i wklej obie wartości.", tr: "Tarayıcı uygulamasında Ayarlar → Yerel VT Code köprüsüne bağlan seçeneğini açıp iki değeri yapıştırın.", ru: "В приложении браузера откройте Настройки → Подключиться к локальному мосту VT Code и вставьте оба значения.", id: "Di app browser, buka Pengaturan → Hubungkan ke bridge VT Code lokal dan tempel kedua nilai."}
