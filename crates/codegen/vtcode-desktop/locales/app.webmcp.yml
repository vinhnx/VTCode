    attachments_error: {en: "Run /webmcp commands without draft attachments; the attachments are still in the composer.", vi: "Chạy lệnh /webmcp mà không kèm tệp đính kèm nháp; các tệp vẫn còn trong trình soạn.", es: "Ejecuta comandos /webmcp sin adjuntos de borrador; los adjuntos siguen en el editor.", fr: "Exécutez les commandes /webmcp sans pièces jointes de brouillon ; elles sont toujours dans l'éditeur.", ja: "/webmcpコマンドは下書きの添付ファイルなしで実行してください。添付ファイルはコンポーザーに残っています。", de: "Führe /webmcp-Befehle ohne Entwurfsanhänge aus; die Anhänge bleiben im Composer.", it: "Esegui i comandi /webmcp senza allegati bozza; gli allegati restano nel compositore.", zh-CN: "请在无草稿附件时运行 /webmcp 命令；附件仍保留在编辑器中。", zh-TW: "請在無草稿附件時執行 /webmcp 命令；附件仍保留在編輯器中。", zh-HK: "請在無草稿附件時執行 /webmcp 命令；附件仍保留在編輯器中。", pt-BR: "Execute comandos /webmcp sem anexos de rascunho; os anexos permanecem no composer.", ko: "초안 첨부 파일 없이 /webmcp 명령을 실행하세요. 첨부 파일은 작성기에 남아 있습니다.", nl: "Voer /webmcp-opdrachten uit zonder conceptbijlagen; de bijlagen blijven in de editor.", sv: "Kör /webmcp-kommandon utan utkastbilagor; bilagorna finns kvar i kompositören.", uk: "Запускайте команди /webmcp без вкладень чернетки; вкладення залишаються в редакторі.", hi: "ड्राफ़्ट संलग्नकों के बिना /webmcp कमांड चलाएँ; संलग्नक संपादक में बने रहेंगे।", pl: "Uruchamiaj polecenia /webmcp bez załączników roboczych; załączniki pozostają w edytorze.", tr: "Taslak ekleri olmadan /webmcp komutlarını çalıştırın; ekler oluşturucuda durur.", ru: "Запускайте команды /webmcp без вложений черновика; вложения остаются в редакторе.", id: "Jalankan perintah /webmcp tanpa lampiran draf; lampiran tetap di penyusun."}
