[package]
name = "vtcode-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.98.1"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "Local macOS desktop workspace for VT Code"
license.workspace = true
publish = false
readme = "README.md"

[[bin]]
name = "vtcode-desktop"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = { workspace = true }
gpui-kit = "=0.8.0"
pulldown-cmark = "0.13.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
vtcode-commons = { workspace = true }
vtcode-desktop-protocol = { workspace = true }
vtcode-exec-events = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }

