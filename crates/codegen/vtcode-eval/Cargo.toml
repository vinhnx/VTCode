[package]
name = "vtcode-eval"
version.workspace = true
edition = "2024"
rust-version = "1.99.1"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "Agent evaluation framework for VT Code: pass@k / pass^k metrics, capability and regression evals, and environment-based outcome verification."
license.workspace = true
readme = "README.md"
homepage = "https://github.com/vinhnx/vtcode"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-eval"
keywords = ["vtcode", "agent", "evaluation", "metrics", "testing"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# This crate does not inherit the broader workspace lint policy yet. Keep the
# workspace's API-style checks explicit here without changing unrelated lints.
# The panic-safety family is adopted so new code cannot introduce
# unwrap/expect/indexing/slicing panics without a warning (production code is
# already clean of them; full workspace adoption stays blocked on missing_docs).
[lints.clippy]
borrowed_box = "warn"
ptr_arg = "warn"
should_implement_trait = "warn"
wrong_self_convention = "warn"
new_without_default = "warn"
len_without_is_empty = "warn"
derivable_impls = "warn"
unnecessary_unwrap = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unchecked_time_subtraction = "warn"
