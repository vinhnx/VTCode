[package]
name = "vtcode-acp"
version.workspace = true
edition = "2024"
rust-version = "1.100.0"
authors = ["Vinh Nguyen"]
description = "ACP bridge and client implementation for VT Code"
license.workspace = true
readme = "README.md"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-acp"
keywords = ["vtcode", "acp", "zed", "agent", "bridge"]
categories = ["api-bindings", "development-tools", "text-editors"]

[dependencies]
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hashbrown = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
percent-encoding = "2.3"
vtcode-core = { workspace = true, default-features = false }
vtcode-config = { workspace = true }
vtcode-commons = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
