[package]
name = "vtcode-safety"
version.workspace = true
edition = "2024"
rust-version = "1.98.1"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "Command safety detection, execution policies, and sandboxing for VT Code"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/vinhnx/vtcode"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-safety"
categories = ["development-tools"]
keywords = ["vt", "safety", "sandbox", "policy", "command"]

[dependencies]
anyhow = { workspace = true }
dirs = { workspace = true }
hashbrown = { workspace = true }
lru = "0.18"
nix = { workspace = true, features = ["user", "signal", "process", "resource"] }
once_cell = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-util = { workspace = true, features = ["codec"] }
toml = { workspace = true }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tracing = { workspace = true }
vtcode-commons = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = { workspace = true }
seccompiler = "0.5"

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "shell_classification"
harness = false

[[bench]]
name = "execution_policy"
harness = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
