[package]
name = "vtcode-macros"
version.workspace = true
edition = "2024"
rust-version = "1.100.0"
authors = ["Vinh Nguyen"]
description = "Procedural macros for VT Code"
license.workspace = true
readme = "README.md"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-macros"
keywords = ["macros", "proc-macro", "vtcode", "codegen"]
categories = ["development-tools"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
proc-macro2 = { workspace = true }
