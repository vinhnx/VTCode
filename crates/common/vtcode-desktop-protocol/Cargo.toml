[package]
name = "vtcode-desktop-protocol"
version.workspace = true
edition.workspace = true
rust-version = "1.99.1"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "Versioned JSON-RPC protocol shared by VT Code desktop hosts"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/vinhnx/vtcode"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-desktop-protocol"
categories = ["development-tools", "network-programming"]
keywords = ["vtcode", "desktop", "json-rpc", "protocol"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
url = { workspace = true }
vtcode-commons = { workspace = true }
vtcode-exec-events = { workspace = true }

