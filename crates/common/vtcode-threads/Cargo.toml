[package]
name = "vtcode-threads"
version.workspace = true
edition.workspace = true
rust-version = "1.99.1"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "Thread identifiers and lifecycle types extracted from vtcode-core for independent builds."
license.workspace = true
readme = "README.md"
homepage = "https://github.com/vinhnx/vtcode"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-threads"
keywords = ["vtcode", "thread", "session", "agent"]
categories = ["development-tools", "data-structures"]

[lib]
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde"] }
vtcode-macros = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]
