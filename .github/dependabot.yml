version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    # Let fresh releases settle before Dependabot proposes them. Workflow
    # actions are resolved through .github/workflows/actions.lock, so a PR
    # updates both the workflow ref and its locked commit together.
    cooldown:
      default: 7

  # Maintain dependencies for Rust/Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      # Group all Rust dependencies together
      all-rust-deps:
        patterns:
          - "*"

  # Maintain JS dependencies (repo toolchain is bun; the npm ecosystem entry
  # keys off package.json files). Dependabot does not refresh bun.lock, so
  # every merged bump must run `bun install` in the touched directory first.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5