version: 2
# A 7-day cooldown keeps freshly published (potentially compromised) releases
# out of automated PRs. The key is `default-days` — `default` is silently
# ignored by Dependabot. Enforced by zizmor's dependabot-cooldown audit in CI.
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    # Workflow actions are resolved through .github/workflows/actions.lock, so
    # a PR updates both the workflow ref and its locked commit together.
    cooldown:
      default-days: 7

  # Maintain dependencies for Rust/Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # Group all Rust dependencies together
      all-rust-deps:
        patterns:
          - "*"

  # Maintain JS dependencies (repo toolchain is bun; the npm ecosystem entry
  # keys off package.json files). Dependabot does not refresh bun.lock, so
  # every merged bump must run `bun install` in the touched directory first.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
