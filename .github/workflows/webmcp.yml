name: Deploy WebMCP application

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/webmcp.yml
      - apps/webmcp/**

concurrency:
  group: webmcp-app-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static WebMCP application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install browser dependencies
        working-directory: apps/webmcp
        run: bun install --frozen-lockfile

      - parallel:
          - name: Typecheck browser editor
            working-directory: apps/webmcp
            run: bun run typecheck

          - name: Test browser editor
            working-directory: apps/webmcp
            run: bun run test

      - name: Build Vite editor
        working-directory: apps/webmcp
        env:
          VITE_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.WEBMCP_ORIGIN_TRIAL_TOKEN }}
          VITE_WEBMCP_ORIGIN_TRIAL_TOKENS: ${{ vars.WEBMCP_ORIGIN_TRIAL_TOKENS }}
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload WebMCP application artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/webmcp/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
