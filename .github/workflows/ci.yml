name: "CI Pipeline"
permissions: {}

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      - "**.yml"
      - "**.yaml"
      - "**.json"
      - "**.js"
      - "**.ts"
      - "**.md" # Still run on markdown changes since we have markdown linting
      - "scripts/**"
      - "!.github/dependabot.yml" # Exclude dependabot changes
      - "!.gitignore"
      - "!.vtcodegitignore"
      - "!.env*"
  pull_request:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      - "**.yml"
      - "**.yaml"
      - "**.json"
      - "**.js"
      - "**.ts"
      - "**.md" # Still run on markdown changes since we have markdown linting
      - "scripts/**"
      - "!.github/dependabot.yml" # Exclude dependabot changes
      - "!.gitignore"
      - "!.vtcodegitignore"
      - "!.env*"

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: "-D warnings"

# Set default shell and working directory
defaults:
  run:
    shell: bash

# ensure that the workflow is only triggered once per PR,  subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Make obvious and fast tests to run first, to catch issues as early as possible
jobs:
  workflow-security:
    name: Workflow Security Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce workflow security invariants
        run: bash scripts/check_workflow_security.sh

  large-files:
    name: Check Custom Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - parallel:
          - name: Check tracked file sizes
            run: python3 scripts/check_large_files.py 400000
          - name: Check markdown documentation location
            run: python3 scripts/check_markdown_location.py
          - name: Check core docs link integrity
            run: python3 scripts/check_docs_links.py

  zen-governance:
    name: Zen Governance (Warn)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - parallel:
          - name: Rust file length baseline
            run: python3 scripts/check_rust_file_length.py --mode warn --max-lines 500
          - name: unwrap/expect baseline
            run: python3 scripts/check_no_unwrap_expect_prod.py --mode warn --allowlist scripts/zen_allowlist.txt
          - name: allowlist hygiene baseline
            run: python3 scripts/check_zen_allowlist.py --mode warn --allowlist scripts/zen_allowlist.txt

  unwrap-expect-enforcement:
    name: Unwrap/Expect Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce production unwrap/expect policy
        run: python3 scripts/check_no_unwrap_expect_prod.py --mode enforce --allowlist scripts/zen_allowlist.txt

  # Lint the formatting of the codebase.
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Check for typos in the codebase.
  # See <https://github.com/crate-ci/typos/>
  # lint-typos:
  #   name: Check Typos
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: crate-ci/typos@master

  # Check for any disallowed dependencies in the codebase due to license / security issues.
  # See <https://github.com/EmbarkStudios/cargo-deny>
  # dependencies:
  #   name: Check Dependencies
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: EmbarkStudios/cargo-deny-action@v2

  # Verify THIRD-PARTY-NOTICES is in sync with Cargo.lock.
  # See <https://github.com/EmbarkStudios/cargo-about>
  license-notices:
    name: Check License Notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190 # v2
        with:
          # Pin cargo-about so CI-generated output matches local generation.
          tool: cargo-about@0.9.1
      - name: Check THIRD-PARTY-NOTICES is up to date
        run: scripts/generate-notices.sh --check

  # Run cargo clippy.
  lint-clippy:
    name: Check Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      RUSTC_WRAPPER: "sccache"
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { components: clippy }
      # Toolchain setup must finish before the cache computes compiler metadata.
      - parallel:
          - name: Restore Cargo cache
            uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
            with:
              cache-bin: false
          - name: Set up sccache
            uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo clippy --locked --jobs 4

  # Check for unmaintained dependencies.
  # See docs/guides/cargo-unmaintained.md for more information.
  unmaintained:
    name: Check Unmaintained Dependencies
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-unmaintained
        uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190 # v2
        with:
          tool: cargo-unmaintained@1.10.0
      - name: Check for unmaintained dependencies
        run: cargo unmaintained --no-warnings

  dependency-audit:
    name: Check RustSec Advisories
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked dependencies against RustSec
        run: cargo audit --file Cargo.lock

  # Lint maintained, tracked Markdown with the shared local selector.
  lint-markdown:
    name: Check Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'scripts/check_markdown.py'
              - 'scripts/tests/test_check_markdown.py'
              - 'scripts/generate_config_field_reference.py'
              - 'scripts/generate_docs_map.py'
              - 'scripts/tests/test_generate_config_field_reference.py'
              - 'scripts/update-contributors-readme.sh'
              - '.github/workflows/ci.yml'
              - '!target/**'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.filter.outputs.markdown == 'true'
        with:
          node-version: '24'
      - parallel:
          - name: Test check_markdown selector
            run: python3 scripts/tests/test_check_markdown.py
          - name: Test config reference generator
            run: python3 scripts/tests/test_generate_config_field_reference.py
          - name: Lint maintained Markdown
            run: python3 scripts/check_markdown.py
        if: steps.filter.outputs.markdown == 'true'

  check-cross-platform:
    name: Cross-platform check ${{ matrix.os }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: ["stable"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      RUSTC_WRAPPER: "sccache"
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      # Toolchain setup must finish before the cache computes compiler metadata.
      - parallel:
          - name: Restore Cargo cache
            uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
            with:
              cache-bin: false
          - name: Set up sccache
            uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo check --locked --jobs 4

  check-windows:
    name: Check Windows (warm cache)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - parallel:
          - name: Restore Cargo cache
            uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
            with:
              key: x86_64-pc-windows-msvc
              cache-bin: false
          - name: Install cargo-nextest
            uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190 # nextest
            with:
              tool: cargo-nextest@0.9.140
              fallback: none
      - name: Check Windows workspace (deny warnings)
        shell: bash
        run: cargo check --locked --target x86_64-pc-windows-msvc --workspace --all-targets --jobs 4
      - name: Clippy Windows workspace (deny warnings)
        shell: bash
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --workspace --all-targets --jobs 4 -- -D warnings

      - name: Windows UI accessibility and input regressions
        shell: bash
        run: >-
          cargo nextest run --locked --config-file .github/nextest.toml
          --target x86_64-pc-windows-msvc --profile ci-windows-ui
          -p vtcode-ui -E 'test(thinking) | test(reduce_motion) | test(screen_reader) | test(tool_output_viewer) | test(queue_inputs) | test(input_navigation) | test(slash_palette) | test(events::tests)'
      - name: Windows terminal and private-file persistence regressions
        shell: bash
        run: >-
          cargo nextest run --locked --config-file .github/nextest.toml
          --target x86_64-pc-windows-msvc --profile ci-windows-terminal
          -p vtcode-core -p vtcode-commons -E 'test(terminal_setup) | test(terminal_detection) | test(memory_envelope::persistence_tests) | test(private_file_writer)'

  test:
    name: "Cargo nextest"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      RUSTC_WRAPPER: "sccache"
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: "dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8" # stable
        with:
          toolchain: "stable"

      # Toolchain setup must finish before the cache computes compiler metadata.
      - parallel:
          - name: Restore Cargo cache
            uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
            with:
              cache-bin: false
          - name: Set up sccache
            uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
          - name: Install cargo-nextest
            uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190 # nextest
            with:
              tool: cargo-nextest@0.9.140
              fallback: none

      - name: Test nextest report isolation
        run: python3 scripts/tests/test_ci_nextest_reports.py

      - name: Run tests
        run: cargo nextest run --locked --config-file .github/nextest.toml --profile ci --cargo-profile ci --build-jobs 4

      - name: Run focused harness PTY/TUI regressions
        if: success() || failure()
        # Batch independent suites in nextest, reusing the main test build profile.
        run: >-
          cargo nextest run --locked --config-file .github/nextest.toml
          --profile ci-harness --cargo-profile ci --build-jobs 4 --test-threads 4
          -p vtcode-core -p vtcode-bash-runner -p vtcode
          -E 'binary(/^pty_tests$/) | binary(/^pipe_tests$/) | (binary(/^vtcode$/) & test(inline_events::tests))'

  msrv:
    name: MSRV Check (1.98.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo check --locked --jobs 4

  nightly:
    name: Nightly Smoke Test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo check --locked --jobs 4

