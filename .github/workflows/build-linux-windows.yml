name: Build Linux and Windows Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., 0.81.2)"
        required: true
        type: string
      build_windows:
        description: "Also build Windows x86_64 binary"
        required: false
        type: boolean
        default: true
      compiler_cache_pilot:
        description: "Experiment with sccache for native GNU Linux and Windows builds"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "Tag to build (e.g., 0.81.2)"
        required: true
        type: string
      build_windows:
        description: "Also build Windows x86_64 binary"
        required: false
        type: boolean
        default: true
      compiler_cache_pilot:
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: true

# This repo is public, so standard ubuntu-latest and windows-latest runners
# are free and do not consume any account quota. See:
# https://docs.github.com/billing/managing-billing-for-github-actions/about-billing-for-github-actions
# - Linux builds run on ubuntu-latest using Cross
# - Windows build is on by default and can be disabled per-run via input
# - Minimal artifact retention (2 days, already-compressed archives)
# - Efficient caching

jobs:
  build-linux-gnu:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      RUSTC_WRAPPER: ${{ inputs.compiler_cache_pilot && 'sccache' || '' }}
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - name: Wait for tag to exist
        shell: bash
        # Must stay inline: a local `uses: ./...` cannot run before
        # actions/checkout because the action file is not in the workspace yet.
        run: |
          for i in $(seq 1 12); do
            if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${{ inputs.tag }}"; then
              echo "Tag ${{ inputs.tag }} found"
              exit 0
            fi
            echo "Tag ${{ inputs.tag }} not found yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Tag ${{ inputs.tag }} does not exist after 120s" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # All matrix targets run on ubuntu-latest and pass --target via the CLI,
      # so rust-cache otherwise computes one shared cache key for every job. The
      # parallel saves then collide ("another job may be creating this cache"),
      # each save fails, and every target ends up restoring a partial/mismatched
      # cache (full match: false) and recompiles its whole dependency tree.
      # Namespace per target so each job owns its own cache entry and saves win.
      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - name: Set up compiler cache pilot
        if: ${{ inputs.compiler_cache_pilot }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build with cargo (${{ matrix.target }})
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --locked --profile release-fast --target ${{ matrix.target }} --features allocator-jemalloc --jobs 4
        shell: bash
        env:
          # opt-level="z" is inherited from [profile.release] via release-fast.
          # --gc-sections removes unreferenced functions/data that survive thin
          # LTO (release-fast uses lto="thin", codegen-units=4 for faster CI).
          # Rust emits -ffunction-sections -fdata-sections in release mode, so
          # --gc-sections can safely discard the dead sections at link time.
          RUSTFLAGS: ${{ startsWith(matrix.target, 'x86_64') && '-C target-cpu=x86-64 -C link-arg=-Wl,--gc-sections' || '-C link-arg=-Wl,--gc-sections' }}

      - name: Verify Linux TLS linkage
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          check_absent() {
            local package="$1"
            local tree_output

            set +e
            tree_output="$(cargo tree -e normal -i "$package" --target "${{ matrix.target }}" 2>&1)"
            local status=$?
            set -e

            if printf '%s\n' "$tree_output" | grep -Eq "^${package} v"; then
              echo "${package} detected in Linux dependency graph" >&2
              printf '%s\n' "$tree_output" >&2
              exit 1
            fi

            if [ "$status" -ne 0 ] \
              && ! printf '%s\n' "$tree_output" | grep -Eq "nothing to print\\.|did not match any packages"; then
              echo "Failed to inspect ${package} dependency graph" >&2
              printf '%s\n' "$tree_output" >&2
              exit "$status"
            fi
          }

          check_absent native-tls
          check_absent openssl-sys
          echo "Linux dependency graph is rustls-only (no native-tls/openssl-sys)"

      - name: Report compiler cache statistics
        if: ${{ always() && inputs.compiler_cache_pilot }}
        shell: bash
        run: sccache --show-stats

      - name: Check Binary
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release-fast/vtcode" ]; then
            echo "Found Unix binary: vtcode"
            # Report binary size for cold-start tracking (smaller binary = faster dyld load)
            BINARY_SIZE=$(stat -c %s "target/${{ matrix.target }}/release-fast/vtcode" 2>/dev/null || stat -f %z "target/${{ matrix.target }}/release-fast/vtcode" 2>/dev/null || echo "unknown")
            BINARY_SIZE_H=$(du -h "target/${{ matrix.target }}/release-fast/vtcode" 2>/dev/null | awk '{print $1}')
            echo "Binary size: ${BINARY_SIZE_H} (${BINARY_SIZE} bytes)"
          else
            echo "Binary not found!" && exit 1
          fi

      - name: Generate man pages from the release binary
        shell: bash
        run: |
          binary=target/x86_64-unknown-linux-gnu/release-fast/vtcode
          man_help=$("$binary" man --help)
          if grep -Eq '(^|[[:space:]])--all-pages([[:space:]]|$)' <<< "$man_help"; then
            "$binary" man --all-pages --output man/man1
          else
            # Older tags predate --all-pages; preserve their release rebuild path.
            cargo run --locked -p xtask -- gen-man --out-dir man/man1
          fi

      - name: Upload man pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: man-pages
          path: man/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Package
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release-fast/vtcode" stage/
          cp -R man stage/
          tar -C stage -czf "vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz" .
          if command -v sha256sum &> /dev/null; then
            sha256sum vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz > vtcode-${{ inputs.tag }}-${{ matrix.target }}.sha256
          elif command -v shasum &> /dev/null; then
            shasum -a 256 vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz > vtcode-${{ inputs.tag }}-${{ matrix.target }}.sha256
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vtcode-${{ inputs.tag }}-${{ matrix.target }}
          path: |
            vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
            vtcode-${{ inputs.tag }}-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  build-linux:
    name: Build (${{ matrix.target }})
    # Deliberately not dependent on build-linux-gnu: the two cross targets
    # compile immediately instead of idling ~6 min behind it. The only coupling
    # is the shared man-pages artifact, fetched with a bounded wait after these
    # binaries are built — see "Download man pages".
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Reading artifact metadata via `gh api .../actions/artifacts` needs the
      # `actions` scope; specifying `permissions` zeroes all unnamed scopes.
      actions: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu

    steps:
      - name: Wait for tag to exist
        shell: bash
        # Must stay inline: a local `uses: ./...` cannot run before
        # actions/checkout because the action file is not in the workspace yet.
        run: |
          for i in $(seq 1 12); do
            if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${{ inputs.tag }}"; then
              echo "Tag ${{ inputs.tag }} found"
              exit 0
            fi
            echo "Tag ${{ inputs.tag }} not found yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Tag ${{ inputs.tag }} does not exist after 120s" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # All matrix targets run on ubuntu-latest and pass --target via the CLI,
      # so rust-cache otherwise computes one shared cache key for every job. The
      # parallel saves then collide ("another job may be creating this cache"),
      # each save fails, and every target ends up restoring a partial/mismatched
      # cache (full match: false) and recompiles its whole dependency tree.
      # Namespace per target so each job owns its own cache entry and saves win.
      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cross
        uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190 # v2
        with:
          tool: cross

      - name: Build with cross (${{ matrix.target }})
        run: cross build --locked --profile release-fast --target ${{ matrix.target }} ${{ endsWith(matrix.target, 'linux-gnu') && ' --features allocator-jemalloc' || '' }} --jobs 4
        shell: bash
        env:
          RUSTFLAGS: ${{ startsWith(matrix.target, 'x86_64') && '-C target-cpu=x86-64 -C link-arg=-Wl,--gc-sections' || '-C link-arg=-Wl,--gc-sections' }}

      - name: Check Binary
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release-fast/vtcode" ]; then
            echo "Found Unix binary: vtcode"
            # Report binary size for cold-start tracking (smaller binary = faster dyld load)
            BINARY_SIZE=$(stat -c %s "target/${{ matrix.target }}/release-fast/vtcode" 2>/dev/null || stat -f %z "target/${{ matrix.target }}/release-fast/vtcode" 2>/dev/null || echo "unknown")
            BINARY_SIZE_H=$(du -h "target/${{ matrix.target }}/release-fast/vtcode" 2>/dev/null | awk '{print $1}')
            echo "Binary size: ${BINARY_SIZE_H} (${BINARY_SIZE} bytes)"
          else
            echo "Binary not found!" && exit 1
          fi

      - name: Download man pages
        shell: bash
        # build-linux-gnu runs concurrently with this job (no `needs:`), so its
        # man-pages artifact may not exist yet. Wait for it, bounded by ~10 min;
        # `timeout-minutes: 45` remains the backstop. Fail closed: shipping an
        # archive without man pages is worse than failing the release.
        #
        # Ask the API whether the artifact exists rather than scraping `gh`
        # stderr. A not-yet-uploaded artifact and a real 404 both exit non-zero
        # with human-readable text ("no artifact matches ..." vs
        # "HTTP 404: Not Found"), so message matching cannot tell "wait" from
        # "give up". `gh api` separates them: any non-zero here is a genuine
        # API/auth failure and fails immediately.
        run: |
          set -euo pipefail
          artifacts_api="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          jobs_api="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"

          for i in $(seq 1 40); do
            names=$(gh api --paginate "$artifacts_api" --jq '.artifacts[].name')

            if grep -qx man-pages <<<"$names"; then
              # Clean before extracting so a retry is never additive.
              rm -rf man
              gh run download "$GITHUB_RUN_ID" --name man-pages --dir man
              if ! find man/man1 -name '*.1' -print -quit | grep -q .; then
                echo "::error::man-pages artifact contained no pages" >&2
                exit 1
              fi
              echo "Downloaded man-pages artifact"
              exit 0
            fi

            producer_failure=$(gh api --paginate "$jobs_api" --jq \
              '.jobs[] | select(.name == "Build (x86_64-unknown-linux-gnu)") | select(.status == "completed" and .conclusion != "success") | .conclusion')
            if [[ -n "$producer_failure" ]]; then
              echo "::error::build-linux-gnu finished with conclusion '$producer_failure' before publishing man-pages" >&2
              exit 1
            fi

            echo "man-pages not available yet (attempt $i/40)"
            if [[ "$i" -lt 40 ]]; then
              sleep 15
            fi
          done
          echo "::error::man-pages artifact was not produced by build-linux-gnu" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release-fast/vtcode" stage/
          cp -R man stage/
          tar -C stage -czf "vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz" .
          if command -v sha256sum &> /dev/null; then
            sha256sum vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz > vtcode-${{ inputs.tag }}-${{ matrix.target }}.sha256
          elif command -v shasum &> /dev/null; then
            shasum -a 256 vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz > vtcode-${{ inputs.tag }}-${{ matrix.target }}.sha256
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vtcode-${{ inputs.tag }}-${{ matrix.target }}
          path: |
            vtcode-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
            vtcode-${{ inputs.tag }}-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  build-windows:
    if: ${{ inputs.build_windows }}
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      RUSTC_WRAPPER: ${{ inputs.compiler_cache_pilot && 'sccache' || '' }}
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - name: Wait for tag to exist
        shell: bash
        # Must stay inline: a local `uses: ./...` cannot run before
        # actions/checkout because the action file is not in the workspace yet.
        run: |
          for i in $(seq 1 12); do
            if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${{ inputs.tag }}"; then
              echo "Tag ${{ inputs.tag }} found"
              exit 0
            fi
            echo "Tag ${{ inputs.tag }} not found yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Tag ${{ inputs.tag }} does not exist after 120s" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Set up compiler cache pilot
        if: ${{ inputs.compiler_cache_pilot }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build (x86_64-pc-windows-msvc)
        # --locked (not --frozen): --frozen implies --offline, and a
        # prefix-hit cache restore can lack index metadata for the current
        # lockfile ("no matching package ... found" with no network to heal).
        # --locked still pins the lockfile but permits downloads, matching
        # the Linux jobs. See run 38934744656 / job 117087298931.
        run: cargo build --locked --profile release-fast-windows --target x86_64-pc-windows-msvc --jobs 4
        shell: bash

      - name: Report compiler cache statistics
        if: ${{ always() && inputs.compiler_cache_pilot }}
        shell: bash
        run: sccache --show-stats

      - name: Check Binary
        shell: bash
        run: |
          if [ -f "target/x86_64-pc-windows-msvc/release-fast-windows/vtcode.exe" ]; then
            echo "Found Windows binary: vtcode.exe"
            # Report binary size for cold-start tracking
            FILE_SIZE=$(stat -c %s "target/x86_64-pc-windows-msvc/release-fast-windows/vtcode.exe" 2>/dev/null || wc -c < "target/x86_64-pc-windows-msvc/release-fast-windows/vtcode.exe" | tr -d ' ')
            echo "Binary size: ${FILE_SIZE} bytes"
          else
            echo "Binary not found!" && exit 1
          fi

      - name: Package
        shell: pwsh
        run: |
          $archive = "vtcode-${{ inputs.tag }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release-fast-windows/vtcode.exe" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "vtcode-${{ inputs.tag }}-x86_64-pc-windows-msvc.sha256" -Value $hash -NoNewline

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vtcode-${{ inputs.tag }}-x86_64-pc-windows-msvc
          path: |
            vtcode-${{ inputs.tag }}-x86_64-pc-windows-msvc.zip
            vtcode-${{ inputs.tag }}-x86_64-pc-windows-msvc.sha256
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
