name: Dependency audit

# RustSec advisories, license compliance, duplicate deps, and crate sources are
# checked by cargo-deny using the policy in deny.toml at the repo root, while
# third-party audit provenance is checked by cargo-vet using supply-chain/ at
# the repo root (Mozilla + Google audit imports, exemptions ratcheted down over
# time). The weekly schedule keeps auditing the lockfile even when no PR touches
# it, so a newly published advisory against an already-locked dependency fails
# here without any code change. Note: schedule events always run on the default
# branch and ignore path filters.
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/package.json"
      - "**/bun.lock"
      - "deny.toml"
      - "supply-chain/**"
      - ".github/workflows/deny.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "**/package.json"
      - "**/bun.lock"
      - "deny.toml"
      - "supply-chain/**"
      - ".github/workflows/deny.yml"
  schedule:
    # Every Monday 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # cargo-deny-action provisions its own pinned Rust toolchain inside its
      # Docker image; no dtolnay/rust-toolchain step is needed here.
      # --locked keeps cargo-deny from re-resolving Cargo.lock during graph
      # generation, so the audit always reflects the committed lockfile.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --locked

  cargo-vet:
    name: Cargo vet check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0

      - name: Install cargo-vet
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-vet

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-audit

      # --locked reuses the committed imports.lock without fetching new upstream
      # audits, so the check is deterministic. Refresh imports explicitly with
      # plain `cargo vet` and commit the updated lock.
      - name: Run cargo-vet
        run: cargo vet --locked
        shell: bash

      # Graph-based checks can omit optional packages recorded in Cargo.lock.
      # cargo-deny already checks yanks on the configured release targets.
      - name: Audit the complete Cargo lockfile
        run: cargo audit --no-yanked

  bun-audit:
    name: Bun lockfile advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Audit repository tooling
        run: bun audit

      - name: Audit WebMCP
        working-directory: apps/webmcp
        run: bun audit

      - name: Audit the computer-use browser helper
        working-directory: crates/codegen/vtcode-computer-use/browser
        run: bun audit
